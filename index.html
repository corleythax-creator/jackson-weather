<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily weather, 2026</title>
<style>
  :root{
    color-scheme:dark;
    --paper:#16212A; --ink:#E6EDEC; --ink-soft:#8CA0A6; --rule:#2E3E48;
    --hot:#E8713C; --cold:#5FAAD2; --rain:#4FA5A8; --soil:#B79A63;
    --solar:#D9A441; --uv:#C77DBA;
    --normal:rgba(190,214,220,.13); --normal-edge:#6E8894; --today:#7FC29B;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:26px 32px 40px;-webkit-text-size-adjust:100%;
  }
  .wrap{max-width:1060px;margin:0 auto}
  h1{
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    font-weight:600;font-size:clamp(20px,2.6vw,26px);line-height:1.1;
    letter-spacing:-.015em;margin:0 0 5px;max-width:26ch;
  }
  /* Wider than 64ch so the same sentence costs fewer lines; it is one paragraph of
     plain prose, not a column of body text. */
  .standfirst{max-width:96ch;color:var(--ink-soft);margin:0 0 12px;font-size:15px;
    line-height:1.4}
  .standfirst b{color:var(--ink);font-weight:600}

  .search{position:relative;max-width:340px;margin:0 0 8px}
  input[type=search]{
    width:100%;font:inherit;font-size:16px;color:var(--ink);background:rgba(255,255,255,.05);
    /* 16px stays: anything smaller and iOS zooms the whole page on focus. */
    border:1px solid var(--rule);border-radius:2px;padding:6px 10px;
  }
  input[type=search]:focus{outline:none;border-color:var(--ink-soft)}
  input[type=search]::placeholder{color:var(--ink-soft)}
  .results{
    position:absolute;z-index:5;left:0;right:0;top:calc(100% + 4px);
    background:#1C2A34;border:1px solid var(--rule);border-radius:2px;
    max-height:280px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .results div{padding:11px 12px;cursor:pointer;font-size:15px;border-bottom:1px solid var(--rule)}
  .results div:last-child{border-bottom:none}
  .results div:hover{background:rgba(255,255,255,.07)}
  .results .where{color:var(--ink-soft);font-size:13px}
  .results .none{cursor:default;color:var(--ink-soft)}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px;min-height:30px}
  .chip{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;
    border:1px solid var(--rule);border-radius:2px;padding:5px 6px 5px 10px}
  .chip .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .chip button{border:none;padding:0 6px;font-size:17px;line-height:1;color:var(--ink-soft);background:none}
  .chip button:hover{color:var(--ink);background:none}
  .chip.busy{opacity:.55}

  figure{margin:0;position:relative}
  svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
  #hit{cursor:crosshair}
  /* NOTE: this beats any fill="..." attribute on a <text>, because a presentation
     attribute sits below every CSS rule in the cascade. Colour a label with an inline
     style="fill:..." instead, or it silently paints this grey. */
  text{fill:var(--ink-soft);font-size:12px}
  .panellabel{fill:var(--ink-soft);font-size:12.5px}
  .gridline{stroke:var(--rule);stroke-width:1}
  .monthrule{stroke:var(--rule);stroke-width:1;stroke-dasharray:2 4}
  .todayline{stroke:var(--today);stroke-width:1.3;opacity:.9}
  .todaylab{fill:var(--today);font-size:11px}
  .normalband{fill:var(--normal)}
  .normaledge{fill:none;stroke:var(--normal-edge);stroke-width:1;stroke-dasharray:3 3;opacity:.85}
  .normalrain,.normalsolar{fill:none;stroke:var(--normal-edge);stroke-width:1;stroke-dasharray:3 3;opacity:.9}
  .meanline{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round}
  .hi{fill:none;stroke:var(--hot);stroke-width:1.2;opacity:.88;stroke-linejoin:round}
  .lo{fill:none;stroke:var(--cold);stroke-width:1.2;opacity:.88;stroke-linejoin:round}
  .cityline{fill:none;stroke-width:1.8;stroke-linejoin:round}
  .soilline{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .soilfill{stroke:none;opacity:.3}
  .midline{stroke:var(--ink-soft);stroke-width:1;opacity:.45;stroke-dasharray:2 4}
  .apiline{fill:none;stroke:var(--rain);stroke-width:1.5;stroke-dasharray:6 3;opacity:.85}
  .solarfill{fill:var(--solar);stroke:none;opacity:.18}
  .solarline{fill:none;stroke:var(--solar);stroke-width:1.6;stroke-linejoin:round}
  .uvline{fill:none;stroke:var(--uv);stroke-width:1.6;stroke-linejoin:round}
  .fc{stroke-dasharray:5 4;opacity:.62}
  .bar{fill:var(--rain)}
  .bar.fcbar{fill:none;stroke:var(--rain);stroke-width:1.1;opacity:.75}
  .hover-rule{stroke:var(--ink);stroke-width:1.6;opacity:.95}
  /* paint-order gives the label a knockout halo, so it stays readable where it
     crosses a line or the normal band. */
  .dlabel{font-size:11px;font-variant-numeric:tabular-nums;
    paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round}
  .dlabel.hotlab{fill:var(--hot)}
  .dlabel.coldlab{fill:var(--cold)}
  .dlabel.wetlab{fill:var(--rain);font-size:10.5px}
  .dnode{font-variant-numeric:tabular-nums;font-weight:600}
  .brush{fill:rgba(230,237,236,.13);stroke:var(--ink);stroke-width:1}

  .controls{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:12px 0 0}
  /* Year and forecast source drive what the chart shows, so they sit above it. */
  .controls.topctl{margin:0 0 9px}
  .controls .sep{flex:1}
  .grp{display:inline-flex;gap:0;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
  /* an author display: rule beats the browser's [hidden], so say it explicitly */
  .grp[hidden]{display:none}
  .grp button{border:none;border-right:1px solid var(--rule);border-radius:0}
  .grp button:last-child{border-right:none}
  .grp button:hover{border-color:var(--rule);background:rgba(255,255,255,.06)}
  .grp button[aria-pressed="true"]:hover{background:var(--ink)}
  button{
    font:inherit;font-size:13.5px;background:none;color:var(--ink);
    border:1px solid var(--rule);padding:6px 12px;border-radius:2px;cursor:pointer;
  }
  button:hover{border-color:var(--ink)}
  button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  button:disabled{opacity:.4;cursor:default}
  button:disabled:hover{border-color:var(--rule)}
  button:focus-visible{outline:2px solid var(--hot);outline-offset:-2px}
  select{
    font:inherit;font-size:13.5px;color:var(--ink);background:#1C2A34;
    border:1px solid var(--rule);border-radius:2px;padding:6px 9px;cursor:pointer;
    color-scheme:dark;
  }
  select:hover{border-color:var(--ink)}
  select:focus-visible{outline:2px solid var(--hot);outline-offset:-2px}
  /* The native popup is a separate surface — it needs its own colours, or the light
     text inherits onto a white list and vanishes. */
  select option{background:#1C2A34;color:#E6EDEC}
  select option:checked{background:#2E3E48}

  /* Five tabs do not fit a phone on one line, so they wrap rather than overflow. */
  .tabs{display:flex;flex-wrap:wrap;gap:0 6px;margin:0 0 10px;
    border-bottom:1px solid var(--rule)}
  .tabs button{
    border:none;border-bottom:2px solid transparent;border-radius:0;
    padding:6px 2px;margin-right:16px;color:var(--ink-soft);background:none;
  }
  .tabs button:hover{color:var(--ink);border-color:var(--rule)}
  .tabs button[aria-pressed="true"]{
    background:none;color:var(--ink);border-bottom-color:var(--hot);
  }
  #soilbtn[aria-pressed="true"]{background:var(--soil);border-color:var(--soil);color:#141B14}
  #solarbtn[aria-pressed="true"]{background:var(--solar);border-color:var(--solar);color:#1B1706}

  .panelpick{display:none;gap:6px;margin:0 0 12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .panelpick button{flex:none}

  .key{display:flex;flex-wrap:wrap;gap:10px 18px;font-size:13px;color:var(--ink-soft);margin:12px 0 2px}
  .key[hidden]{display:none}
  .key i{display:inline-block;width:15px;height:2px;vertical-align:middle;margin-right:7px}
  .key i.swatch{height:11px;background:var(--normal);border-top:1px dashed var(--normal-edge);border-bottom:1px dashed var(--normal-edge)}
  .key i.block{height:11px;background:var(--rain)}
  .key i.dashed{height:0;border-top:2px dashed var(--ink-soft);background:none}
  .key i.grad{height:10px;width:56px;border-radius:1px;
    background:linear-gradient(90deg,#C2542B,#C89A55,#8E9C93,#4E9FAA,#3B8AC4)}
  /* The same ramp the temperature cells use, which is the soil one reversed. */
  .key i.tgrad{height:10px;width:56px;border-radius:1px;
    background:linear-gradient(90deg,#3B8AC4,#4E9FAA,#8E9C93,#C89A55,#C2542B)}
  .msland{fill:rgba(190,214,220,.05);stroke:var(--rule);stroke-width:1.2;
    stroke-linejoin:round}
  /* County lines are the faintest thing on the page — texture, not information.
     Anything more assertive and 82 of them bury the eleven that matter. */
  .mscounty{fill:none;stroke:rgba(190,214,220,.085);stroke-width:.7}
  /* Roads are context, not data — they sit under the markers and must never compete
     with the temperature ramp for attention. */
  .msroad{fill:none;stroke:#3F5764;stroke-width:1;stroke-linejoin:round;
    stroke-linecap:round}
  .msroad.i{stroke:#587787;stroke-width:1.7}
  .msshield rect{fill:#16212A;stroke:#3F5764}
  .msshield.i rect{stroke:#587787}
  .msshield text{fill:#93A8B1;font-size:8.5px;font-weight:600;letter-spacing:.01em}
  .msdot{cursor:pointer}
  .msdot circle{stroke:var(--paper);stroke-width:2.2}
  .msdot:hover circle,.msdot.sel circle{stroke:var(--ink);stroke-width:2.8}
  .msname{fill:var(--ink-soft);font-size:10.5px}
  .msdot.sel .msname{fill:var(--ink)}
  /* A place with no forecast behind it: a smaller, quieter dot and name, so it reads
     as orientation rather than as a station whose number failed to load. */
  .msplace circle{fill:var(--ink-soft);opacity:.55}
  .msplace text{fill:var(--ink-soft);opacity:.75;font-size:7px}
  .mslo{fill:var(--ink-soft);font-size:9.5px}
  .msrank text{font-size:12px}

  .readout{padding:0 0 10px;margin-bottom:10px;border-bottom:1px solid var(--rule)}
  .readout.hoverable{min-height:62px}
  .readout .line{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline}
  .readout .line + .line{margin-top:6px}
  .readout .date{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:19px}
  .readout .who{font-size:14px;min-width:150px}
  .readout .tag,.flyout .tag{font-size:12px;color:var(--paper);background:var(--ink-soft);
    padding:2px 7px;border-radius:2px}
  .readout .span{font-size:12.5px;color:var(--ink-soft)}
  .readout .stat,.flyout .stat{font-size:14px;color:var(--ink-soft)}
  .readout .stat b,.flyout .stat b{font-size:18px;font-weight:600;
    font-variant-numeric:tabular-nums;color:var(--ink)}
  .stat.max b{color:var(--hot)}
  .stat.min b{color:var(--cold)}
  .stat.wet b{color:var(--rain)}
  .stat.dirt b{color:var(--soil)}

  .flyout{
    position:absolute;z-index:8;width:340px;max-width:calc(100% - 16px);
    background:#1C2A34;border:1px solid var(--rule);border-radius:2px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);padding:12px 14px 14px;
  }
  .flyout .hd{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;
    padding-right:20px;margin:0 0 9px}
  .flyout h3{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-weight:600;
    font-size:17px;margin:0 0 2px}
  .flyout .who{color:var(--ink-soft);font-size:12.5px;margin:0}
  .flyout .rank{flex:none;text-align:right;color:var(--ink-soft);font-size:11px;
    line-height:1.25;max-width:106px}
  .flyout .rank b{display:block;color:var(--ink);font-size:20px;font-weight:600;
    font-variant-numeric:tabular-nums;line-height:1.1}
  .flyout .now{font-size:13.5px;margin:0 0 8px}
  .flyout .now b{font-variant-numeric:tabular-nums;font-size:15px}
  .flyout .foot{color:var(--ink-soft);font-size:12.5px;margin:9px 0 0;line-height:1.45}
  .flyout .foot b{color:var(--ink);font-variant-numeric:tabular-nums}
  .flyout .x{position:absolute;top:5px;right:5px;border:none;background:none;
    padding:3px 8px;font-size:18px;line-height:1;color:var(--ink-soft)}
  .flyout .x:hover{color:var(--ink);border:none}

  .stats{margin-top:16px;padding-top:12px;border-top:1px solid var(--rule);font-size:13.5px}
  .stats h2{font:inherit;font-weight:600;font-size:14px;margin:0 0 4px;color:var(--ink)}
  .stats .lede{color:var(--ink-soft);margin:0 0 10px;max-width:78ch}
  .stats .lede b{color:var(--ink)}
  .scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .stats table{border-collapse:collapse;width:100%;min-width:560px;max-width:760px}
  .stats th,.stats td{text-align:right;padding:5px 6px;font-variant-numeric:tabular-nums}
  .stats th:first-child,.stats td:first-child{text-align:left;color:var(--ink-soft);min-width:180px}
  .stats thead th{color:var(--ink-soft);font-weight:400;border-bottom:1px solid var(--rule)}
  .stats td .cell{display:block;padding:2px 5px;border-radius:2px}
  /* A tappable figure still has to read as one of the table's cells. */
  .stats td button.cell{width:100%;border:none;border-radius:2px;font:inherit;
    color:inherit;text-align:right;cursor:pointer;padding:2px 5px}
  .stats td button.cell:hover{border:none;outline:1px solid var(--ink-soft)}
  .stats td button.cell.sel{outline:2px solid var(--ink)}
  .msfly .msbd{border-collapse:collapse;width:100%;font-size:13px;
    font-variant-numeric:tabular-nums}
  .msfly .msbd th{color:var(--ink-soft);font-weight:400;text-align:right;
    padding:0 0 3px;border-bottom:1px solid var(--rule)}
  .msfly .msbd th:first-child{text-align:left}
  .msfly .msbd td{text-align:right;padding:2px 0}
  .msfly .msbd td:first-child{text-align:left;color:var(--ink-soft)}
  .msfly .msbd tr.avg td{color:var(--ink);font-weight:600;padding-bottom:5px;
    border-bottom:1px solid var(--rule)}
  .msfly .msbd tr.active td{color:var(--today)}
  .stats td.best .cell{outline:1px solid var(--ink-soft)}
  .stats .foot{color:var(--ink-soft);margin:12px 0 0;max-width:70ch;font-size:13px}
  .fcthin{fill:none;stroke:var(--ink-soft);stroke-width:1;opacity:.45;stroke-linejoin:round}
  .fcnws{fill:none;stroke:var(--today);stroke-width:1.8;stroke-linejoin:round}
  .fcpick2{fill:none;stroke:var(--hot);stroke-width:2.2;stroke-linejoin:round}
  .fcpick3{fill:none;stroke:var(--cold);stroke-width:2.2;stroke-linejoin:round}
  .stats td .cell b{font-weight:600}
  .stats td .cell i{display:block;font-style:normal;font-size:11px;color:var(--ink-soft)}
  .stats td .who{display:block;font-size:11px;color:var(--ink-soft);font-weight:400}
  .stats th .mon{display:block;font-size:11px;color:var(--ink-soft)}
  /* Which column the map above is showing. */
  .stats thead th.on{color:var(--ink);border-bottom-color:var(--hot)}
  .stats tr.avg td{border-bottom:1px solid var(--rule);padding-bottom:7px}
  .stats tr.avg td:first-child{color:var(--ink);font-weight:600}
  .stats tr.spread td{color:var(--ink-soft)}
  .stats tr.active td{color:var(--ink)}
  .stats tr.active td:first-child{color:var(--ink);font-weight:600}

  footer{margin-top:30px;padding-top:16px;border-top:1px solid var(--rule);
    font-size:13px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  .msg{padding:20px 0;color:var(--ink-soft);max-width:62ch}
  .msg b{color:var(--ink)}
  code{font-size:13px;background:rgba(255,255,255,.09);padding:1px 5px;border-radius:2px}
  .hint{font-size:12.5px;color:var(--ink-soft);margin:10px 0 0}
  @media (prefers-reduced-motion:no-preference){.pending{opacity:.55;transition:opacity .4s}}

  @media (max-width:720px){
    body{padding:15px 14px 30px}
    .standfirst{font-size:14.5px;margin-bottom:11px}
    /* Five tabs need 356px of the 362 a 390px phone offers — the common iPhone
       width fits on one row, and anything narrower wraps rather than truncating. */
    .tabs button{margin-right:6px;font-size:13.5px}
    .controls{gap:6px}
    .panelpick{display:flex}
    .desktop-only{display:none !important}
    .readout .date{font-size:18px}
    .readout .stat b{font-size:17px}
    .key{font-size:12.5px;gap:10px 16px}
    footer{font-size:12.5px}
    /* The forecast table is 17 columns wide. It will still scroll on a phone, but
       dropping the agency sub-labels and the padding roughly halves how far. */
    .stats table{min-width:0}
    .stats th,.stats td{padding:3px 2px;font-size:12px}
    .stats th:first-child,.stats td:first-child{min-width:0;padding-right:6px}
    .stats td .who,.stats th .mon{font-size:10px}
    .stats td .who{display:none}
    .stats td .cell{padding:2px 3px}
    .stats td .cell i{font-size:10px}
  }
</style>

<div class="wrap">
  <h1 id="head">Daily weather, 2026</h1>
  <p class="standfirst" id="stand">Loading&hellip;</p>

  <div class="search">
    <input type="search" id="q" placeholder="Search a city — Memphis, Denver, Lisbon…"
           autocomplete="off" aria-label="Search for a city">
    <div class="results" id="results" hidden></div>
  </div>
  <div class="chips" id="chips"></div>

  <div id="state" class="msg"></div>

  <figure id="fig" hidden>
    <div class="tabs" id="tabs" role="tablist">
      <button data-mode="fc" aria-pressed="true">Forecast</button>
      <button data-mode="ms" aria-pressed="false">Mississippi</button>
      <button data-mode="chart" aria-pressed="false">Timeline</button>
      <button data-mode="hot" aria-pressed="false">Hot days</button>
      <button data-mode="ver" aria-pressed="false">Verification</button>
    </div>
    <div class="controls topctl">
      <select id="yearpick" aria-label="Year"></select>
      <select id="fcpick" aria-label="Forecast source" hidden></select>
      <span class="grp" id="mspick" role="group" aria-label="Day" hidden></span>
    </div>
    <div class="panelpick" id="panelpick" role="tablist" aria-label="Choose a panel"></div>
    <div class="readout" id="readout"><span class="stat">Hover or touch the chart to read a period.</span></div>
    <svg id="chart" viewBox="0 0 1000 512" role="img" aria-labelledby="head"></svg>
    <div class="flyout" id="flyout" hidden></div>
    <div class="flyout msfly" id="msfly" hidden></div>
    <div class="key" id="key"></div>
    <div class="stats" id="fcsrc" hidden></div>
    <div class="controls">
      <span id="hotctl" hidden>
        <label for="thresh" style="color:var(--ink-soft);font-size:13.5px;margin-right:6px">Days at or above</label>
        <select id="thresh" aria-label="Temperature threshold"></select>
      </span>
      <span class="grp" id="granpick" role="group" aria-label="Aggregation" hidden>
        <button data-gran="day" aria-pressed="true">Day</button>
        <button data-gran="week" aria-pressed="false">Week</button>
        <button data-gran="month" aria-pressed="false">Month</button>
      </span>
      <button data-days="0" aria-pressed="true">Everything</button>
      <button data-days="90">90 days</button>
      <button data-days="30">30 days</button>
      <button data-days="7">Week</button>
      <button data-days="-1">Forecast</button>
      <span class="sep"></span>
      <button id="soilbtn" class="desktop-only" aria-pressed="false">Soil moisture</button>
      <button id="solarbtn" class="desktop-only" aria-pressed="false">Solar &amp; UV</button>
      <button id="out">Zoom out</button>
    </div>
    <p class="hint" id="hint2"></p>
    <div class="stats" id="stats" hidden></div>
  </figure>

  <footer>
    <span id="src"></span>
    <button id="dl" hidden>Download CSV</button>
  </footer>
</div>

<script>
const FC_DAYS=16, MAX_CITIES=5, YEAR_MIN=2000;
// The normals window is the WMO standard 30 years, which is also what NWS and the
// consumer apps quote — so "vs normal" here matches what you'd read elsewhere. It is
// deliberately NOT the full record: climate drifts, and averaging 86 years would fold
// a cooler mid-century into the reference and overstate every present-day reading.
const CLIM_FROM=1991, CLIM_TO=2020, SMOOTH=7;
const SOIL_BAND="soil_moisture_7_to_28cm", SOIL_FROM=2016, SOIL_TO=2025, SOIL_WIN=7;
const SOIL_STOPS=[[0,"#C2542B"],[30,"#C89A55"],[50,"#8E9C93"],[70,"#4E9FAA"],[100,"#3B8AC4"]];
// The soil ramp read the other way round: coolest blue, hottest red. Reusing the
// stops the app already ships keeps one colour language rather than two.
const TEMP_STOPS=SOIL_STOPS.map(([p,c])=>[100-p,c]).reverse();
const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
// Position 0-100 along a stop list, linearly interpolated, returned as rgb.
function ramp(pct,stops){
  const p=Math.max(0,Math.min(100,pct));
  for(let i=1;i<stops.length;i++){
    if(p<=stops[i][0]){
      const a=hex2rgb(stops[i-1][1]), b=hex2rgb(stops[i][1]);

/* ---------- buckets: day / week / month ----------
   Buckets are built over the whole date axis, then filtered to the view. That way a
   month stays a whole month even when it's only half on screen — zooming never
   silently changes what a bar sums.                                              */
function weekStart(t){
  const d=new Date(t+"T12:00:00");
  d.setDate(d.getDate()-((d.getDay()+6)%7));   // back to Monday
  return iso(d);
}
function buildBuckets(g){
  if(bucketCache[g]) return bucketCache[g];
  const out=[], byKey=new Map();
  DATES.forEach((t,i)=>{
    const key = g==="day"?t : g==="week"?weekStart(t) : t.slice(0,7);
    let b=byKey.get(key);
    if(!b){ b={key,idxs:[]}; byKey.set(key,b); out.push(b); }
    b.idxs.push(i);
  });
  out.forEach(b=>{
    b.first=DATES[b.idxs[0]]; b.last=DATES[b.idxs[b.idxs.length-1]];
    b.allFc=b.first>OBS_END;
    b.anyFc=b.last>OBS_END;
    b.obs=b.idxs.filter(i=>i<=TODAY_IDX).length;
    // label is what the x axis prints — day of month alone; long is the full date,
    // which the readout and the fly-out still show.
    if(g==="day"){ b.label=String(+b.first.slice(8)); b.long=pretty(b.first); }
    else if(g==="week"){ b.label=String(+b.first.slice(8)); b.long=`${+b.first.slice(8)}–${pretty(b.last)}`; }
    else { const m=+b.key.slice(5)-1; b.label=MONTHS[m]; b.long=MONTHS_FULL[m]; }
  });
  bucketCache[g]=out;
  return out;
}

// Aggregation rules: rainfall SUMS over the period, temperature AVERAGES the daily
// highs and lows, solar stays a per-day mean so periods of different length compare.
function aggCity(city,b){
  let hi=0,lo=0,mn=0,n=0, rain=0,rn=0, solar=0,sn=0, uv=0,un=0, soil=0,so=0, api=0,an=0, cum=null, pop=null, wc=null, est=false;
  b.idxs.forEach(i=>{
    const r=city.byDate.get(DATES[i]); if(!r) return;
    if(b.idxs.length===1) wc=r.wc;   // a week has no single condition to show
    if(r.est) est=true;              // any estimated day taints the bucket
    hi+=r.hi; lo+=r.lo; mn+=r.mean; n++;
    if(r.pr!=null){rain+=r.pr; rn++;}
    if(r.cum!=null) cum=r.cum;                       // running total: last day wins
    if(r.pop!=null) pop=Math.max(pop==null?0:pop,r.pop);   // wettest chance in period
    if(r.solar!=null){solar+=r.solar; sn++;}
    if(r.uv!=null){uv+=r.uv; un++;}
    const sm=city.soil&&city.soil.get(DATES[i]); if(sm){soil+=sm.pct; so++;}
    const ap=city.api&&city.api.pct.get(DATES[i]); if(ap!=null){api+=ap; an++;}
  });
  if(!n) return null;
  return {n, hi:hi/n, lo:lo/n, mean:mn/n, rain:rn?rain:null, cum, pop, wc, est,
          solar:sn?solar/sn:null, uv:un?uv/un:null,
          soilPct:so?soil/so:null, apiPct:an?api/an:null};
}
function aggClim(clim,b){
  let hi=0,lo=0,n=0,pr=0,pn=0,sr=0,sn=0;
  b.idxs.forEach(i=>{
    const c=clim.get(DATES[i].slice(5)); if(!c) return;
    hi+=c.hi; lo+=c.lo; n++;
    if(c.pr!=null){pr+=c.pr; pn++;}
    if(c.sr!=null){sr+=c.sr; sn++;}
  });
  return n?{hi:hi/n,lo:lo/n,pr:pn?pr:null,sr:sn?sr/sn:null}:null;
}

async function runSearch(q){
  const box=$("results");
  try{
    const j=await grab(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=en&format=json`);
    const hits=j.results||[];
    if(!hits.length){ box.innerHTML=`<div class="none">Nothing matched “${esc(q)}”.</div>`; box.hidden=false; return; }
    box.innerHTML=hits.map((h,i)=>{
      const where=[h.admin1,h.country].filter(Boolean).join(", ");
      return `<div data-i="${i}"><span>${esc(h.name)}</span> <span class="where">${esc(where)}</span></div>`;
    }).join("");
    box.hidden=false;
    box.querySelectorAll("[data-i]").forEach(el=>el.onclick=()=>{
      const h=hits[+el.dataset.i];
      box.hidden=true; $("q").value=""; $("q").blur();
      addCity(h.latitude,h.longitude,shortLabel(h));
    });
  }catch(err){ box.innerHTML=`<div class="none">Search is unreachable right now.</div>`; box.hidden=false; }
}
function shortLabel(h){
  const region=h.country_code==="US"?(US[h.admin1]||h.admin1):h.country_code;
  return [h.name,region].filter(Boolean).join(", ");
}

  if(cities.length>=MAX_CITIES){ note(`Five cities is the ceiling — remove one before adding another.`); return; }
  const key=`${lat.toFixed(3)},${lon.toFixed(3)}`;
  if(cities.some(c=>c.key===key)){ note(`${esc(label)} is already on the chart.`); return; }

  const city={key,label,lat,lon,color:nextColor(),byDate:new Map(),
              climRaw:null,clim:null,histRaw:null,histTried:false,histLoading:false,histErr:null,
              soilBase:null,soil:null,api:null,loading:true,id:++seq};
  cities.push(city);
  await loadCity(city);
  if(cities.includes(city)){
    if(mode==="chart"||mode==="hot") maybeLoadClim();
    if(mode==="ver") maybeLoadVer(city);
    maybeLoadSoil();
  }
}

async function loadCity(city){
  usedStale=false;
  city.loading=true; city.byDate=new Map(); city.soil=null; city.api=null;
  city.soilTried=false;
  renderChips(); syncButtons();

  // The forecast endpoint only reaches a couple of weeks back, so it's only useful
  // for the current year; past years come entirely from the archive.
  const reqs=[grabCached(`${archBase}?latitude=${city.lat}&longitude=${city.lon}`
    +`&start_date=${START}&end_date=${OBS_END}${varsA}${units}`,
    "cur", IS_CURRENT?TTL_LIVE:TTL_STATIC)];
  if(IS_CURRENT) reqs.push(grabCached(`https://api.open-meteo.com/v1/forecast?latitude=${city.lat}`
    +`&longitude=${city.lon}${varsF}${units}&past_days=14&forecast_days=${FC_DAYS}`,
    "fc", TTL_LIVE));

  const res=await Promise.allSettled(reqs);
  if(res[0].status==="fulfilled") absorb(city,res[0].value,"archive");
  // ERA5 runs about five days behind, so the archive answers for today with nulls.
  // The real end of observation is the last day it actually returned, not today.
  city.obsEnd=null;
  city.byDate.forEach((r,t)=>{ if(r.src==="archive"&&(!city.obsEnd||t>city.obsEnd)) city.obsEnd=t; });
  if(res[1]&&res[1].status==="fulfilled") absorb(city,res[1].value,"model");
  city.alt={}; city.altTried=false;
  city.ver=null; city.verTried=false; city.verErr=null;

  city.loading=false;
  if(!city.byDate.size){
    cities=cities.filter(c=>c!==city); renderChips(); syncButtons();
    const msgs=res.map(r=>r.status==="rejected"?r.reason.message:null).filter(Boolean);
    const limited=msgs.length&&msgs.every(m=>/\b429\b/.test(m));
    note(limited
      ? `Open-Meteo is rate-limiting this browser, so ${esc(city.label)} can't load right now. `
        +`It clears on its own — try again in a little while. Nothing is wrong with the data.`
      : `Couldn't load ${esc(city.label)} for ${year}`
        +(msgs.length?` — <code>${esc(msgs.join("; "))}</code>`:"")+`.`);
    return;
  }
  city.nwsDays=0; city.nwsMap=null;
  if(IS_CURRENT){
    // Fetched even when another source is driving, so the comparison can show it.
    // Non-US points return 404 here; the model blend just stays in place.
    try{ city.nwsMap=await nwsForecast(city.lat,city.lon); }catch(e){ city.nwsMap=null; }
  }
  applySource(city);
  if(IS_CURRENT&&(mode==="fc"||fcSource!=="nws")) maybeLoadAlt(city);
  // est: on or before today, but not an observation — the ERA5 lag window. Kept
  // because it is the best estimate available, flagged because it is not measured.
  city.byDate.forEach(r=>{ r.est=!r.fc&&r.src!=="archive"; });
  city.estDays=[...city.byDate.values()].filter(r=>r.est).length;
  buildCumulative(city);
  renderChips(); clearNote(); draw();
}

// Year change: the calendar-keyed normals survive, but the year's own series doesn't.
async function reloadYear(){
  const list=cities.slice();
  list.forEach(c=>{ c.clim=null; c.climTried=false; });
  await Promise.all(list.map(c=>loadCity(c)));
  if(cities.length){ maybeLoadClim(); maybeLoadSoil();
    if(mode==="hot") maybeLoadHist(cities.length===1?cities[0]:null);
    draw(); }
}

function absorb(city,json,tag){
  const d=json&&json.daily; if(!d||!d.time) return;
  const get=(k,i)=>(d[k]&&d[k][i]!=null)?d[k][i]:null;
  d.time.forEach((t,i)=>{
    const hi=get("temperature_2m_max",i), lo=get("temperature_2m_min",i);
    if(hi==null||lo==null||t<START||t>HORIZON) return;
    const mn=get("temperature_2m_mean",i), pr=get("precipitation_sum",i),
          sr=get("shortwave_radiation_sum",i), uv=get("uv_index_max",i),
          pop=get("precipitation_probability_max",i), wc=get("weather_code",i);
    const prev=city.byDate.get(t);
    if(prev&&prev.src==="archive"){
      // Observed beats modelled — but UV and rain chance are absent from the
      // archive, so merge those in from the model response.
      if(prev.uv==null&&uv!=null) prev.uv=uv;
      if(prev.pop==null&&pop!=null) prev.pop=pop;
      return;
    }
    city.byDate.set(t,{date:t,hi,lo,mean:mn==null?(hi+lo)/2:mn,pr,
      solar:sr==null?null:sr/3.6, uv, pop, wc, src:tag, fc:t>OBS_END});
  });
}

// Fetched only when a model is actually driving the chart, or when the comparison is
// asked for. The default is NWS, so a normal load costs nothing extra — that request
// was adding a fourth call per reload against an already exhausted quota.
async function maybeLoadAlt(city){
  if(!city||city.altTried) return;
  city.altTried=true;
  try{
    const j=await grabCached(`https://api.open-meteo.com/v1/forecast?latitude=${city.lat}`
      +`&longitude=${city.lon}&daily=temperature_2m_max,temperature_2m_min${units}`
      +`&forecast_days=${FC_DAYS}&models=${ALT_MODELS}`, "alt", TTL_LIVE);
    absorbAlt(city,j);
  }catch(e){ /* the comparison simply stays unavailable */ }
  if(cities.length===1&&cities[0]===city){ applySource(city); draw(); }
}

// Open-Meteo suffixes each model's arrays with its id when several are requested.
function absorbAlt(city,json){
  const d=json&&json.daily; if(!d||!d.time) return;
  FC_MODELS.forEach(m=>{
    if(m.id==="nws") return;
    const hi=d[`temperature_2m_max_${m.id}`], lo=d[`temperature_2m_min_${m.id}`];
    if(!hi||!lo) return;                       // a model can be absent for a location
    const map=new Map();
    d.time.forEach((t,i)=>{ if(hi[i]!=null&&lo[i]!=null) map.set(t,{hi:hi[i],lo:lo[i]}); });
    if(map.size) city.alt[m.id]=map;
  });
}

// One request, made only when the Verification tab is opened. The truth it is scored
// against is already on hand — the archive days in city.byDate — so nothing else is
// fetched. See CLAUDE.md on the request budget.
async function maybeLoadVer(city){
  if(!city||city.verTried) return;
  city.verTried=true; city.verErr=null;
  const leads=[];
  for(let d=1;d<=VER_LEADS;d++) leads.push(`temperature_2m_max_previous_day${d}`);
  try{
    const j=await grabCached(`${verBase}?latitude=${city.lat}&longitude=${city.lon}`
      +`&daily=${leads.join(",")}${units}&past_days=${VER_DAYS}&forecast_days=1`
      +`&models=${ALT_MODELS}`, "ver", TTL_VER);
    // Open-Meteo can fail inside an HTTP 200, so check the shape, not just the status.
    if(!j||!j.daily||!j.daily.time) throw new Error((j&&j.reason)||"no daily block");
    city.ver=j.daily;
  }catch(e){ city.verErr=e.message||String(e); }
  if(cities.length===1&&cities[0]===city&&mode==="ver") draw();
}

// Mean absolute error and bias against the archive's own reading for that day, per
// model per lead time. A model is scored only where there is something measured to
// score it against, so forecast days and the ERA5 lag window are both out.
function verScore(city){
  const d=city.ver; if(!d||!d.time) return null;
  const truth=new Map();
  d.time.forEach(t=>{ const r=city.byDate.get(t);
    if(r&&r.src==="archive"&&!r.fc&&r.hi!=null) truth.set(t,r.hi); });
  if(!truth.size) return null;
  const rows=[];
  FC_MODELS.forEach(m=>{
    if(m.id==="nws") return;          // nobody archives what NWS said last Tuesday
    const leads=[]; let sa=0,sb=0,sn=0;
    for(let L=1;L<=VER_LEADS;L++){
      const arr=d[`temperature_2m_max_previous_day${L}_${m.id}`];
      let a=0,b=0,k=0;
      if(arr) d.time.forEach((t,i)=>{
        const o=truth.get(t), f=arr[i];
        if(o==null||f==null) return;
        a+=Math.abs(f-o); b+=f-o; k++;
      });
      leads.push(k?{mae:a/k,bias:b/k,n:k}:null);
      sa+=a; sb+=b; sn+=k;
    }
    // A model with no archived runs here is absent rather than a row of dashes,
    // the same rule fcRows() follows.
    if(sn) rows.push(Object.assign({},m,{leads,all:{mae:sa/sn,bias:sb/sn,n:sn}}));
  });
  if(!rows.length) return null;
  rows.sort((x,y)=>x.all.mae-y.all.mae);
  const days=[...truth.keys()].sort();
  return {rows,days:days.length,from:days[0],to:days[days.length-1]};
}

// Three requests for eleven cities, settled independently so a rate-limited slice
// costs four cities rather than the whole table. Lazy: nothing is fetched until the
// tab is opened. See CLAUDE.md on the request budget.
async function maybeLoadMs(){
  if(msTried) return;
  msTried=true; msLoading=true; msErr=[];
  const chunks=[];
  for(let i=0;i<MS_CITIES.length;i+=MS_CHUNK) chunks.push(MS_CITIES.slice(i,i+MS_CHUNK));
  const res=await Promise.allSettled(chunks.map(ch=>grabCached(
    `https://api.open-meteo.com/v1/forecast?latitude=${ch.map(c=>c.lat).join(",")}`
    +`&longitude=${ch.map(c=>c.lon).join(",")}`
    +`&daily=temperature_2m_max,temperature_2m_min${units}`
    +`&forecast_days=${MS_DAYS}&models=${ALT_MODELS}`, "ms", TTL_LIVE,
    // A multi-location response is an array, so the default `j.daily` test never
    // matched and these three calls were repeating on every single page load.
    j=>Array.isArray(j)?j.length>0&&j.every(x=>x&&x.daily):!!(j&&j.daily))));
  res.forEach((r,ci)=>{
    if(r.status==="rejected"){ msErr.push(r.reason.message||String(r.reason)); return; }
    // One location comes back as a bare object, several as an array.
    const list=Array.isArray(r.value)?r.value:[r.value];
    chunks[ci].forEach((city,k)=>{
      const days=absorbMs(list[k]&&list[k].daily);
      if(days) msByCity.set(city.name,days);
      else msErr.push(`no data for ${city.name}`);
    });
  });
  // The columns are whatever dates actually arrived, so a short response never
  // leaves a header with nothing under it.
  const seen=new Set();
  msByCity.forEach(m=>m.forEach((_,d)=>seen.add(d)));
  msDays=[...seen].sort().slice(0,MS_DAYS);
  msLoading=false;
  if(mode==="ms") draw();         // the models alone are worth showing straight away

  // NWS is two calls a city and cannot be batched, so it lands second and the table
  // fills in. Four at a time rather than twenty-two at once: weather.gov is a public
  // service and a browser only opens six connections to a host anyway.
  const got=await pool(MS_CITIES,4,c=>nwsForecast(c.lat,c.lon).catch(()=>null));
  MS_CITIES.forEach((c,i)=>{ if(!mergeMsNws(c.name,got[i])) msNwsMissing.push(c.name); });
  msNwsDone=true;
  if(mode==="ms") draw();
}

// Bounded concurrency. Rejections come back as null rather than sinking the batch.
async function pool(items,n,fn){
  const out=new Array(items.length); let i=0;
  await Promise.all(Array.from({length:Math.min(n,items.length)},async()=>{
    while(i<items.length){ const k=i++;
      try{ out[k]=await fn(items[k]); }catch(e){ out[k]=null; } }
  }));
  return out;
}

const prevDay=d=>{ const t=new Date(d+"T12:00:00"); t.setDate(t.getDate()-1);
  return t.toISOString().slice(0,10); };
// NWS pairs a daytime high with the night that *follows* it, the way a phone app
// shows "today 95, tonight 70". Open-Meteo's temperature_2m_min for a date is the
// minimum inside that calendar day, which is the morning low — a different quantity,
// one day earlier. Averaging them as published would mix the two, so the night low
// is filed against the following date, where it is the same thing the models report.
// The high needs no such shift. See CLAUDE.md.
function mergeMsNws(name,nws){
  const days=msByCity.get(name);
  if(!days||!nws||!nws.size) return false;
  const def=FC_MODELS.find(m=>m.id==="nws");
  let any=false;
  days.forEach((rec,d)=>{
    if(rec.per.some(x=>x.id==="nws")) return;      // never fold the same source twice
    const day=nws.get(d), prev=nws.get(prevDay(d));
    const hi=day&&day.hi!=null?day.hi:null;
    const lo=prev&&prev.lo!=null?prev.lo:null;     // last night's low is this day's min
    if(hi==null&&lo==null) return;
    rec.per.push({id:"nws",label:def.label,who:def.who,hi,lo});
    msDayStats(rec); any=true;
  });
  return any;
}

// One location's daily block into a Map of date → the models' spread for that day.
function absorbMs(d){
  if(!d||!d.time) return null;
  const out=new Map();
  d.time.forEach((t,i)=>{
    const per=[];
    FC_MODELS.forEach(m=>{
      if(m.id==="nws") return;          // NWS would be two more calls per city
      const hiA=d[`temperature_2m_max_${m.id}`], loA=d[`temperature_2m_min_${m.id}`];
      const hi=hiA?hiA[i]:null, lo=loA?loA[i]:null;
      if(hi==null&&lo==null) return;    // a model absent here is not a row of dashes
      per.push({id:m.id,label:m.label,who:m.who,hi,lo});
    });
    if(!per.length) return;
    out.set(t,msDayStats({date:t,per}));
  });
  return out.size?out:null;
}

// Recomputed rather than accumulated, so folding a source in later cannot leave the
// mean and the spread describing different sets.
function msDayStats(rec){
  const hs=rec.per.filter(x=>x.hi!=null).map(x=>x.hi);
  const ls=rec.per.filter(x=>x.lo!=null).map(x=>x.lo);
  const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  rec.hi=mean(hs); rec.lo=mean(ls);
  rec.n=hs.length; rec.nLo=ls.length;
  rec.hSpread=hs.length?Math.max(...hs)-Math.min(...hs):null;
  rec.lSpread=ls.length?Math.max(...ls)-Math.min(...ls):null;
  return rec;
}

// Lays the chosen source over the forecast days. Every source keeps its own map, so
// switching back and forth is lossless — nothing is overwritten irrecoverably.
function applySource(city){
  city.nwsDays=0; city.srcDays=0;
  if(fcSource==="nws"){ if(city.nwsMap) applyNws(city,city.nwsMap); return; }
  const map=city.alt&&city.alt[fcSource]; if(!map) return;
  let n=0;
  map.forEach((v,d)=>{
    if(d<=OBS_END) return;                     // never overwrite an observation
    const r=city.byDate.get(d); if(!r) return;
    r.hi=v.hi; r.lo=v.lo; r.mean=(v.hi+v.lo)/2; r.src=fcSource; n++;
  });
  city.srcDays=n;
}

// NWS is the authoritative US forecast and is what weather.com / Weather Underground
// show. Open-Meteo's model blend runs several degrees off it, so NWS wins where it
// has coverage. Two calls: resolve the grid, then read the periods.
async function nwsForecast(lat,lon){
  // The grid lookup is a fixed property of the coordinate, so it is kept for a month;
  // the periods are a forecast, so half an hour. Together that takes a warm browser
  // from two requests per city to none — which is what makes eleven cities affordable.
  const p=await grabCached(`https://api.weather.gov/points/${lat.toFixed(4)},${lon.toFixed(4)}`,
    "nwspt", TTL_STATIC, j=>!!(j&&j.properties&&j.properties.forecast),
    j=>({properties:{forecast:j.properties.forecast}}));
  const url=p&&p.properties&&p.properties.forecast;
  if(!url) return null;
  const f=await grabCached(url,"nwsfc",TTL_LIVE,
    j=>!!(j&&j.properties&&j.properties.periods&&j.properties.periods.length),
    j=>({properties:{periods:j.properties.periods.map(x=>({startTime:x.startTime,
      isDaytime:x.isDaytime, temperature:x.temperature,
      temperatureUnit:x.temperatureUnit,
      probabilityOfPrecipitation:x.probabilityOfPrecipitation}))}}));
  const per=f&&f.properties&&f.properties.periods;
  if(!per||!per.length) return null;
  const out=new Map();
  per.forEach(x=>{
    if(x.temperatureUnit!=="F"||x.temperature==null) return;
    const d=x.startTime.slice(0,10);
    const r=out.get(d)||{};
    // Daytime period is that date's high; the night that follows is its low —
    // the same pairing a phone weather app displays.
    if(x.isDaytime) r.hi=x.temperature; else r.lo=x.temperature;
    const p=x.probabilityOfPrecipitation&&x.probabilityOfPrecipitation.value;
    if(p!=null) r.pop=Math.max(r.pop==null?0:r.pop,p);   // highest of day and night
    out.set(d,r);
  });
  return out;
}

function applyNws(city,nws){
  let n=0;
  nws.forEach((v,d)=>{
    // Never overwrite an observation, and never today either. Today's model figure
    // is an analysis of a day that has largely already happened, while NWS's "today"
    // period is a forecast issued this morning — by evening the analysis is the
    // better number. NWS takes over from tomorrow. (Measured on 18 Sep 2026: the
    // model had 99°F and that is what it reached.) The ERA5 lag days before today
    // are moot here, since NWS does not publish the past.
    if(d<=OBS_END) return;
    const r=city.byDate.get(d); if(!r) return;
    if(v.hi!=null){ r.hi=v.hi; n++; }
    if(v.lo!=null) r.lo=v.lo;
    if(v.pop!=null) r.pop=v.pop;
    r.mean=(r.hi+r.lo)/2;                  // NWS gives no daily mean
    r.src="nws";
  });
  city.nwsDays=n;
}

function buildCumulative(city){
  let run=0;
  DATES.forEach(t=>{const r=city.byDate.get(t); if(!r) return; run+=r.pr||0; r.cum=run;});
  city.totalRain=run;
}

function removeCity(id){
  cities=cities.filter(c=>c.id!==id);
  renderChips(); clearNote(); syncButtons();
  if(cities.length) draw();
  else { $("fig").hidden=true; $("stand").textContent="Search for a city to begin."; }
  maybeLoadClim(); maybeLoadSoil();
}

/* ---------- normals ---------- */
async function maybeLoadClim(){
  if(cities.length!==1) return;
  const c=cities[0];
  if(c.clim||c.climTried) return;
  c.climTried=true;
  // The raw response is calendar data, so it survives a year change — only the
  // built map needs redoing, to leave the viewed year out of its own baseline.
  if(c.climRaw){ c.clim=buildClim(c.climRaw); draw(); return; }
  $("fig").classList.add("pending");
  try{
    c.climRaw=await grabCached(`${archBase}?latitude=${c.lat}&longitude=${c.lon}`
      +`&start_date=${CLIM_FROM}-01-01&end_date=${CLIM_TO}-12-31`
      +`&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,shortwave_radiation_sum${units}`,
      "clim", TTL_STATIC);
    c.clim=buildClim(c.climRaw);
  }catch(e){ c.clim=null; }
  $("fig").classList.remove("pending");
  if(cities.length===1&&cities[0]===c) draw();
}

/* ---------- archive cache ----------
   The 1940-onwards record does not change, so fetching it once per browser rather
   than once per page load is the difference between working and being rate limited
   — the live archive started answering 429 once three separate triggers each fired
   five slice requests on every reload.
   Values are stored aligned to a day index counted from HIST_FROM, so the date
   array costs nothing to keep. Only a *complete* pull is cached: caching a partial
   one would freeze a rate-limited gap in place instead of retrying it later.
   Every localStorage touch is wrapped — it throws in private mode and when the
   origin has storage blocked, and the feature has to survive that. */
// Reloading used to re-fetch everything, which is what exhausted the free tier and
// left the app unable to load at all. Anything that does not change within the hour
// is kept; a rate-limited reload then still has yesterday's answer to draw.
const TTL_LIVE=30*6e4;        // this year's numbers: half an hour
const TTL_STATIC=30*864e5;    // normals, past years, soil baseline: a month
// Verification asks for "the last VER_DAYS days", so the same URL means something
// different tomorrow. Half a day keeps repeat visits free without freezing the window.
const TTL_VER=12*36e5;
function lsGet(key,maxAge){
  try{
    const raw=localStorage.getItem(key); if(!raw) return null;
    const o=JSON.parse(raw);
    return (o&&typeof o.at==="number"&&Date.now()-o.at<maxAge)?o.d:null;
  }catch(e){ return null; }
}
function lsSet(key,d){
  const write=()=>localStorage.setItem(key,JSON.stringify({at:Date.now(),d}));
  const mine=k=>k.startsWith("jw:")&&k!==key;
  try{ write(); }
  catch(e){
    try{
      // Cheap entries first — the 1940 record is the expensive one to refetch.
      Object.keys(localStorage).filter(k=>mine(k)&&!k.startsWith("jw:hist:"))
        .forEach(k=>localStorage.removeItem(k));
      write();
    }catch(e2){
      try{ Object.keys(localStorage).filter(mine).forEach(k=>localStorage.removeItem(k)); write(); }
      catch(e3){}
    }
  }
}
// grab(), but served from storage when a fresh copy is there. A 200 carrying
// {error:true,reason} has no daily/hourly block and is never cached.
// The key is derived from the URL, so a cached answer can never be served for a
// different request. Keying on the city alone meant that growing the model list from
// five to thirteen left every browser holding the old cached call showing five
// sources for half an hour, while a fresh phone showed thirteen.
const hashStr=t=>{let h=5381;for(let i=0;i<t.length;i++)h=(h*33^t.charCodeAt(i))>>>0;return h.toString(36);};
let usedStale=false;          // reset per city load, reported in the footer
// `ok` decides whether a response is worth storing — the default is the Open-Meteo
// shape, since a 200 carrying {error:true} has no daily/hourly block. `keep` trims a
// response before it is stored *and* returned, so a caller that reads four fields out
// of a 25 KB document does not put the other 24 KB in everyone's localStorage.
async function grabCached(url,tag,ttl,ok,keep){
  const key=`jw:${tag}:${hashStr(url)}`;
  const hit=lsGet(key,ttl); if(hit) return hit;
  try{
    const j=await grab(url);
    const good=ok?ok(j):!!(j&&(j.daily||j.hourly));
    const out=(good&&keep)?keep(j):j;
    if(good) lsSet(key,out);
    return out;
  }catch(e){
    // Stale beats nothing. A rate limit should not blank a dashboard that has an
    // older copy sitting in storage; it is served and the footer says so.
    const old=lsGet(key,Infinity);
    if(old){ usedStale=true; return old; }
    throw e;
  }
}

// One-off: the previous scheme keyed on city rather than request, so those entries
// can never be hit again and would only take room.
try{ Object.keys(localStorage)
  .filter(k=>/^jw:(cur|fc|alt|clim|soilcur|soilbase):1:/.test(k))
  .forEach(k=>localStorage.removeItem(k)); }catch(e){}

const HIST_CACHE_V=1, HIST_MAX_AGE=30*864e5;     // ERA5 is revised occasionally
const histKey=city=>`jw:hist:${HIST_CACHE_V}:${city.key}:${HIST_FROM}-${HIST_TO}`;
const dayIdx=t=>Math.round((Date.UTC(+t.slice(0,4),+t.slice(5,7)-1,+t.slice(8,10))
  -Date.UTC(HIST_FROM,0,1))/864e5);
const dayISO=i=>new Date(Date.UTC(HIST_FROM,0,1)+i*864e5).toISOString().slice(0,10);
const HIST_DAYS=dayIdx(`${HIST_TO}-12-31`)+1;

function packHist(raw){
  // Stored exactly as returned, not rounded. Rounding to 1dp shaved ~50KB but could
  // nudge a value across a hot-day threshold — 99.96 becoming 100.0 counts a day
  // that never reached it. The archive already answers in tenths, so there is
  // nothing to save anyway.
  const d=raw.daily, x=new Array(HIST_DAYS).fill(null), n=x.slice(), p=x.slice();
  const v=a=>a==null?null:a;
  d.time.forEach((t,i)=>{
    const k=dayIdx(t); if(k<0||k>=HIST_DAYS) return;
    x[k]=v(d.temperature_2m_max[i]); n[k]=v(d.temperature_2m_min[i]);
    p[k]=v(d.precipitation_sum?d.precipitation_sum[i]:null);
  });
  return {v:HIST_CACHE_V,at:Date.now(),x,n,p};
}
function unpackHist(o){
  const time=[],hi=[],lo=[],pr=[];
  for(let k=0;k<HIST_DAYS;k++){
    if(o.x[k]==null||o.n[k]==null) continue;
    time.push(dayISO(k)); hi.push(o.x[k]); lo.push(o.n[k]); pr.push(o.p[k]);
  }
  return time.length
    ?{daily:{time,temperature_2m_max:hi,temperature_2m_min:lo,precipitation_sum:pr}}:null;
}
function cachedHist(city){
  try{
    const raw=localStorage.getItem(histKey(city)); if(!raw) return null;
    const o=JSON.parse(raw);
    if(!o||o.v!==HIST_CACHE_V||!o.x||!(Date.now()-o.at<HIST_MAX_AGE)) return null;
    return unpackHist(o);
  }catch(e){ return null; }
}
function cacheHist(city,raw){
  const write=()=>localStorage.setItem(histKey(city),JSON.stringify(packHist(raw)));
  try{ write(); }
  catch(e){
    // Out of room: drop this app's other entries and try once, then give up quietly.
    // Failing to cache is not failing to work.
    try{
      Object.keys(localStorage).filter(k=>k.startsWith("jw:hist:")&&k!==histKey(city))
        .forEach(k=>localStorage.removeItem(k));
      write();
    }catch(e2){}
  }
}

// Waits until a fly-out actually asks for it, the same deal the soil baseline gets.
// Goes out in HIST_CHUNK-year slices rather than one 86-year request: a single span
// that long failed outright against the live archive, while the 30-year normals call
// beside it succeeds, so each slice is kept near a size that demonstrably works.
// Slices settle independently — partial coverage beats none, and whatever fails is
// named in the card rather than silently narrowing the record.
const HIST_CHUNK=20;
async function maybeLoadHist(city){
  if(!city||city.histRaw||city.histTried) return;
  city.histTried=true; city.histErr=null;
  // A hit is assigned before the first await, so callers that render straight after
  // calling this see the data on the same tick and never flash a loading line.
  const hit=cachedHist(city);
  if(hit){ city.histRaw=hit; return; }
  city.histLoading=true;
  const spans=[];
  for(let a=HIST_FROM;a<=HIST_TO;a+=HIST_CHUNK) spans.push([a,Math.min(HIST_TO,a+HIST_CHUNK-1)]);
  const res=await Promise.allSettled(spans.map(([a,b])=>
    grab(`${archBase}?latitude=${city.lat}&longitude=${city.lon}`
      +`&start_date=${a}-01-01&end_date=${b}-12-31`
      +`&daily=temperature_2m_max,temperature_2m_min,precipitation_sum${units}`)));
  const time=[], hi=[], lo=[], pr=[], bad=[];
  res.forEach((r,k)=>{
    const v=r.status==="fulfilled"?r.value:null;
    const d=v&&v.daily;
    if(!d||!d.time){
      // A 200 carrying {error:true,reason:…} looks like success to grab(), so the
      // shape is checked here too and the reason kept.
      const why=r.status==="rejected"?r.reason.message:(v&&v.reason)||"no daily series";
      bad.push(`${spans[k][0]}\u2013${spans[k][1]} (${why})`);
      return;
    }
    d.time.forEach((t,i)=>{
      const x=d.temperature_2m_max[i], n=d.temperature_2m_min[i];
      if(x==null||n==null) return;
      time.push(t); hi.push(x); lo.push(n);
      pr.push(d.precipitation_sum?d.precipitation_sum[i]:null);
    });
  });
  city.histRaw=time.length
    ?{daily:{time,temperature_2m_max:hi,temperature_2m_min:lo,precipitation_sum:pr}}:null;
  // A wall of identical 429s reads as a broken archive; it is a rate limit, and it
  // clears on its own. Say that instead of repeating the same line five times.
  city.histErr=!bad.length?null
    :bad.every(b=>/\b429\b/.test(b))
      ?`Open-Meteo is rate-limiting this browser (429) — the archive should load again shortly`
      :bad.join("; ");
  // Only a complete pull is worth keeping — caching a rate-limited partial would
  // freeze the gap in instead of retrying it on the next visit.
  if(city.histRaw&&!bad.length) cacheHist(city,city.histRaw);
  city.histLoading=false;
  if(cities.length!==1||cities[0]!==city) return;
  // Repaint the card if it is still open on the same day — closeFly clears flyAt,
  // and every redraw closes it, so a live flyAt means the bucket index still holds.
  if(flyAt) openFly(flyAt.i,flyAt.anchorX);
  else draw();                           // the record years arrived; redraw with them
}

function calendarKeys(){
  const keys=[], y=2021;
  for(let dt=new Date(y,0,1); dt.getFullYear()===y; dt.setDate(dt.getDate()+1))
    keys.push(String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0"));
  return keys;
}

function buildClim(json){
  const d=json.daily, acc=new Map();
  d.time.forEach((t,i)=>{
    const hi=d.temperature_2m_max[i], lo=d.temperature_2m_min[i], pr=d.precipitation_sum[i];
    const sr=d.shortwave_radiation_sum?d.shortwave_radiation_sum[i]:null;
    if(hi==null||lo==null) return;
    if(+t.slice(0,4)===year) return;    // don't let a year sit inside its own baseline
    const k=t.slice(5), a=acc.get(k)||{hi:0,lo:0,pr:0,sr:0,n:0,pn:0,sn:0};
    a.hi+=hi; a.lo+=lo; a.n++;
    if(pr!=null){a.pr+=pr; a.pn++;}
    if(sr!=null){a.sr+=sr/3.6; a.sn++;}
    acc.set(k,a);
  });
  const keys=calendarKeys();
  const raw=keys.map(k=>{const a=acc.get(k);
    return a?{hi:a.hi/a.n,lo:a.lo/a.n,pr:a.pn?a.pr/a.pn:null,sr:a.sn?a.sr/a.sn:null}:null;});
  const out=new Map();
  // Circular +/-7 day smooth. Daily rainfall needs it far more than temperature,
  // since any single calendar date is dominated by a few wet years.
  keys.forEach((k,i)=>{
    let sh=0,sl=0,n=0,sp=0,pn=0,ss=0,sn=0;
    for(let j=-SMOOTH;j<=SMOOTH;j++){
      const v=raw[(i+j+keys.length)%keys.length];
      if(!v) continue;
      sh+=v.hi; sl+=v.lo; n++;
      if(v.pr!=null){sp+=v.pr; pn++;}
      if(v.sr!=null){ss+=v.sr; sn++;}
    }
    if(n) out.set(k,{hi:sh/n,lo:sl/n,mean:(sh+sl)/(2*n),pr:pn?sp/pn:null,sr:sn?ss/sn:null,
                     prRaw:raw[i]&&raw[i].pr!=null?raw[i].pr:null});
  });
  return out;
}

/* ---------- soil ---------- */
function dailyMean(json){
  const h=json&&json.hourly, out=new Map();
  if(!h||!h.time) return out;
  const acc=new Map();
  h.time.forEach((t,i)=>{
    const v=h[SOIL_BAND][i]; if(v==null) return;
    const d=t.slice(0,10), a=acc.get(d)||{s:0,n:0};
    a.s+=v; a.n++; acc.set(d,a);
  });
  acc.forEach((a,d)=>out.set(d,a.s/a.n));
  return out;
}

async function maybeLoadSoil(){
  syncButtons();
  if(!soilOn||cities.length!==1) return;
  const c=cities[0];
  if(c.soil||c.soilTried) return;
  c.soilTried=true;
  const btn=$("soilbtn"); btn.dataset.busy="1"; btn.textContent="Loading soil…"; syncButtons();
  try{
    const q=`&hourly=${SOIL_BAND}&timezone=auto`;
    const cur=grabCached(`${archBase}?latitude=${c.lat}&longitude=${c.lon}&start_date=${START}&end_date=${OBS_END}${q}`,
      "soilcur", IS_CURRENT?TTL_LIVE:TTL_STATIC);
    // The baseline is calendar data, so fetch it once and reuse across year changes.
    if(!c.soilBase)
      c.soilBase=dailyMean(await grabCached(`${archBase}?latitude=${c.lat}&longitude=${c.lon}`
        +`&start_date=${SOIL_FROM}-01-01&end_date=${SOIL_TO}-12-31${q}`,
        "soilbase", TTL_STATIC));
    c.soil=buildSoil(dailyMean(await cur),c.soilBase);
    if(!c.soil.size) c.soil=null; else fitApi(c);
  }catch(e){ c.soil=null; }
  btn.dataset.busy=""; btn.textContent="Soil moisture";
  if(!c.soil) note(`No soil moisture for ${esc(c.label)} — the reanalysis doesn't cover every grid cell.`);
  syncButtons();
  if(cities.length===1&&cities[0]===c) draw();
}

function buildSoil(cur,base){
  const byKey=new Map();
  base.forEach((v,d)=>{
    if(+d.slice(0,4)===year) return;   // don't rank a year against itself
    const k=d.slice(5), arr=byKey.get(k)||[]; arr.push(v); byKey.set(k,arr);
  });
  const keys=calendarKeys(), pos=new Map(keys.map((k,i)=>[k,i]));
  const out=new Map();
  cur.forEach((v,d)=>{
    const i=pos.get(d.slice(5)); if(i==null) return;
    let pool=[];
    for(let j=-SOIL_WIN;j<=SOIL_WIN;j++) pool=pool.concat(byKey.get(keys[(i+j+keys.length)%keys.length])||[]);
    if(pool.length<30) return;
    let below=0,equal=0;
    pool.forEach(x=>{ if(x<v) below++; else if(x===v) equal++; });
    out.set(d,{pct:100*(below+equal/2)/pool.length, value:v, n:pool.length});
  });
  return out;
}

/* ---------- rainfall vs soil ---------- */
function pearson(xs,ys){
  const n=xs.length; if(n<8) return null;
  const mx=xs.reduce((a,b)=>a+b,0)/n, my=ys.reduce((a,b)=>a+b,0)/n;
  let sxy=0,sxx=0,syy=0;
  for(let i=0;i<n;i++){const a=xs[i]-mx,b=ys[i]-my; sxy+=a*b; sxx+=a*a; syy+=b*b;}
  if(sxx<=0||syy<=0) return null;
  return sxy/Math.sqrt(sxx*syy);
}
// Antecedent precipitation index: a decayed running sum of prior rain, which turns the
// flux (inches falling) into a stock — the same kind of quantity soil moisture is.
function buildApi(city,k){
  let run=0; const out=new Map();
  DATES.forEach(t=>{
    if(t>OBS_END) return;
    const r=city.byDate.get(t); if(!r) return;
    run=(r.pr||0)+k*run; out.set(t,run);
  });
  return out;
}
function rankMap(m){
  const vals=[...m.values()].sort((a,b)=>a-b), out=new Map();
  m.forEach((v,t)=>{
    let lo=0,hi=vals.length;
    while(lo<hi){const mid=(lo+hi)>>1; if(vals[mid]<v) lo=mid+1; else hi=mid;}
    out.set(t,100*lo/Math.max(1,vals.length-1));
  });
  return out;
}
function fitApi(city){
  if(!city.soil) return;
  let best=null;
  DECAYS.forEach(k=>{
    const api=buildApi(city,k), xs=[], ys=[];
    city.soil.forEach((sm,t)=>{const v=api.get(t); if(v!=null){xs.push(v); ys.push(sm.value);}});
    const r=pearson(xs,ys);
    if(r!=null&&(!best||r>best.r)) best={k,r,api};
  });
  if(best) city.api={k:best.k,r:best.r,val:best.api,pct:rankMap(best.api)};
}
function correlate(city,a,b){
  const days=[]; for(let k=view.a;k<=Math.min(view.b,TODAY_IDX);k++) days.push(DATES[k]);
  const out=[];
  for(let lag=0;lag<=7;lag++){
    const xs=[],ys=[];
    days.forEach((t,i)=>{
      const src=days[i-lag]; if(!src) return;
      const x=a(city,src), y=b(city,t);
      if(x==null||y==null||!isFinite(x)||!isFinite(y)) return;
      xs.push(x); ys.push(y);
    });
    out.push({lag,r:pearson(xs,ys),n:xs.length});
  }
  return out;
}
const rainOf=(c,t)=>{const r=c.byDate.get(t); return r?(r.pr||0):null;};
const soilOf=(c,t)=>{const s=c.soil&&c.soil.get(t); return s?s.value:null;};
const dSoilOf=(c,t)=>{
  const i=DATE_POS.get(t); if(i==null||i<1) return null;
  const a=soilOf(c,DATES[i-1]), b=soilOf(c,t);
  return (a==null||b==null)?null:b-a;
};
const rColor=r=>r==null?"transparent":
  (r>=0?`rgba(79,165,168,${0.12+0.55*Math.min(1,Math.abs(r))})`
       :`rgba(194,84,43,${0.12+0.55*Math.min(1,Math.abs(r))})`);
const fmtR=r=>r==null?"—":(r>=0?"":"−")+Math.abs(r).toFixed(2);

function renderStats(show){
  const box=$("stats");
  const c=cities.length===1?cities[0]:null;
  if(!show||!c||!c.soil){ box.hidden=true; return; }
  const level=correlate(c,rainOf,soilOf), delta=correlate(c,rainOf,dSoilOf);
  const apiRow=c.api?correlate(c,(x,t)=>{const v=x.api.val.get(t); return v==null?null:v;},soilOf):null;
  const bestOf=rows=>rows.reduce((a,b)=>(b.r!=null&&(a==null||a.r==null||b.r>a.r))?b:a,null);
  const bd=bestOf(delta), bl=bestOf(level), ba=apiRow?bestOf(apiRow):null;
  const n=level[0]?level[0].n:0;
  const row=(label,rows,best)=>`<tr><td>${label}</td>`
    +rows.map(x=>`<td${best&&x.lag===best.lag?' class="best"':''}>`
      +`<span class="cell" style="background:${rColor(x.r)}">${fmtR(x.r)}</span></td>`).join("")+`</tr>`;
  const halfLife=c.api?Math.log(0.5)/Math.log(c.api.k):null;

  box.innerHTML=`<h2>Rainfall against soil moisture, 7&ndash;28&thinsp;cm</h2>`
    +`<p class="lede">Pearson r over the ${n} observed days in view. `
    +(bd&&bd.r!=null?`Daily rain tracks the <b>change</b> in soil moisture best at a lag of `
        +`<b>${bd.lag} day${bd.lag===1?"":"s"}</b> (r&nbsp;=&nbsp;<b>${fmtR(bd.r)}</b>), while against the soil `
        +`<b>level</b> it manages only <b>${fmtR(bl?bl.r:null)}</b> — a flux and a stock don't track each other.`
      :`Not enough overlapping days in this window for a stable correlation.`)
    +(ba&&ba.r!=null?` The antecedent index reaches <b>${fmtR(ba.r)}</b>.`:``)+`</p>`
    +`<div class="scroller"><table><thead><tr><th></th>`
      +[0,1,2,3,4,5,6,7].map(l=>`<th>lag ${l}</th>`).join("")+`</tr></thead><tbody>`
    +row("Rain → soil level",level,bl)
    +row("Rain → daily change",delta,bd)
    +(apiRow?row("Antecedent index → level",apiRow,ba):``)
    +`</tbody></table></div>`
    +`<p class="foot">Always computed on <b>daily</b> values, whatever the aggregation above is set to — `
    +`weekly or monthly buckets would wash out the very lags this is measuring. `
    +(c.api?`Index decay fitted per location: k&nbsp;=&nbsp;${c.api.k} (half-life ${halfLife.toFixed(1)} days). `:``)
    +`Both series come from the same reanalysis, so soil moisture is that model's response to that model's `
    +`rainfall — this measures ERA5's soil physics, not Rankin County's.</p>`;
  box.hidden=false;
}

/* ---------- hot days by month ----------
   Counts observed days whose high reached the threshold. Forecast days are excluded:
   a modelled 101°F is not an observation, and mixing them would inflate the count. */
function hotByMonth(city){
  const out=new Array(12).fill(null);
  for(let i=0;i<=TODAY_IDX;i++){
    const r=city.byDate.get(DATES[i]); if(!r||r.est) continue;   // estimates aren't observations
    const m=+DATES[i].slice(5,7)-1;
    if(out[m]==null) out[m]={days:0,obs:0};
    out[m].obs++;
    if(r.hi>=thresh) out[m].days++;
  }
  return out;
}
// Baseline comes from the same 25-year response the normals use, so it costs nothing extra.
function hotNormal(city){
  if(!city.climRaw) return null;
  const d=city.climRaw.daily, acc=new Map(), years=new Set();
  d.time.forEach((t,i)=>{
    const v=d.temperature_2m_max[i]; if(v==null) return;
    const y=+t.slice(0,4); if(y===year) return;      // exclude the year being viewed
    years.add(y);
    const k=y+":"+(+t.slice(5,7)-1);
    acc.set(k,(acc.get(k)||0)+(v>=thresh?1:0));
  });
  if(!years.size) return null;
  const out=new Array(12).fill(0);
  years.forEach(y=>{ for(let m=0;m<12;m++) out[m]+=(acc.get(y+":"+m)||0); });
  return out.map(v=>v/years.size);
}

// The dashed monthly average is a 30-year normal; the record years come from the
// whole archive, the way a forecast quotes "normal high 86, record 100 in 2010".
// histRaw carries daily max, which is all a hot-day count needs. Ties are reported
// as ties rather than silently picking one year.
function hotExtremes(city){
  const d=city&&city.histRaw&&city.histRaw.daily;
  if(!d||!d.time) return null;
  const per=new Map();
  d.time.forEach((t,i)=>{
    const v=d.temperature_2m_max[i]; if(v==null) return;
    const y=+t.slice(0,4); if(y===year) return;      // never rank a year against itself
    let a=per.get(y); if(!a){ a=new Array(12).fill(0); per.set(y,a); }
    if(v>=thresh) a[+t.slice(5,7)-1]++;
  });
  if(!per.size) return null;
  let hot=null, cold=null;
  per.forEach((months,y)=>{
    const total=months.reduce((a,b)=>a+b,0);
    // On a tie keep the most recent year, and count how many share the mark.
    if(!hot||total>hot.total||(total===hot.total&&y>hot.year)) hot={year:y,months,total};
    if(!cold||total<cold.total||(total===cold.total&&y>cold.year)) cold={year:y,months,total};
  });
  const ties=t=>[...per.values()].filter(ms=>ms.reduce((a,b)=>a+b,0)===t).length;
  hot.ties=ties(hot.total); cold.ties=ties(cold.total);
  return {hot,cold,years:per.size};
}

// Wettest and driest whole years by annual total, from the same archive the hot-day
// records use. Only the two winners get a calendar map built; keeping one per year
// would be 86 maps for no reason.
function rainExtremes(city){
  const d=city&&city.histRaw&&city.histRaw.daily;
  if(!d||!d.time||!d.precipitation_sum) return null;
  const tot=new Map();
  d.time.forEach((t,i)=>{
    const v=d.precipitation_sum[i]; if(v==null) return;
    const y=+t.slice(0,4); if(y===year) return;     // never rank a year against itself
    tot.set(y,(tot.get(y)||0)+v);
  });
  if(!tot.size) return null;
  let wet=null, dry=null;
  tot.forEach((v,y)=>{
    if(!wet||v>wet.total||(v===wet.total&&y>wet.year)) wet={year:y,total:v};
    if(!dry||v<dry.total||(v===dry.total&&y>dry.year)) dry={year:y,total:v};
  });
  const keyed=y=>{
    const m=new Map();
    d.time.forEach((t,i)=>{
      if(+t.slice(0,4)!==y) return;
      const v=d.precipitation_sum[i]; if(v!=null) m.set(t.slice(5),v);
    });
    return m;
  };
  wet.byKey=keyed(wet.year); dry.byKey=keyed(dry.year);
  return {wet,dry,years:tot.size};
}
// A bucket's worth of a record year, matched on month-day. 29 February is simply
// absent in a non-leap record year, which is a missing day rather than a dry one.
function bucketSum(map,b){
  let t=0,n=0;
  b.idxs.forEach(i=>{ const v=map.get(DATES[i].slice(5)); if(v!=null){t+=v; n++;} });
  return n?t:null;
}

/* ---------- forecast comparison ----------
   Read down a column to see how far apart the world's forecast centres are about one
   day; read across a row to find the one that matches whatever forecast you trust.
   The chart shows highs only — that is the number the phone apps put in large type —
   with the full spread as a band, every model as a thin line, and the chosen source
   picked out. Lows live in the table, where there is room for them. */
function fcRows(city){
  const out=[];
  const nws=FC_MODELS.find(m=>m.id==="nws");
  if(city.nwsMap&&city.nwsMap.size) out.push(Object.assign({},nws,{map:city.nwsMap}));
  FC_MODELS.forEach(m=>{
    if(m.id==="nws") return;
    const map=city.alt&&city.alt[m.id];
    if(map&&map.size) out.push(Object.assign({},m,{map}));   // absent models drop out
  });
  return out;
}
function fcDates(rows){
  const out=[];
  for(let i=TODAY_IDX;i<DATES.length;i++){
    const t=DATES[i];
    if(rows.some(r=>r.map.get(t)&&r.map.get(t).hi!=null)) out.push(t);
  }
  return out;
}

function drawFc(){
  const svg=$("chart"); $("fig").hidden=false;
  const M=isMobile();
  const solo=cities.length===1?cities[0]:null;
  const say=t=>{ svg.setAttribute("viewBox",`0 0 ${M?380:1000} 120`);
    svg.innerHTML=`<text x="${M?12:20}" y="60" fill="var(--ink-soft)">${t}</text>`;
    svg._geom=null; $("key").innerHTML=""; $("fcsrc").hidden=true;
    $("stats").hidden=true; $("hint2").textContent=""; };
  if(!solo){ say("Drop to one city to compare forecast sources."); 
    $("stand").innerHTML=`The forecast comparison shows one city at a time.`; return; }
  if(!IS_CURRENT){ say(`${year} is over — there is no forecast to compare.`);
    $("stand").innerHTML=`Pick the current year to compare forecasts.`; return; }
  const rows=fcRows(solo);
  if(!rows.length){ say(solo.altTried?"The forecast models didn't load.":"Loading forecast models…");
    $("stand").innerHTML=solo.altTried
      ? `The models didn't load — Open-Meteo may be rate-limiting this browser.`
      : `Fetching every forecast source for <b>${esc(solo.label)}</b>…`;
    return; }
  const dates=fcDates(rows);
  if(!dates.length){ say("No forecast days available."); return; }

  const W=M?380:1000, L=M?34:52, R=M?10:16, T=M?28:32, BH=M?200:278;
  const iw=W-L-R, XLAB=T+BH+20, H=XLAB+(M?14:18);
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const X=i=>L+(dates.length<2?iw/2:i*iw/(dates.length-1));

  let lo=Infinity,hi=-Infinity;
  rows.forEach(r=>dates.forEach(t=>{const v=r.map.get(t); if(!v) return;
    [v.hi,v.lo].forEach(x=>{ if(x!=null){lo=Math.min(lo,x);hi=Math.max(hi,x);} });}));
  if(!isFinite(lo)){ say("No forecast days available."); return; }
  const y0=Math.floor((lo-3)/5)*5, y1=Math.ceil((hi+3)/5)*5;
  const Y=v=>T+BH-(v-y0)/(y1-y0||1)*BH;

  let s="";
  const step=(y1-y0>40)?10:5;
  for(let v=y0;v<=y1;v+=step)
    s+=`<line class="gridline" x1="${L}" y1="${Y(v).toFixed(1)}" x2="${W-R}" y2="${Y(v).toFixed(1)}"/>`
      +`<text x="${L-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end">${v}°</text>`;

  // Spread band, per day and per series: how far apart the sources are. High and low
  // are pooled separately — a source can cover one and not the other, so the counts
  // and the means are kept apart rather than assuming every row has both.
  const agg=(t,k)=>{
    const vs=rows.map(r=>r.map.get(t)).filter(v=>v&&v[k]!=null).map(v=>v[k]);
    return vs.length?{min:Math.min(...vs),max:Math.max(...vs),n:vs.length,
                      avg:vs.reduce((a,b)=>a+b,0)/vs.length}:null;
  };
  const band=dates.map((t,i)=>{
    const h=agg(t,"hi"); if(!h) return null;
    const l=agg(t,"lo");
    return {i,min:h.min,max:h.max,n:h.n,avg:h.avg,
            lmin:l&&l.min,lmax:l&&l.max,lavg:l?l.avg:null,ln:l?l.n:0};
  }).filter(Boolean);
  const fill=(hiKey,loKey)=>{
    const pts=band.filter(b=>b[hiKey]!=null&&b[loKey]!=null);
    if(pts.length<2) return "";
    const top=pts.map(b=>`${X(b.i).toFixed(1)},${Y(b[hiKey]).toFixed(1)}`);
    const bot=pts.map(b=>`${X(b.i).toFixed(1)},${Y(b[loKey]).toFixed(1)}`);
    return `<polygon class="normalband" points="${top.join(" ")} ${bot.slice().reverse().join(" ")}"/>`;
  };
  s+=fill("max","min")+fill("lmax","lmin");
  const line=(r,cls,key)=>{
    const pts=dates.map((t,i)=>{const v=r.map.get(t);
      return (v&&v[key]!=null)?`${X(i).toFixed(1)},${Y(v[key]).toFixed(1)}`:null;}).filter(Boolean);
    return pts.length>1?`<polyline class="${cls}" points="${pts.join(" ")}"/>`:"";
  };
  // The average is the headline line: one number a day, rather than asking the eye
  // to pick one model out of a dozen. The chosen source stays on as a reference so
  // the picker still means something here.
  rows.forEach(r=>{ if(r.id!==fcSource) s+=line(r,"fcthin","hi")+line(r,"fcthin","lo"); });
  const pick=rows.find(r=>r.id===fcSource);
  if(pick) s+=line(pick,"fcnws","hi")+line(pick,"fcnws","lo");
  const mean=(key,cls)=>{
    const pts=band.filter(b=>b[key]!=null)
      .map(b=>`${X(b.i).toFixed(1)},${Y(b[key]).toFixed(1)}`);
    return pts.length>1?`<polyline class="${cls}" points="${pts.join(" ")}"/>`:"";
  };
  s+=mean("avg","fcpick2")+mean("lavg","fcpick3");

  // Today, then a label under every day the axis has room for.
  const maxLab=M?5:14, lstep=Math.max(1,Math.ceil(dates.length/maxLab));
  dates.forEach((t,i)=>{
    if(i%lstep) return;
    s+=`<line class="monthrule" x1="${X(i).toFixed(1)}" y1="${T}" x2="${X(i).toFixed(1)}" y2="${T+BH}"/>`
      +`<text x="${X(i).toFixed(1)}" y="${XLAB}" text-anchor="middle">${+t.slice(8)}</text>`;
  });
  {
    const rr=M?10:11.5, sp=dates.length<2?iw:iw/(dates.length-1);
    const node=(x,v,col)=>{
      const n=String(Math.round(v)), f=Math.min(M?10:10.5,(2*rr-3)/(n.length*0.6));
      return `<circle cx="${x.toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${rr}" fill="var(--paper)" `
        +`stroke="${col}" stroke-width="1.4"/>`
        +`<text class="dnode" x="${x.toFixed(1)}" y="${(Y(v)+f*0.35).toFixed(1)}" `
        +`text-anchor="middle" style="fill:${col}" font-size="${f.toFixed(1)}">${n}</text>`;
    };
    if(sp>=2*rr) band.forEach(b=>{
      s+=node(X(b.i),b.avg,"var(--hot)");
      // The low's ring is dropped rather than drawn overlapping on a day with
      // barely any diurnal range — same rule the high/low labels follow elsewhere.
      if(b.lavg!=null&&Y(b.lavg)-Y(b.avg)>=2*rr) s+=node(X(b.i),b.lavg,"var(--cold)");
    });
  }
  s+=`<text class="panellabel" x="${L}" y="${T-12}">Daily high and overnight low °F — average of all sources</text>`;
  svg.innerHTML=s; svg._geom=null;

  const worst=band.reduce((a,b)=>Math.max(a,b.max-b.min),0);
  const pickName=(FC_MODELS.find(m=>m.id===fcSource)||{}).label||fcSource;
  $("key").innerHTML=`<span><i style="background:var(--hot)"></i>Average high</span>`
    +`<span><i style="background:var(--cold)"></i>Average low</span>`
    +(pick?`<span><i style="background:var(--today)"></i>${esc(pickName)}, your pick</span>`:``)
    +`<span><i style="background:var(--ink-soft)"></i>Every other source</span>`
    +`<span><i class="swatch"></i>Full spread</span>`;
  $("stand").innerHTML=`<b>${esc(solo.label)}</b> &mdash; the bold lines average `
    +`<b>${rows.length}</b> forecast sources over <b>${dates.length}</b> days, which `
    +`disagree by as much as <b>${worst.toFixed(0)}°F</b> on one day`
    +(pick?`. <b>${esc(pickName)}</b> is picked out in green and drives the Timeline.`
      :`.`);
  $("hint2").textContent="Read down a column for how far apart the sources are on one day, "
    +"across a row to find the one matching a forecast you trust.";
  $("stats").hidden=true;
  $("readout").innerHTML=`<span class="stat">Daily high and overnight low, `
    +`every source that covers this point.</span>`;
  renderFcTable(solo,rows,dates);
}

// The map. Equirectangular with a cos(lat) correction on longitude, which is all a
// state this small needs — without it Mississippi comes out a third too wide. Returns
// the markup plus the projection, so the click targets and the drawing agree.
function msProject(box){
  const lons=MS_OUTLINE.map(p=>p[0]), lats=MS_OUTLINE.map(p=>p[1]);
  const w=[Math.min(...lons),Math.max(...lons)], h=[Math.min(...lats),Math.max(...lats)];
  const k=Math.cos((h[0]+h[1])/2*Math.PI/180);
  const dx=(w[1]-w[0])*k, dy=h[1]-h[0];
  const sc=Math.min(box.w/dx,box.h/dy);
  const ox=box.x+(box.w-dx*sc)/2, oy=box.y+(box.h-dy*sc)/2;
  return {
    x:lon=>ox+(lon-w[0])*k*sc,
    y:lat=>oy+(h[1]-lat)*sc,
    w:dx*sc, h:dy*sc, left:ox, top:oy
  };
}

const UI_FONT='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
let _tc=null;
function textW(str,px){
  try{
    if(!_tc) _tc=document.createElement("canvas").getContext("2d");
    if(_tc){ _tc.font=`${px}px ${UI_FONT}`; return _tc.measureText(str).width; }
  }catch(e){}
  return str.length*px*0.52;                 // only if canvas is unavailable
}

function drawMsMap(rows,date){
  const M=isMobile();
  const W=M?380:1000;
  const mapW=M?330:400, mapH=M?400:480, top=M?32:38;
  const P=msProject({x:M?(W-mapW)/2:20, y:top, w:mapW, h:mapH});
  const H=top+mapH+(M?16:22);

  // Coloured against the other cities on this day, the same ranking the table uses.
  const vs=rows.map(r=>r.rec.hi).filter(v=>v!=null);
  const lo=vs.length?Math.min(...vs):0, hi=vs.length?Math.max(...vs):1;
  const col=v=>{ const f=hi>lo?(v-lo)/(hi-lo):0.5;
    const [r,g,b]=ramp(f*100,TEMP_STOPS); return `rgb(${r},${g},${b})`; };

  const land=`<polygon class="msland" points="`
    +MS_OUTLINE.map(([ln,lt])=>`${P.x(ln).toFixed(1)},${P.y(lt).toFixed(1)}`).join(" ")+`"/>`;
  // 202 shared borders as one path rather than 202 elements: same picture, a
  // fraction of the DOM, and nothing about them needs to be addressable.
  const counties=`<path class="mscounty" d="`+MS_COUNTIES.map(l=>"M"
    +l.map(([ln,lt])=>`${P.x(ln).toFixed(1)},${P.y(lt).toFixed(1)}`).join("L")).join("")+`"/>`;
  const roads=MS_ROADS.map(r=>`<polyline class="msroad${r.i?" i":""}" points="`
    +r.pts.map(([ln,lt])=>`${P.x(ln).toFixed(1)},${P.y(lt).toFixed(1)}`).join(" ")+`"/>`).join("");

  // Four Delta cities sit within about fifty pixels of each other, so a fixed label
  // side puts names straight through neighbouring markers. Each name takes the first
  // of above / below / right / left that clears every marker and every name already
  // placed; the markers all go in as obstacles first so ordering cannot matter.
  const rr=M?12:11.5, lh=12, pad=2, pr=2.6;
  const pts=rows.map(r=>({r, x:P.x(r.city.lon), y:P.y(r.city.lat)}));
  const plc=MS_PLACES.map(c=>({c, x:P.x(c.lon), y:P.y(c.lat)}));
  const boxes=pts.map(p=>({x1:p.x-rr,y1:p.y-rr,x2:p.x+rr,y2:p.y+rr}))
    .concat(plc.map(p=>({x1:p.x-pr,y1:p.y-pr,x2:p.x+pr,y2:p.y+pr})));
  // The strip above `top` belongs to the date caption, so a label may not reach it —
  // Southaven sits within a hundredth of a degree of the state's northern edge and
  // its name landed straight on the caption before this.
  const clear=b=>b.x1>=4&&b.x2<=W-4&&b.y1>=top-1
    &&!boxes.some(o=>!(b.x2<=o.x1||b.x1>=o.x2||b.y2<=o.y1||b.y1>=o.y2));
  const place=(p,name,r,px,tl,gap0,raised)=>{
    const hw=textW(name,px)/2+3;
    // Every position is tried close in, then again pushed further out. A name a few
    // pixels off its dot still reads as belonging to the nearest one, and is much
    // better than the place being dropped for want of room.
    for(const gap of (raised?[gap0,gap0+7,gap0+14]:[gap0])){
    const up={x:p.x, y:p.y-r-gap, a:"middle",
      b:{x1:p.x-hw,y1:p.y-r-gap-tl,x2:p.x+hw,y2:p.y-r-gap+tl*0.25}};
    const down={x:p.x, y:p.y+r+gap+tl, a:"middle",
      b:{x1:p.x-hw,y1:p.y+r+gap,x2:p.x+hw,y2:p.y+r+gap+tl+2}};
    const right={x:p.x+r+4, y:p.y+4, a:"start",
      b:{x1:p.x+r+3,y1:p.y-6,x2:p.x+r+5+2*hw,y2:p.y+6}};
    const left={x:p.x-r-4, y:p.y+4, a:"end",
      b:{x1:p.x-r-5-2*hw,y1:p.y-6,x2:p.x-r-3,y2:p.y+6}};
    // Sliding the name sideways while keeping it raised clears a neighbouring
    // marker without giving up on "above" — which is what Amory needs past Tupelo.
    const upR={x:p.x+3, y:up.y, a:"start",
      b:{x1:p.x+2,y1:up.b.y1,x2:p.x+4+2*hw,y2:up.b.y2}};
    const upL={x:p.x-3, y:up.y, a:"end",
      b:{x1:p.x-4-2*hw,y1:up.b.y1,x2:p.x-2,y2:up.b.y2}};
    const downR={x:p.x+3, y:down.y, a:"start",
      b:{x1:p.x+2,y1:down.b.y1,x2:p.x+4+2*hw,y2:down.b.y2}};
    const downL={x:p.x-3, y:down.y, a:"end",
      b:{x1:p.x-4-2*hw,y1:down.b.y1,x2:p.x-2,y2:down.b.y2}};
    const order=raised?[up,upR,upL,down,downR,downL,right,left]:[up,down,right,left];
    const fit=order.find(c=>clear(c.b));
    if(!fit){ if(raised) continue; p.lab=down; }   // a station always draws, number first
    else p.lab=fit;
    boxes.push({x1:p.lab.b.x1-pad,y1:p.lab.b.y1-pad,x2:p.lab.b.x2+pad,y2:p.lab.b.y2+pad});
    return true;
    }
    return false;                            // nowhere clear at any distance
  };
  // Stations first: they carry the numbers, so they get the clear ground.
  pts.forEach(p=>place(p,p.r.city.name,rr,10.5,lh,5));
  const shown=plc.filter(p=>place(p,p.c.name,pr,7,9,3.5,true));

  // Shields go on last and give way to everything: they are placed against the
  // markers and the city names already down, and a route whose badge cannot find a
  // clear spot simply keeps its line and loses its label. Candidates walk the
  // interior vertices and the midpoints between them, so a long route has plenty.
  let shields="";
  MS_ROADS.forEach(r=>{
    const xy=r.pts.map(([ln,lt])=>[P.x(ln),P.y(lt)]);
    const cand=[];
    for(let i=1;i<xy.length-1;i++) cand.push(xy[i]);
    for(let i=0;i<xy.length-1;i++)
      cand.push([(xy[i][0]+xy[i+1][0])/2,(xy[i][1]+xy[i+1][1])/2]);
    // `sm` is for a name rather than a number — "Natchez Trace" at badge size would
    // be a banner. `dx`/`dy` nudge a route's badge off a spot that merely happens to
    // be the first clear one; they shift the candidate, so collisions still hold.
    const fs=r.sm?6:8.5, bw=r.id.length*(r.sm?3.5:4.9)+(r.sm?6:9), bh=r.sm?9:12;
    for(const [cx0,cy0] of cand){
      const cx=cx0+(r.dx||0), cy=cy0+(r.dy||0);
      const box={x1:cx-bw/2-2,y1:cy-bh/2-2,x2:cx+bw/2+2,y2:cy+bh/2+2};
      if(!clear(box)) continue;
      shields+=`<g class="msshield${r.i?" i":""}">`
        +`<rect x="${(cx-bw/2).toFixed(1)}" y="${(cy-bh/2).toFixed(1)}" `
        +`width="${bw.toFixed(1)}" height="${bh}" rx="2"/>`
        +`<text x="${cx.toFixed(1)}" y="${(cy+fs*0.35).toFixed(1)}" text-anchor="middle" `
        +`style="font-size:${fs}px">${r.id}</text></g>`;
      boxes.push(box);
      break;
    }
  });

  const places=shown.map(p=>`<g class="msplace">`
    +`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${pr}"/>`
    +`<text x="${p.lab.x.toFixed(1)}" y="${p.lab.y.toFixed(1)}" `
    +`text-anchor="${p.lab.a}">${esc(p.c.name)}</text></g>`).join("");
  let s=land+counties+roads+shields+places;
  pts.forEach(p=>{
    const h=p.r.rec.hi;
    const n=h==null?"—":String(Math.round(h));
    const f=Math.min(11.5,(2*rr-4)/(n.length*0.6));
    const sel=msSel&&msSel.name===p.r.city.name&&msSel.date===date;
    s+=`<g class="msdot${sel?" sel":""}" data-city="${esc(p.r.city.name)}" data-date="${date}" `
      +`tabindex="0" role="button" `
      +`aria-label="${esc(p.r.city.name)}: high ${n}, low `
