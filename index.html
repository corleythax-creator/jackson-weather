/* ---------- hot days by month ----------
   Counts observed days whose high reached the threshold. Forecast days are excluded:
   a modelled 101°F is not an observation, and mixing them would inflate the count. */
function hotByMonth(city){
  const out=new Array(12).fill(null);
  for(let i=0;i<=TODAY_IDX;i++){
    const r=city.byDate.get(DATES[i]); if(!r||r.est) continue;   // estimates aren't observations
    const m=+DATES[i].slice(5,7)-1;
    if(out[m]==null) out[m]={days:0,obs:0};
    out[m].obs++;
    if(r.hi>=thresh) out[m].days++;
  }
  return out;
}
// Baseline comes from the same 25-year response the normals use, so it costs nothing extra.
function hotNormal(city){
  if(!city.climRaw) return null;
  const d=city.climRaw.daily, acc=new Map(), years=new Set();
  d.time.forEach((t,i)=>{
    const v=d.temperature_2m_max[i]; if(v==null) return;
    const y=+t.slice(0,4); if(y===year) return;      // exclude the year being viewed
    years.add(y);
    const k=y+":"+(+t.slice(5,7)-1);
    acc.set(k,(acc.get(k)||0)+(v>=thresh?1:0));
  });
  if(!years.size) return null;
  const out=new Array(12).fill(0);
  years.forEach(y=>{ for(let m=0;m<12;m++) out[m]+=(acc.get(y+":"+m)||0); });
  return out.map(v=>v/years.size);
}

// The dashed monthly average is a 30-year normal; the record years come from the
// whole archive, the way a forecast quotes "normal high 86, record 100 in 2010".
// histRaw carries daily max, which is all a hot-day count needs. Ties are reported
// as ties rather than silently picking one year.
function hotExtremes(city){
  const d=city&&city.histRaw&&city.histRaw.daily;
  if(!d||!d.time) return null;
  const per=new Map();
  d.time.forEach((t,i)=>{
    const v=d.temperature_2m_max[i]; if(v==null) return;
    const y=+t.slice(0,4); if(y===year) return;      // never rank a year against itself
    let a=per.get(y); if(!a){ a=new Array(12).fill(0); per.set(y,a); }
    if(v>=thresh) a[+t.slice(5,7)-1]++;
  });
  if(!per.size) return null;
  let hot=null, cold=null;
  per.forEach((months,y)=>{
    const total=months.reduce((a,b)=>a+b,0);
    // On a tie keep the most recent year, and count how many share the mark.
    if(!hot||total>hot.total||(total===hot.total&&y>hot.year)) hot={year:y,months,total};
    if(!cold||total<cold.total||(total===cold.total&&y>cold.year)) cold={year:y,months,total};
  });
  const ties=t=>[...per.values()].filter(ms=>ms.reduce((a,b)=>a+b,0)===t).length;
  hot.ties=ties(hot.total); cold.ties=ties(cold.total);
  return {hot,cold,years:per.size};
}

// Wettest and driest whole years by annual total, from the same archive the hot-day
// records use. Only the two winners get a calendar map built; keeping one per year
// would be 86 maps for no reason.
function rainExtremes(city){
  const d=city&&city.histRaw&&city.histRaw.daily;
  if(!d||!d.time||!d.precipitation_sum) return null;
  const tot=new Map();
  d.time.forEach((t,i)=>{
    const v=d.precipitation_sum[i]; if(v==null) return;
    const y=+t.slice(0,4); if(y===year) return;     // never rank a year against itself
    tot.set(y,(tot.get(y)||0)+v);
  });
  if(!tot.size) return null;
  let wet=null, dry=null;
  tot.forEach((v,y)=>{
    if(!wet||v>wet.total||(v===wet.total&&y>wet.year)) wet={year:y,total:v};
    if(!dry||v<dry.total||(v===dry.total&&y>dry.year)) dry={year:y,total:v};
  });
  const keyed=y=>{
    const m=new Map();
    d.time.forEach((t,i)=>{
      if(+t.slice(0,4)!==y) return;
      const v=d.precipitation_sum[i]; if(v!=null) m.set(t.slice(5),v);
    });
    return m;
  };
  wet.byKey=keyed(wet.year); dry.byKey=keyed(dry.year);
  return {wet,dry,years:tot.size};
}
// A bucket's worth of a record year, matched on month-day. 29 February is simply
// absent in a non-leap record year, which is a missing day rather than a dry one.
function bucketSum(map,b){
  let t=0,n=0;
  b.idxs.forEach(i=>{ const v=map.get(DATES[i].slice(5)); if(v!=null){t+=v; n++;} });
  return n?t:null;
}

function drawHot(){
  const svg=$("chart"); $("fig").hidden=false;
  const M=isMobile();
  const solo=cities.length===1?cities[0]:null;
  const counts=cities.map(c=>({c,months:hotByMonth(c)}));
  const norm=solo?hotNormal(solo):null;
  const ext=solo?hotExtremes(solo):null;
  const rec=(ext&&ext.hot.total>0)?ext:null;   // nothing to draw if no year ever reached it
  // A coldest year of zero every month draws nothing, so it is never announced.
  const coldDrawn=!!(rec&&rec.cold.months.some(v=>v>0));

  const W=M?380:1000, L=M?30:44, R=M?8:12, T=M?26:30, BH=M?230:300;
  const iw=W-L-R, XLAB=T+BH+22, H=XLAB+(M?16:20);
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);

  let ymax=1;
  counts.forEach(s=>s.months.forEach(v=>{ if(v) ymax=Math.max(ymax,v.days); }));
  if(norm) norm.forEach(v=>ymax=Math.max(ymax,v));
  if(rec) rec.hot.months.forEach(v=>ymax=Math.max(ymax,v));
  ymax=Math.max(4,Math.ceil(ymax/2)*2);
  const Y=v=>T+BH-(v/ymax)*BH;
  const slot=iw/12;

  let s="";
  const ticks=ymax<=8?ymax/2:4;
  for(let k=0;k<=ticks;k++){
    const v=Math.round(ymax*k/ticks);
    s+=`<line class="gridline" x1="${L}" y1="${Y(v).toFixed(1)}" x2="${W-R}" y2="${Y(v).toFixed(1)}"/>`
      +`<text x="${L-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end">${v}</text>`;
  }
  s+=`<text class="panellabel" x="${L}" y="${T-10}">Days reaching ${thresh}°F, by month — ${year}</text>`;

  const n=cities.length, gap=slot*0.18, bw=(slot-gap*2)/n;
  MONTHS.forEach((mn,m)=>{
    const x0=L+slot*m+gap, wSlot=slot-gap*2;
    counts.forEach((sr,ci)=>{
      const v=sr.months[m];
      if(!v) return;                                   // month not reached yet
      const x=x0+bw*ci;
      if(v.days>0){
        const h=Math.max(1.5,T+BH-Y(v.days));
        s+=`<rect x="${x.toFixed(1)}" y="${(T+BH-h).toFixed(1)}" width="${bw.toFixed(1)}" `
          +`height="${h.toFixed(1)}" fill="${n===1?"var(--hot)":sr.c.color}"/>`
          +`<text x="${(x+bw/2).toFixed(1)}" y="${(T+BH-h-5).toFixed(1)}" text-anchor="middle" `
          +`fill="var(--ink)" font-size="${M?10:11}">${v.days}</text>`;
      }
      // A month still in progress is marked, so a low count isn't misread as mild.
      if(v.obs<daysInMonth(m))
        s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(T+BH+11).toFixed(1)}" text-anchor="middle" `
          +`fill="var(--ink-soft)" font-size="9">${v.obs}d</text>`;
    });
    // Outlines go over the bars, not behind: a record year BELOW the viewed year is
    // the interesting case, and behind a solid bar it would be invisible. They carry
    // no fill, so the bar still reads as the subject.
    if(rec) [[rec.hot.months[m],"var(--hot)"],[rec.cold.months[m],"var(--cold)"]].forEach(([v,col])=>{
      if(!v) return;
      const h=T+BH-Y(v);
      s+=`<rect x="${x0.toFixed(1)}" y="${(T+BH-h).toFixed(1)}" width="${wSlot.toFixed(1)}" `
        +`height="${h.toFixed(1)}" fill="none" stroke="${col}" stroke-width="1.1" `
        +`stroke-dasharray="3 2" opacity=".85"/>`;
    });
    if(norm&&norm[m]>0.05){
      const y=Y(norm[m]);
      s+=`<line x1="${x0.toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x0+slot-gap*2).toFixed(1)}" `
        +`y2="${y.toFixed(1)}" stroke="var(--normal-edge)" stroke-width="1.4" stroke-dasharray="5 3"/>`;
    }
    s+=`<text x="${(L+slot*(m+0.5)).toFixed(1)}" y="${XLAB}" text-anchor="middle">${mn}</text>`;
  });
  svg.innerHTML=s;
  svg._geom=null;

  $("key").innerHTML=(n===1
      ? `<span><i style="background:var(--hot)"></i>Days at or above ${thresh}°F</span>`
      : cities.map(c=>`<span><i style="background:${c.color}"></i>${esc(c.label)}</span>`).join(""))
    +(norm?`<span><i class="dashed"></i>Typical for the month, ${CLIM_FROM}&ndash;${CLIM_TO}</span>`:``)
    // Name a year only when one year actually holds the mark, and don't advertise a
    // coldest-year outline that is zero every month and therefore never drawn.
    +(rec?`<span><i class="dashed" style="border-color:var(--hot)"></i>`
        +(rec.hot.ties>1?`Hottest, ${rec.hot.total} days (${rec.hot.ties} years tied)`
                        :`Hottest year, ${rec.hot.year} (${rec.hot.total})`)+`</span>`
      +(coldDrawn
        ?`<span><i class="dashed" style="border-color:var(--cold)"></i>`
          +(rec.cold.ties>1?`Fewest, ${rec.cold.total} days (${rec.cold.ties} years tied)`
                           :`Coldest year, ${rec.cold.year} (${rec.cold.total})`)+`</span>`
        :``):``);

  const total=counts.map(sr=>({label:sr.c.label,
    n:sr.months.reduce((a,v)=>a+(v?v.days:0),0)}));
  if(solo){
    const nt=norm?norm.reduce((a,b)=>a+b,0):null;
    const worst=solo&&(()=>{ let bm=-1,bv=0;
      counts[0].months.forEach((v,m)=>{ if(v&&v.days>bv){bv=v.days;bm=m;} }); return {m:bm,v:bv}; })();
    $("stand").innerHTML=`<b>${esc(solo.label)}</b> — <b>${total[0].n}</b> day${total[0].n===1?"":"s"} `
      +`reached <b>${thresh}°F</b> in ${year}`
      +(worst.m>=0?`, most of them in <b>${MONTHS_FULL[worst.m]}</b> (${worst.v}).`:` so far.`)
      +(nt!=null?` A typical year at this location sees <b>${nt.toFixed(1)}</b> such days, `
        +`averaged over ${CLIM_FROM}&ndash;${CLIM_TO}.`:``)
      +(ext?` Across <b>${ext.years}</b> years of archive, `
        +(ext.hot.ties>1?`as many as <b>${ext.hot.total}</b>, most recently in <b>${ext.hot.year}</b>`
                        :`the most was <b>${ext.hot.total}</b> in <b>${ext.hot.year}</b>`)
        +` and `
        +(ext.cold.ties>1?`as few as <b>${ext.cold.total}</b>, in <b>${ext.cold.ties}</b> separate years.`
                         :`the fewest <b>${ext.cold.total}</b> in <b>${ext.cold.year}</b>.`)
        :``)
      +(IS_CURRENT?` Forecast days are excluded — observations only.`:``);
  }else{
    $("stand").innerHTML=`Days reaching <b>${thresh}°F</b> in ${year}: `
      +total.sort((a,b)=>b.n-a.n).map(t=>`<b>${esc(t.label)}</b> ${t.n}`).join(", ")+`.`;
  }
  $("hint2").textContent="Small grey figures mark months with partial data. "
    +`Dashed rules show the ${CLIM_FROM}\u2013${CLIM_TO} average for that month`
    +(rec?`; the outlines are the ${coldDrawn?"hottest and coldest years":"hottest year"} `
      +`in the ${HIST_FROM}\u2013${HIST_TO} archive.`:`.`);
  $("stats").hidden=true;
  $("readout").innerHTML=`<span class="stat">Counting daily highs at or above `
    +`<b>${thresh}°F</b>, observed days only.</span>`;
}
const daysInMonth=m=>[31,(year%4===0&&year%100!==0)||year%400===0?29:28,31,30,31,30,31,31,30,31,30,31][m];


// Label only turning points, taken strongest-first and rejected if they'd sit too
// close to one already placed. Density then stays constant at any zoom level.
function pickLabels(arr,f,isMax,X,minGap,maxN){
  const val=i=>{const r=arr[i]; if(!r) return null; const v=f(r); return v==null?null:v;};
  const cand=[];
  for(let i=0;i<arr.length;i++){
    const v=val(i); if(v==null) continue;
    const p=i>0?val(i-1):null, n=i<arr.length-1?val(i+1):null;
    const turn=(p==null||(isMax?v>=p:v<=p))&&(n==null||(isMax?v>=n:v<=n));
    if(turn) cand.push({i,v});
  }
  cand.sort((a,b)=>isMax?b.v-a.v:a.v-b.v);
  const out=[];
  for(const c of cand){
    if(out.length>=maxN) break;
    if(out.every(o=>Math.abs(X(o.i)-X(c.i))>=minGap)) out.push(c);
  }
  return out;
}

// Renders a period into the readout. select=false fills it in without claiming a
// selection, which is how today's numbers appear on first load.
function renderReadout(i,select){
  const svg=$("chart"), read=$("readout"), g=svg._geom;
  if(!g||!g.B||!g.B[i]) return;
  const b=g.B[i], solo=cities.length===1?cities[0]:null;
  if(select){
    selDate=b.first;
    const hr=svg.querySelector("#hr");
    if(hr){hr.setAttribute("x1",g.X(i).toFixed(1)); hr.setAttribute("x2",g.X(i).toFixed(1)); hr.style.display="";}
  }
  const rec=(solo&&gran==="day")?solo.byDate.get(b.first):null;
  const cond=(rec&&rec.wc!=null)?WMO_TEXT[rec.wc]:null;
  let html=`<div class="line"><span class="date">${b.long}</span>`
    +(cond?`<span class="span">${cond}</span>`:``)
    +(b.allFc?`<span class="tag">forecast</span>`:b.anyFc?`<span class="tag">part forecast</span>`:``)
    +((solo&&g.A.get(solo)[i]&&g.A.get(solo)[i].est&&!b.allFc)
        ?`<span class="tag">estimate</span>`:``)
    +(!select&&!b.anyFc?`<span class="tag">today</span>`:``)
    +(gran==="day"?``:`<span class="span">${b.idxs.length} days</span>`)+`</div>`;
  if(solo){
    const r=g.A.get(solo)[i]; if(!r){read.innerHTML=html; return;}
    const n=solo.clim?aggClim(solo.clim,b):null;
    html+=`<div class="line"><span class="stat max">high <b>${r.hi.toFixed(gran==="day"?0:1)}°</b></span>`
      +`<span class="stat min">low <b>${r.lo.toFixed(gran==="day"?0:1)}°</b></span>`
      +`<span class="stat">mean <b>${r.mean.toFixed(1)}°</b></span>`
      +(n?`<span class="stat">vs normal <b>${r.mean>=(n.hi+n.lo)/2?"+":"−"}`
          +`${Math.abs(r.mean-(n.hi+n.lo)/2).toFixed(1)}°</b></span>`:``)
      +`<span class="stat wet">rain <b>${r.rain==null?"—":r.rain.toFixed(2)+'"'}</b></span>`
      +(r.pop!=null?`<span class="stat wet">chance <b>${Math.round(r.pop)}%</b></span>`:``)
      +(r.uv!=null?`<span class="stat" style="color:var(--uv)">UV `
          +`<b style="color:var(--uv)">${r.uv.toFixed(1)}</b></span>`:``)
      +(soilOn&&r.soilPct!=null?`<span class="stat dirt">soil <b>${Math.round(r.soilPct)}th</b> `
          +`<span style="opacity:.75">${wetWord(r.soilPct)}</span></span>`:``)
      +(solarOn&&r.solar!=null?`<span class="stat" style="color:var(--solar)">solar `
          +`<b style="color:var(--solar)">${r.solar.toFixed(1)}</b> kWh/m²/day</span>`:``)
      +`</div>`;
  }else{
    cities.forEach(c=>{
      const r=g.A.get(c)[i]; if(!r) return;
      html+=`<div class="line"><span class="who"><i style="display:inline-block;width:9px;height:9px;`
        +`border-radius:50%;background:${c.color};margin-right:7px"></i>${esc(c.label)}</span>`
        +`<span class="stat max">high <b>${r.hi.toFixed(gran==="day"?0:1)}°</b></span>`
        +`<span class="stat min">low <b>${r.lo.toFixed(gran==="day"?0:1)}°</b></span>`
        +`<span class="stat wet">rain to date <b>${(r.cum||0).toFixed(2)}"</b></span></div>`;
    });
  }
  read.innerHTML=html;
}

/* ---------- day history fly-out ----------
   Every number here comes from histRaw, the HIST_FROM-HIST_TO archive response,
   fetched on the first tap and kept for the session. Nothing is shown that wasn't
   actually pulled — if that response never arrived the card says so.
   Summary stats leave the viewed year out, the same rule the normals and the
   soil percentile follow, so a year is never ranked against itself. */
function dayHistory(city,dateISO){
  const d=city&&city.histRaw&&city.histRaw.daily;
  if(!d||!d.time) return null;
  const key=dateISO.slice(5), out=[];
  d.time.forEach((t,i)=>{
    if(t.slice(5)!==key) return;                   // 29 Feb simply finds fewer years
    const hi=d.temperature_2m_max[i], lo=d.temperature_2m_min[i];
    if(hi==null||lo==null) return;
    out.push({year:+t.slice(0,4),hi,lo});
  });
  return out.length?out:null;
}

// One bar per historical year, low to high, then a gap and the viewed year's own
// bar at the right end — solid when the day is observed, dashed and washed out while
// it is still a forecast, the same signal the main chart uses. This year's high and
// low also run across as dashed rules so every bar reads against them.
function flyChart(rows,now,W,H){
  // the viewed year's bar is the widest thing drawn, so it needs the right margin
  const L=26,R=now?12:4,T=8,BM=16, iw=W-L-R, ih=H-T-BM;
  let lo=Infinity,hi=-Infinity;
  rows.forEach(r=>{lo=Math.min(lo,r.lo);hi=Math.max(hi,r.hi);});
  if(now){lo=Math.min(lo,now.lo);hi=Math.max(hi,now.hi);}
  if(!isFinite(lo)) return "";
  const pad=Math.max(2,(hi-lo)*0.10), y0=lo-pad, y1=hi+pad;
  const Y=v=>T+ih-(v-y0)/(y1-y0)*ih;
  const slots=rows.length+(now?2:0);            // one slot stays empty, as the gap
  const X=i=>L+(slots<2?iw/2:i*iw/(slots-1));
  const sp=slots<2?iw:iw/(slots-1);
  const bw=Math.max(1.4,Math.min(7,sp*0.55));
  // Dots must clear their neighbours, so they shrink with the spacing. Across the
  // full record they end up small and the bar itself carries the range.
  const bar=(x,r,w,fill,extra,dotR)=>{
    const dot=dotR||Math.max(0.9,Math.min(2.6,Math.min(w*0.34,sp*0.40)));
    return `<rect x="${(x-w/2).toFixed(1)}" y="${Y(r.hi).toFixed(1)}" width="${w.toFixed(1)}" `
      +`height="${Math.max(1,Y(r.lo)-Y(r.hi)).toFixed(1)}" rx="${(w/2).toFixed(1)}" `
      +`fill="${fill}"${extra||""}/>`
      +`<circle cx="${x.toFixed(1)}" cy="${Y(r.hi).toFixed(1)}" r="${dot.toFixed(1)}" fill="var(--hot)"/>`
      +`<circle cx="${x.toFixed(1)}" cy="${Y(r.lo).toFixed(1)}" r="${dot.toFixed(1)}" fill="var(--cold)"/>`;
  };
  let s="";
  [hi,lo].forEach(v=>s+=`<text x="${L-5}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end" `
    +`font-size="10">${Math.round(v)}°</text>`);
  if(now) [[now.hi,"var(--hot)"],[now.lo,"var(--cold)"]].forEach(([v,c])=>
    s+=`<line x1="${L}" y1="${Y(v).toFixed(1)}" x2="${W-R}" y2="${Y(v).toFixed(1)}" `
      +`stroke="${c}" stroke-width="1" stroke-dasharray="3 3" opacity=".75"/>`);
  rows.forEach((r,i)=>s+=bar(X(i),r,bw,"rgba(190,214,220,.26)"));
  const ystep=rows.length>40?10:5, GAP=22, kept=[];
  const rlim=now?X(slots-1)-GAP:Infinity;      // keep clear of the current-year label
  rows.forEach((r,i)=>{
    const end=(i===0||i===rows.length-1);
    if(!end&&r.year%ystep) return;
    if(X(i)>rlim) return;
    if(!kept.length||X(i)-X(kept[kept.length-1])>=GAP) kept.push(i);
    else if(end) kept[kept.length-1]=i;         // an end label outranks a decade tick
  });
  kept.forEach(i=>s+=`<text x="${X(i).toFixed(1)}" y="${H-3}" text-anchor="middle" `
    +`font-size="10">&rsquo;${String(rows[i].year).slice(2)}</text>`);
  if(now){
    const x=X(slots-1);
    if(rows.length){
      const gx=(X(rows.length-1)+x)/2;
      s+=`<line x1="${gx.toFixed(1)}" y1="${T}" x2="${gx.toFixed(1)}" y2="${(T+ih).toFixed(1)}" `
        +`stroke="var(--rule)" stroke-width="1"/>`;
    }
    const nw=Math.max(4,bw*1.6);
    s+=bar(x,now,nw,"var(--ink)",now.fc
      ? ` fill-opacity=".3" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="3 2"`
      : ``,Math.min(2.6,Math.max(1.3,nw*0.4)))
      +`<text x="${x.toFixed(1)}" y="${H-3}" text-anchor="middle" font-size="10" `
      +`fill="var(--ink)">&rsquo;${String(now.year).slice(2)}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily high and low by year">${s}</svg>`;
}

let flyAt=null;                 // {i,anchorX} while a card is open, else null
function closeFly(){ flyAt=null; const f=$("flyout"); if(f&&!f.hidden){ f.hidden=true; f.innerHTML=""; } }

// Opens only where it can say something true: one city (climRaw is fetched for a
// lone city) and day aggregation (a week has no single date to look up).
function openFly(i,anchorX){
  const fly=$("flyout"), svg=$("chart"), g=svg._geom;
  const solo=cities.length===1?cities[0]:null;
  if(!fly||!g||!g.B||!g.B[i]||!solo||gran!=="day"){ closeFly(); return; }
  const date=g.B[i].first, rec=solo.byDate.get(date);
  flyAt={i,anchorX};
  maybeLoadHist(solo);            // fires before the render, never after — see CLAUDE.md
  const rows=dayHistory(solo,date);
  const hist=rows?rows.filter(r=>r.year!==year):[];
  const n=hist.length;
  // Ranked on the daily high, against exactly the years the averages below use.
  const warmer=(rec&&n)?hist.filter(r=>r.hi<rec.hi).length:null;
  const pct=warmer==null?null:Math.round(100*warmer/n);

  let html=`<button class="x" type="button" aria-label="Close">&times;</button>`
    +`<div class="hd"><div>`
    +`<h3>${+date.slice(8)} ${MONTHS_FULL[+date.slice(5,7)-1]}</h3>`
    +`<p class="who">${esc(solo.label)}</p></div>`
    +(pct==null?``:`<div class="rank">Higher than<b>${pct}%</b>of years</div>`)
    +`</div>`;

  if(rec) html+=`<p class="now">${year} &middot; <span class="stat max">high <b>${Math.round(rec.hi)}°</b></span>`
    +` <span class="stat min">low <b>${Math.round(rec.lo)}°</b></span>`
    +(rec.fc?` <span class="tag">forecast</span>`:``)+`</p>`;

  if(!rows){
    html+=`<p class="foot">`+(solo.histLoading
      ? `Reading the ${HIST_FROM}&ndash;${HIST_TO} archive&hellip;`
      : `The ${HIST_FROM}&ndash;${HIST_TO} archive for this city didn't load, so there's `
        +`no history for this date to show.`
        +(solo.histErr?` <code>${esc(solo.histErr)}</code>`:``))+`</p>`;
  }else{
    html+=flyChart(hist,rec?{year,hi:rec.hi,lo:rec.lo,fc:!!rec.fc}:null,312,120);
    if(n){
      const avgHi=hist.reduce((a,r)=>a+r.hi,0)/n, avgLo=hist.reduce((a,r)=>a+r.lo,0)/n;
      const warm=hist.reduce((a,r)=>r.hi>a.hi?r:a), cool=hist.reduce((a,r)=>r.lo<a.lo?r:a);
      html+=`<p class="foot">Across <b>${n}</b> year${n===1?"":"s"} on this date `
        +`(${hist[0].year}&ndash;${hist[n-1].year}, this year excluded), the high `
        +`averaged <b>${avgHi.toFixed(1)}°</b> and the low <b>${avgLo.toFixed(1)}°</b>. `
        +`Warmest <b>${Math.round(warm.hi)}°</b> in ${warm.year}, coldest night `
        +`<b>${Math.round(cool.lo)}°</b> in ${cool.year}.</p>`;
    }else{
      html+=`<p class="foot">The archive holds no other year on this date to compare against.</p>`;
    }
    // Never let a partial record pass as the whole thing.
    if(solo.histErr) html+=`<p class="foot">Part of the record is missing, so the years `
      +`above are what loaded: <code>${esc(solo.histErr)}</code></p>`;
  }
  fly.innerHTML=html;
  fly.hidden=false;
  fly.querySelector(".x").onclick=closeFly;

  // Anchor near the tap, clamped inside the figure.
  const fig=$("fig"), fr=fig.getBoundingClientRect();
  const left=Math.max(8,Math.min(fr.width-fly.offsetWidth-8,anchorX-fr.left-fly.offsetWidth/2));
  fly.style.left=left.toFixed(0)+"px";
  fly.style.top=Math.max(4,svg.getBoundingClientRect().top-fr.top+8).toFixed(0)+"px";
}

/* ---------- weather symbols ----------
   The WMO code the daily feeds return alongside the temperatures, grouped into
   eight drawable conditions. A day the feed gives no code for draws nothing —
   an absent code is not a clear sky.
   One seam worth knowing: where NWS wins the forecast it overwrites the high,
   low and rain chance but publishes no WMO code, so those days keep Open-Meteo's
   condition. On a marginal day the glyph and the numbers under it can disagree. */
const WMO_TEXT={0:"Clear",1:"Mainly clear",2:"Partly cloudy",3:"Overcast",
  45:"Fog",48:"Freezing fog",51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",
  56:"Freezing drizzle",57:"Freezing drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",
  66:"Freezing rain",67:"Freezing rain",71:"Light snow",73:"Snow",75:"Heavy snow",
  77:"Snow grains",80:"Light showers",81:"Showers",82:"Violent showers",
  85:"Snow showers",86:"Snow showers",95:"Thunderstorm",96:"Thunderstorm, hail",
  99:"Thunderstorm, hail"};
const WMO_GLYPH=(()=>{
  const m=new Map(), add=(codes,g)=>codes.forEach(c=>m.set(c,g));
  add([0],"clear"); add([1,2],"partly"); add([3],"cloud"); add([45,48],"fog");
  add([51,53,55,56,57],"drizzle"); add([61,63,65,66,67,80,81,82],"rain");
  add([71,73,75,77,85,86],"snow"); add([95,96,99],"storm");
  return m;                          // anything unmapped falls through to no symbol
})();

// Drawn by hand on a 24x24 box — no icon font, no dependency — then scaled into
// place. cx is the centre of the glyph, top its upper edge.
function weatherGlyph(kind,cx,top,size,fc){
  const soft="var(--ink-soft)", wet="var(--rain)", warm="var(--solar)", cold="var(--cold)";
  const cloud=(dx,dy,sc,f)=>`<g transform="translate(${dx} ${dy}) scale(${sc})" fill="${f}">`
    +`<circle cx="9" cy="13" r="4"/><circle cx="14.8" cy="11.8" r="5"/>`
    +`<rect x="6.6" y="12.6" width="11.6" height="5" rx="2.5"/></g>`;
  const sun=(x,y,r,f)=>{
    let o=`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}"/>`;
    for(let a=0;a<8;a++){
      const t=a*Math.PI/4, dx=Math.cos(t), dy=Math.sin(t);
      o+=`<line x1="${(x+dx*(r+1.7)).toFixed(1)}" y1="${(y+dy*(r+1.7)).toFixed(1)}" `
        +`x2="${(x+dx*(r+3.8)).toFixed(1)}" y2="${(y+dy*(r+3.8)).toFixed(1)}" `
        +`stroke="${f}" stroke-width="1.7" stroke-linecap="round"/>`;
    }
    return o;
  };
  // Three falling strokes, staggered so they don't read as a comb.
  const fall=(f,w,dx,len)=>[8.5,12,15.5].map((x,i)=>{
    const y=19+(i%2)*0.9;
    return `<line x1="${x}" y1="${y}" x2="${(x+dx).toFixed(1)}" y2="${(y+len).toFixed(1)}" `
      +`stroke="${f}" stroke-width="${w}" stroke-linecap="round"/>`;
  }).join("");
  const flakes=()=>[8.5,12,15.5].map((x,i)=>{
    const y=20.2+(i%2)*1.3;
    return [0,60,120].map(a=>{
      const t=a*Math.PI/180, dx=Math.cos(t)*1.9, dy=Math.sin(t)*1.9;
      return `<line x1="${(x-dx).toFixed(1)}" y1="${(y-dy).toFixed(1)}" `
        +`x2="${(x+dx).toFixed(1)}" y2="${(y+dy).toFixed(1)}" `
        +`stroke="${cold}" stroke-width="1.2" stroke-linecap="round"/>`;
    }).join("");
  }).join("");
  let body;
  switch(kind){
    case "clear":   body=sun(12,12,4.8,warm); break;
    case "partly":  body=sun(8.6,8.6,3.7,warm)+cloud(3.4,4.6,0.82,soft); break;
    case "cloud":   body=cloud(0,-1,1,soft); break;
    case "fog":     body=cloud(0,-3.5,1,soft)+[0,1,2].map(i=>
      `<line x1="${6+(i%2)*1.6}" y1="${19.2+i*2.2}" x2="${18-(i%2)*1.6}" y2="${19.2+i*2.2}" `
      +`stroke="${soft}" stroke-width="1.6" stroke-linecap="round"/>`).join(""); break;
    case "drizzle": body=cloud(0,-3.5,1,soft)+fall(wet,1.5,-0.8,2.4); break;
    case "rain":    body=cloud(0,-3.5,1,soft)+fall(wet,1.9,-1.4,4.2); break;
    case "snow":    body=cloud(0,-3.5,1,soft)+flakes(); break;
    case "storm":   body=cloud(0,-4.6,0.95,soft)
      +`<polygon points="13.4,15.6 9.7,21.1 12.1,21.1 10.8,23.8 15.3,18 12.7,18" fill="${warm}"/>`; break;
    default: return "";
  }
  return `<g transform="translate(${(cx-size/2).toFixed(1)} ${top.toFixed(1)}) `
    +`scale(${(size/24).toFixed(4)})"${fc?` opacity="0.7"`:``}>${body}</g>`;
}

function draw(){
  closeFly();                 // the card is anchored to a bucket; a redraw moves it
  if(!cities.length) return;
  if(mode==="hot") return drawHot();
  const svg=$("chart"); $("fig").hidden=false;
  const M=isMobile();
  const solo=cities.length===1?cities[0]:null;
  const hasSoil=!!(solo&&soilOn&&solo.soil);
  const hasSolar=!!(solo&&solarOn);

  let list;
  if(M){
    let p=activePanel;
    if(p==="soil"&&!hasSoil) p="temp";
    if(p==="solar"&&!hasSolar) p="temp";
    if(!solo&&(p==="soil"||p==="solar")) p="temp";
    list=[p];
  }else{
    list=["temp","rain"];
    if(hasSoil) list.push("soil");
    if(hasSolar) list.push("solar");
  }
  const showSoil=list.includes("soil"), showSolar=list.includes("solar");

  // Visible buckets: whole buckets that overlap the view, so a month bar always sums
  // its whole month even when only part of it is on screen.
  const B=buildBuckets(gran).filter(b=>b.idxs[b.idxs.length-1]>=view.a && b.idxs[0]<=view.b);
  if(!B.length) return;
  const NB=B.length;

  const W=M?380:1000;
  const L=M?34:52;
  const R=showSolar?(M?24:38):(M?8:12);
  const iw=W-L-R;

  // A condition symbol per day in its own row above the panels. Day granularity
  // only — a week has no single condition — one city only, and only while the
  // glyphs have room to sit side by side without touching.
  const symSize=M?15:17;
  const showSym=!!solo&&gran==="day"&&(NB<2?iw:iw/(NB-1))>=symSize+3;

  const geom={}; let y=M?12:14, symTop=null;
  if(showSym){ symTop=y; y+=symSize+(M?6:8); }
  list.forEach(p=>{
    const lab=(p==="temp")?((M&&gran!=="day")?20:0):(M?20:22);
    const h=M?(p==="temp"?252:210):(p==="temp"?294:p==="rain"?104:p==="soil"?88:96);
    y+=lab; geom[p]={top:y,h}; y+=h+(M?0:42);
  });
  const BOT=y-(M?0:42);
  const XLAB=BOT+(M?20:24), H=XLAB+(M?14:18);
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const has=p=>!!geom[p];
  const X=i=>L+(NB<2?iw/2:i*iw/(NB-1));

  // Pre-aggregate every city and the normals once per draw.
  const A=new Map(cities.map(c=>[c,B.map(b=>aggCity(c,b))]));
  const CN=(solo&&solo.clim)?B.map(b=>aggClim(solo.clim,b)):null;

  // Wettest and driest years on the rain panel, the same encoding the Hot days tab
  // uses. Day aggregation is excluded on purpose: one specific year's rainfall on
  // one date is noise, unlike the ±7-day-smoothed normal it would sit next to.
  const rainRec=(solo&&gran!=="day")?rainExtremes(solo):null;
  const wetB=rainRec?B.map(b=>bucketSum(rainRec.wet.byKey,b)):null;
  const dryB=rainRec?B.map(b=>bucketSum(rainRec.dry.byKey,b)):null;

  // Split at the first fully-forecast bucket, overlapping by one so lines join.
  // The dashes start where measurement stops, which is the first estimated day,
  // not merely the first day after today.
  let firstFc=B.findIndex((b,i)=>b.allFc||!!(solo&&A.get(solo)[i]&&A.get(solo)[i].est));
  const boundary=firstFc===-1?NB-1:Math.max(0,firstFc-1);
  const poly=(arr,f,past)=>{
    const out=[];
    arr.forEach((r,i)=>{
      if(r==null) return;
      if(past?i>boundary:i<boundary) return;
      const v=f(r); if(v==null||!isFinite(v)) return;
      out.push(`${X(i).toFixed(1)},${v.toFixed(1)}`);
    });
    return out;
  };
  const emit=(arr,f,cls,extra)=>{
    let s="";
    [[true,cls],[false,cls+" fc"]].forEach(([past,c])=>{
      const p=poly(arr,f,past);
      if(p.length>1) s+=`<polyline class="${c}" ${extra||""} points="${p.join(" ")}"/>`;
    });
    return s;
  };

  let s="";

  /* temperature */
  let Y=null;
  if(has("temp")){
    const g=geom.temp;
    let lo=Infinity,hi=-Infinity;
    cities.forEach(c=>A.get(c).forEach(r=>{ if(!r) return;
      if(solo){lo=Math.min(lo,r.lo); hi=Math.max(hi,r.hi);} else {lo=Math.min(lo,r.mean); hi=Math.max(hi,r.mean);}}));
    if(CN) CN.forEach(n=>{ if(n){lo=Math.min(lo,n.lo); hi=Math.max(hi,n.hi);} });
    if(!isFinite(lo)){lo=40;hi=90;}
    const y0=Math.floor((lo-4)/10)*10, y1=Math.ceil((hi+4)/10)*10;
    Y=v=>g.top+g.h-(v-y0)/(y1-y0)*g.h;
    const step=(M&&y1-y0>60)?20:10;
    for(let v=y0;v<=y1;v+=step)
      s+=`<line class="gridline" x1="${L}" y1="${Y(v).toFixed(1)}" x2="${W-R}" y2="${Y(v).toFixed(1)}"/>`
        +`<text x="${L-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end">${v}°</text>`;
    // No axis title — the ° on every tick already says what this is. The week and
    // month wording stays, because it changes what the two lines mean.
    if(gran!=="day") s+=`<text class="panellabel" x="${L}" y="${g.top-6}">`
      +`Mean daily high and low per ${gran}</text>`;
  }

  /* rainfall */
  let PY=null;
  if(has("rain")){
    const g=geom.rain;
    let pmax=0;
    if(solo){
      A.get(solo).forEach(r=>{ if(r&&r.rain!=null) pmax=Math.max(pmax,r.rain); });
      if(CN) CN.forEach(n=>{ if(n&&n.pr!=null) pmax=Math.max(pmax,n.pr); });
      if(wetB) wetB.forEach(v=>{ if(v!=null) pmax=Math.max(pmax,v); });
      pmax=gran==="day"?Math.max(0.25,Math.ceil(pmax*4)/4):Math.max(1,Math.ceil(pmax));
    }else{
      cities.forEach(c=>A.get(c).forEach(r=>{ if(r&&r.cum!=null) pmax=Math.max(pmax,r.cum); }));
      pmax=Math.max(1,Math.ceil(pmax));
    }
    PY=v=>g.top+g.h-(v/pmax)*g.h;
    [0,pmax/2,pmax].forEach(v=>{
      s+=`<line class="gridline" x1="${L}" y1="${PY(v).toFixed(1)}" x2="${W-R}" y2="${PY(v).toFixed(1)}"/>`
        +`<text x="${L-8}" y="${(PY(v)+4).toFixed(1)}" text-anchor="end">${pmax<2?v.toFixed(2):v.toFixed(1)}"</text>`;
    });
    s+=`<text class="panellabel" x="${L}" y="${g.top-6}">`
      +(solo?`Rainfall, ${rainUnit()}`:`Cumulative rain since 1 Jan, in`)+`</text>`;
  }

  /* soil */
  let SY=null;
  if(showSoil){
    const g=geom.soil;
    SY=v=>g.top+g.h-(v/100)*g.h;
    // Gradient runs down the panel in user space, so a point's colour is its percentile.
    s+=`<defs><linearGradient id="soilgrad" gradientUnits="userSpaceOnUse" `
      +`x1="0" y1="${SY(0).toFixed(1)}" x2="0" y2="${SY(100).toFixed(1)}">`
      +SOIL_STOPS.map(([p,c])=>`<stop offset="${p}%" stop-color="${c}"/>`).join("")+`</linearGradient></defs>`
      +`<rect class="normalband" x="${L}" y="${SY(70).toFixed(1)}" width="${iw}" height="${(SY(30)-SY(70)).toFixed(1)}"/>`;
    [0,50,100].forEach(v=>{
      s+=`<line class="gridline" x1="${L}" y1="${SY(v).toFixed(1)}" x2="${W-R}" y2="${SY(v).toFixed(1)}"/>`
        +`<text x="${L-8}" y="${(SY(v)+4).toFixed(1)}" text-anchor="end">${v}</text>`;
    });
    s+=`<text class="panellabel" x="${L}" y="${g.top-6}">Soil 7&ndash;28&thinsp;cm, percentile vs ${SOIL_FROM}&ndash;${SOIL_TO}</text>`;
  }

  /* solar + UV */
  let UY=null,VY=null;
  if(showSolar){
    const g=geom.solar;
    let smax=0,umax=0;
    A.get(solo).forEach(r=>{ if(!r) return;
      if(r.solar!=null) smax=Math.max(smax,r.solar);
      if(r.uv!=null) umax=Math.max(umax,r.uv); });
    if(CN) CN.forEach(n=>{ if(n&&n.sr!=null) smax=Math.max(smax,n.sr); });
    smax=Math.max(1,Math.ceil(smax)); umax=Math.max(4,Math.ceil(umax));
    UY=v=>g.top+g.h-(v/smax)*g.h;
    VY=v=>g.top+g.h-(v/umax)*g.h;
    [0,smax/2,smax].forEach(v=>{
      s+=`<line class="gridline" x1="${L}" y1="${UY(v).toFixed(1)}" x2="${W-R}" y2="${UY(v).toFixed(1)}"/>`
        +`<text x="${L-8}" y="${(UY(v)+4).toFixed(1)}" text-anchor="end">${v.toFixed(1)}</text>`;});
    [0,umax/2,umax].forEach(v=>{
      s+=`<text x="${W-R+6}" y="${(VY(v)+4).toFixed(1)}" fill="var(--uv)">${v.toFixed(0)}</text>`;});
    s+=`<text class="panellabel" x="${L}" y="${g.top-6}">`
      +`<tspan fill="var(--solar)">Solar kWh/m² per day</tspan><tspan> · </tspan>`
      +`<tspan fill="var(--uv)">UV index (right)</tspan></text>`;
  }

  /* x axis */
  const rule=i=>list.map(p=>`<line class="monthrule" x1="${X(i).toFixed(1)}" y1="${geom[p].top}" `
    +`x2="${X(i).toFixed(1)}" y2="${geom[p].top+geom[p].h}"/>`).join("");
  const maxLab=M?5:12;
  const step=Math.max(1,Math.ceil(NB/maxLab));
  B.forEach((b,i)=>{
    if(i%step) return;
    s+=rule(i)+`<text x="${X(i).toFixed(1)}" y="${XLAB}" text-anchor="middle">${b.label}</text>`;
  });

  /* weather symbols */
  if(showSym){
    const a=A.get(solo);
    B.forEach((b,i)=>{
      const r=a[i]; if(!r||r.wc==null) return;
      const kind=WMO_GLYPH.get(r.wc); if(!kind) return;
      s+=weatherGlyph(kind,X(i),symTop,symSize,b.allFc);
    });
  }

  /* series */
  if(has("temp")){
    if(solo){
      if(CN){
        const top=CN.map((n,i)=>n?`${X(i).toFixed(1)},${Y(n.hi).toFixed(1)}`:null).filter(Boolean);
        const bot=CN.map((n,i)=>n?`${X(i).toFixed(1)},${Y(n.lo).toFixed(1)}`:null).filter(Boolean);
        if(top.length>1) s+=`<polygon class="normalband" points="${top.join(" ")} ${bot.slice().reverse().join(" ")}"/>`
          +`<polyline class="normaledge" points="${top.join(" ")}"/>`
          +`<polyline class="normaledge" points="${bot.join(" ")}"/>`;
      }
      const a=A.get(solo);
      s+=emit(a,r=>Y(r.hi),"hi")+emit(a,r=>Y(r.lo),"lo")+emit(a,r=>Y(r.mean),"meanline");
      if(NB<=60&&(NB<2?iw:iw/(NB-1))<2*(M?10:11.5))
        a.forEach((r,i)=>{ if(r) s+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(r.mean).toFixed(1)}" `
          +`r="2.4" fill="var(--ink)"${B[i].allFc?' fill-opacity="0.5"':''}/>`; });
      {
        const g=geom.temp, gap=M?44:62, maxN=M?5:9;
        const spacing=NB<2?iw:iw/(NB-1);
        const rr=M?10:11.5, fs=M?10:10.5;
        // A labelled node on every point, but only while the circles can't touch.
        // Past that density they'd overlap into mush, so fall back to peak labels.
        if(spacing>=2*rr){
          a.forEach((r,i)=>{
            if(!r) return;
            [[r.hi,"var(--hot)"],[r.lo,"var(--cold)"]].forEach(([v,col])=>{
              const cy=Y(v), cx=X(i), n=String(Math.round(v));
              // Shrink only as far as the ring demands — 3-digit values need it, 2 don't.
              const f=Math.min(fs,(2*rr-3)/(n.length*0.6));
              s+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${rr}" `
                +`fill="var(--paper)" stroke="${col}" stroke-width="1.4"`
                +(B[i].allFc?` stroke-dasharray="3 2"`:``)+`/>`
                +`<text class="dnode" x="${cx.toFixed(1)}" y="${(cy+f*0.35).toFixed(1)}" `
                +`text-anchor="middle" fill="${col}" font-size="${f.toFixed(1)}">${n}</text>`;
            });
          });
        }else{
          // Zoomed in far enough that every point has room? Label them all.
          const all=NB<=(M?8:14);
          const hiPts=all?a.map((r,i)=>r?{i,v:r.hi}:null).filter(Boolean)
                         :pickLabels(a,r=>r.hi,true,X,gap,maxN);
          const loPts=all?a.map((r,i)=>r?{i,v:r.lo}:null).filter(Boolean)
                         :pickLabels(a,r=>r.lo,false,X,gap,maxN);
          hiPts.forEach(c=>{
            const y=Math.max(g.top+10,Y(c.v)-9);   // keep it inside the panel
            s+=`<text class="dlabel hotlab" x="${X(c.i).toFixed(1)}" y="${y.toFixed(1)}" `
              +`text-anchor="middle">${Math.round(c.v)}°</text>`;
          });
          loPts.forEach(c=>{
            const y=Math.min(g.top+g.h-3,Y(c.v)+16);
            s+=`<text class="dlabel coldlab" x="${X(c.i).toFixed(1)}" y="${y.toFixed(1)}" `
              +`text-anchor="middle">${Math.round(c.v)}°</text>`;
          });
        }
      }
    }else{
      cities.forEach(c=>{ s+=emit(A.get(c),r=>Y(r.mean),"cityline",`stroke="${c.color}"`); });
    }
  }

  if(has("rain")){
    if(solo){
      if(CN){
        const nr=CN.map((n,i)=>n&&n.pr!=null?`${X(i).toFixed(1)},${PY(n.pr).toFixed(1)}`:null).filter(Boolean);
        if(nr.length>1) s+=`<polyline class="normalrain" points="${nr.join(" ")}"/>`;
      }
      const g=geom.rain, bw=Math.max(1.2,Math.min(34,iw/Math.max(NB,1)*0.7));
      A.get(solo).forEach((r,i)=>{
        if(!r||!r.rain) return;
        const h=Math.max(1,g.top+g.h-PY(r.rain));
        s+=`<rect class="bar${(B[i].allFc||r.est)?" fcbar":""}" x="${(X(i)-bw/2).toFixed(1)}" `
          +`y="${(g.top+g.h-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}"/>`;
      });
      // Over the bars, not behind: a record year drier than this one is the
      // interesting case and a filled bar would hide it.
      if(rainRec) B.forEach((b,i)=>{
        [[wetB[i],"var(--cold)"],[dryB[i],"var(--soil)"]].forEach(([v,col])=>{
          if(!v) return;
          const h=Math.max(1,g.top+g.h-PY(v));
          s+=`<rect x="${(X(i)-bw/2).toFixed(1)}" y="${(g.top+g.h-h).toFixed(1)}" `
            +`width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="none" stroke="${col}" `
            +`stroke-width="1.1" stroke-dasharray="3 2" opacity=".85"/>`;
        });
      });
      {
        // Only the wettest few — a label on every bar would bury the panel.
        const gap=M?44:58, maxN=M?3:5, shown=[];
        A.get(solo).map((r,i)=>({i,v:r&&r.rain})).filter(x=>x.v>0)
          .sort((x,y)=>y.v-x.v)
          .forEach(c=>{
            if(shown.length>=maxN) return;
            if(shown.every(o=>Math.abs(X(o.i)-X(c.i))>=gap)) shown.push(c);
          });
        shown.forEach(c=>{
          const y=Math.max(geom.rain.top+9,PY(c.v)-6);
          s+=`<text class="dlabel wetlab" x="${X(c.i).toFixed(1)}" y="${y.toFixed(1)}" `
            +`text-anchor="middle">${c.v.toFixed(2)}"</text>`;
        });
      }
    }else{
      cities.forEach(c=>{ s+=emit(A.get(c),r=>PY(r.cum||0),"cityline",`stroke="${c.color}"`); });
    }
  }

  if(showSoil){
    const a=A.get(solo);
    const pts=[],xs=[];
    a.forEach((r,i)=>{ if(!r||r.soilPct==null) return;
      xs.push(X(i)); pts.push(`${X(i).toFixed(1)},${SY(r.soilPct).toFixed(1)}`); });
    if(pts.length>1){
      // The gradient is positional, so the fill above the midline picks up the wet hues
      // and the part below picks up the dry ones, with no extra logic.
      const mid=xs.slice().reverse().map(x=>`${x.toFixed(1)},${SY(50).toFixed(1)}`);
      s+=`<polygon class="soilfill" fill="url(#soilgrad)" points="${pts.join(" ")} ${mid.join(" ")}"/>`
        +`<line class="midline" x1="${L}" y1="${SY(50).toFixed(1)}" x2="${W-R}" y2="${SY(50).toFixed(1)}"/>`
        +`<polyline class="soilline" stroke="url(#soilgrad)" points="${pts.join(" ")}"/>`;
    }
    const ap=a.map((r,i)=>r&&r.apiPct!=null?`${X(i).toFixed(1)},${SY(r.apiPct).toFixed(1)}`:null).filter(Boolean);
    if(ap.length>1) s+=`<polyline class="apiline" points="${ap.join(" ")}"/>`;
  }

  if(showSolar){
    const g=geom.solar, a=A.get(solo), xs=[], sol=[];
    a.forEach((r,i)=>{ if(!r||r.solar==null) return;
      xs.push(X(i)); sol.push(`${X(i).toFixed(1)},${UY(r.solar).toFixed(1)}`); });
    if(sol.length>1){
      s+=`<polygon class="solarfill" points="${sol.join(" ")} `
        +`${xs[xs.length-1].toFixed(1)},${(g.top+g.h).toFixed(1)} ${xs[0].toFixed(1)},${(g.top+g.h).toFixed(1)}"/>`;
      if(CN){
        const ns=CN.map((n,i)=>n&&n.sr!=null?`${X(i).toFixed(1)},${UY(n.sr).toFixed(1)}`:null).filter(Boolean);
        if(ns.length>1) s+=`<polyline class="normalsolar" points="${ns.join(" ")}"/>`;
      }
      s+=emit(a,r=>r.solar==null?null:UY(r.solar),"solarline");
    }
    // UV reaches back only as far as the forecast feed's past_days window.
    s+=emit(a,r=>r.uv==null?null:VY(r.uv),"uvline");
  }

  const TOP=geom[list[0]].top;

  // Today is always marked. The selected day is a separate, brighter line that only
  // appears once you've picked one, and it survives zooming or re-aggregating.
  const todayB=B.findIndex(b=>b.idxs[0]<=TODAY_IDX&&b.idxs[b.idxs.length-1]>=TODAY_IDX);
  if(todayB>=0){
    const bx=X(todayB);
    s+=`<line class="todayline" x1="${bx.toFixed(1)}" y1="${TOP}" x2="${bx.toFixed(1)}" y2="${BOT}"/>`
      +(M?``:`<text class="todaylab" x="${(bx+5).toFixed(1)}" y="${TOP+11}">today</text>`);
  }
  const selB=selDate?B.findIndex(b=>b.first<=selDate&&b.last>=selDate):-1;
  const selX=selB>=0?X(selB):0;
  s+=`<line id="hr" class="hover-rule" x1="${selX.toFixed(1)}" x2="${selX.toFixed(1)}" `
    +`y1="${TOP}" y2="${BOT}"${selB>=0?"":` style="display:none"`}/>`
    +`<rect id="brush" class="brush" y="${TOP}" height="${BOT-TOP}" width="0" style="display:none"/>`
    +`<rect id="hit" x="${L}" y="${TOP}" width="${iw}" height="${BOT-TOP}" fill="transparent"/>`;
  svg.innerHTML=s;
  svg._geom={W,L,iw,X,B,A};

  // Nothing picked yet? Show today, so the app opens with useful numbers.
  if(!selDate&&todayB>=0) renderReadout(todayB,false);
  else if(selDate&&selB>=0) renderReadout(selB,false);

  legend(solo,showSoil,showSolar,M,rainRec); headline(solo); renderStats(showSoil);
  renderFcSources(solo);
  // Must not touch anything inside #readout — renderReadout rewrites that whole subtree.
  $("hint2").textContent=(M?"Touch the chart to read a period. Pinch with two fingers to zoom."
                            :"Drag across the chart to zoom. Scroll to zoom, hover to read a period.")
    +(gran==="day"?"":` Showing ${NB} ${gran}${NB===1?"":"s"}; rainfall sums, everything else averages.`)
    +(M&&list.length===1?" One panel at a time — switch above.":"");
  document.querySelectorAll("[data-days]").forEach(b=>
    b.setAttribute("aria-pressed",String(+b.dataset.days===preset)));
}

// The point of this block: when a forecast disagrees with whatever app you trust,
// read across and find the row that matches, then pick it above. Highs only — that
// is what the phone apps put in large type and what people compare.
function renderFcSources(solo){
  const box=$("fcsrc");
  if(!solo||!IS_CURRENT||mode!=="chart"){ box.hidden=true; return; }
  const rows=[];
  if(solo.nwsMap) rows.push({id:"nws",label:"NWS (weather.gov)",map:solo.nwsMap});
  FC_MODELS.forEach(m=>{
    if(m.id!=="nws"&&solo.alt&&solo.alt[m.id]) rows.push({id:m.id,label:m.label,map:solo.alt[m.id]});
  });
  if(rows.length<2){
    // The models are a separate request, deliberately not made unless wanted.
    box.innerHTML=`<h2>Forecast sources</h2><p class="lede">`
      +(solo.altTried
        ? `The model comparison didn't load — Open-Meteo may be rate-limiting this browser.`
        : `The chart is showing <b>${esc((FC_MODELS.find(m=>m.id===fcSource)||{}).label||fcSource)}</b>. `
          +`Load the other forecast models to compare them day by day and pick whichever `
          +`matches the forecast you trust.`)
      +`</p>`+(solo.altTried?``:`<button id="altbtn" type="button">Compare forecast sources</button>`);
    box.hidden=false;
    const btn=$("altbtn");
    if(btn) btn.onclick=()=>{ btn.disabled=true; btn.textContent="Loading\u2026"; maybeLoadAlt(solo); };
    return;
  }
  const dates=[];
  for(let i=TODAY_IDX+1;i<DATES.length&&dates.length<7;i++) dates.push(DATES[i]);
  if(!dates.length){ box.hidden=true; return; }
  const cell=(r,t)=>{
    const v=r.map.get(t);
    return `<td>${v&&v.hi!=null?Math.round(v.hi)+"°":"—"}</td>`;
  };
  const spread=dates.map(t=>{
    const vs=rows.map(r=>r.map.get(t)).filter(v=>v&&v.hi!=null).map(v=>v.hi);
    return vs.length>1?Math.max(...vs)-Math.min(...vs):0;
  });
  const worst=Math.max(...spread);
  box.innerHTML=`<h2>Forecast sources for ${esc(solo.label)}</h2>`
    +`<p class="lede">Daily high by source. They disagree by up to `
    +`<b>${worst.toFixed(0)}°F</b> over the next ${dates.length} days. Find the row that `
    +`matches the forecast you trust and pick it from the <b>forecast source</b> menu — `
    +`the choice sticks on this browser.</p>`
    +`<div class="scroller"><table><thead><tr><th></th>`
    +dates.map(t=>`<th>${pretty(t)}</th>`).join("")+`</tr></thead><tbody>`
    +rows.map(r=>`<tr${r.id===fcSource?' class="active"':''}>`
      +`<td>${esc(r.label)}${r.id===fcSource?" &middot; showing":""}</td>`
      +dates.map(t=>cell(r,t)).join("")+`</tr>`).join("")
    +`</tbody></table></div>`
    +`<p class="foot">NWS publishes about seven days; Open-Meteo's models run to `
    +`${FC_DAYS}. Beyond whichever source is chosen, the blend fills the rest.</p>`;
  box.hidden=false;
}

function legend(solo,showSoil,showSolar,M,rainRec){
  const bits=[];
  if(solo){
    if(!M||activePanel==="temp"){
      bits.push(`<span><i style="background:var(--hot)"></i>High</span>`,
                `<span><i style="background:var(--cold)"></i>Low</span>`,
                `<span><i style="background:var(--ink)"></i>Mean</span>`);
      if(solo.clim) bits.push(`<span><i class="swatch"></i>Normal, ${CLIM_FROM}&ndash;${CLIM_TO}</span>`);
    }
    if(!M||activePanel==="rain") bits.push(`<span><i class="block"></i>Rainfall</span>`);
    if(rainRec&&(!M||activePanel==="rain")) bits.push(
      `<span><i class="dashed" style="border-color:var(--cold)"></i>`
        +`Wettest year, ${rainRec.wet.year} (${rainRec.wet.total.toFixed(1)}")</span>`,
      `<span><i class="dashed" style="border-color:var(--soil)"></i>`
        +`Driest, ${rainRec.dry.year} (${rainRec.dry.total.toFixed(1)}")</span>`);
    if(showSoil){
      bits.push(`<span>Soil <i class="grad" style="margin:0 7px"></i>dry to saturated</span>`);
      if(solo.api) bits.push(`<span><i class="dashed" style="border-color:var(--rain)"></i>Antecedent rain index</span>`);
    }
    if(showSolar) bits.push(`<span><i style="background:var(--solar)"></i>Solar</span>`,
                            `<span><i style="background:var(--uv)"></i>UV</span>`);
  }else{
    cities.forEach(c=>bits.push(`<span><i style="background:${c.color}"></i>${esc(c.label)}</span>`));
  }
  bits.push(`<span><i class="dashed"></i>Forecast</span>`,
            `<span><i style="background:var(--today)"></i>Today</span>`);
  if(selDate) bits.push(`<span><i style="background:var(--ink)"></i>Selected</span>`);
  $("key").innerHTML=bits.join("");
}

function headline(solo){
  if(solo){
    const obs=DATES.slice(0,TODAY_IDX+1).map(t=>solo.byDate.get(t)).filter(r=>r&&!r.est);
    if(!obs.length){ $("stand").textContent=`No observations for ${solo.label} yet.`; return; }
    const warm=obs.reduce((a,b)=>b.hi>a.hi?b:a), cool=obs.reduce((a,b)=>b.lo<a.lo?b:a);
    const ym=obs.reduce((a,b)=>a+b.mean,0)/obs.length;
    const wet=obs.reduce((a,b)=>a+(b.pr||0),0);
    let tail="";
    if(solo.clim){
      const paired=obs.filter(r=>solo.clim.get(r.date.slice(5)));
      const dep=paired.reduce((a,r)=>a+(r.mean-solo.clim.get(r.date.slice(5)).mean),0)/paired.length;
      const nwet=paired.reduce((a,r)=>a+(solo.clim.get(r.date.slice(5)).prRaw||0),0);
      tail=` That runs <b>${Math.abs(dep).toFixed(1)}°F ${dep>=0?"above":"below"}</b> its ${CLIM_FROM}&ndash;${CLIM_TO} average`
        +(nwet>0?`, and rainfall is <b>${Math.abs(wet-nwet).toFixed(2)}" ${wet>=nwet?"ahead of":"behind"}</b> the normal ${nwet.toFixed(2)}".`:`.`);
    }
    if(soilOn&&solo.soil){
      const last=[...solo.soil.entries()].filter(([d])=>d<=OBS_END).pop();
      if(last) tail+=` Soil at 7&ndash;28&thinsp;cm sits in the <b>${Math.round(last[1].pct)}th percentile</b> `
        +`— <b>${wetWord(last[1].pct)}</b> against ${SOIL_FROM}&ndash;${SOIL_TO}.`;
    }
    $("stand").innerHTML=`<b>${esc(solo.label)}</b> — ${obs.length} observed days from 1 January, averaging `
      +`<b>${ym.toFixed(1)}°F</b>, peaking at <b>${Math.round(warm.hi)}°F</b> on ${pretty(warm.date)} and bottoming `
      +`at <b>${Math.round(cool.lo)}°F</b> on ${pretty(cool.date)}. Rainfall totals <b>${wet.toFixed(2)}"</b>.`+tail;
  }else{
    const stats=cities.map(c=>{
      const obs=DATES.slice(0,TODAY_IDX+1).map(t=>c.byDate.get(t)).filter(r=>r&&!r.est);
      return {c,mean:obs.reduce((a,b)=>a+b.mean,0)/(obs.length||1),rain:c.totalRain||0};
    }).sort((a,b)=>b.mean-a.mean);
    const hot=stats[0], cold=stats[stats.length-1], wettest=[...stats].sort((a,b)=>b.rain-a.rain)[0];
    $("stand").innerHTML=`Comparing <b>${cities.length}</b> cities year to date. <b>${esc(hot.c.label)}</b> is warmest at `
      +`<b>${hot.mean.toFixed(1)}°F</b>, <b>${esc(cold.c.label)}</b> coolest at <b>${cold.mean.toFixed(1)}°F</b>, a spread of `
      +`<b>${(hot.mean-cold.mean).toFixed(1)}°F</b>. <b>${esc(wettest.c.label)}</b> has taken the most rain at `
      +`<b>${wettest.rain.toFixed(2)}"</b>. Drop to one city for highs, lows, normals, soil and solar.`;
  }
  const solo1=cities.length===1?cities[0]:null;
  $("src").textContent=(usedStale
      ? "Showing a saved copy — Open-Meteo is rate-limiting this browser, so these "
        +"numbers may be a few hours behind. "
      : "")
    +"Observations and soil: ERA5 via Open-Meteo, whose rainfall is a "
    +"modelled field on a ~31 km cell, not a gauge reading — it produces light-rain days "
    +"that a rain gauge would call dry. "
    +((solo1&&solo1.obsEnd)
      ? `Measured through ${pretty(solo1.obsEnd)}`
        +(solo1.estDays?`; the ${solo1.estDays} day${solo1.estDays===1?"":"s"} after that are `
          +`model estimates while ERA5 catches up. `:`. `)
      : "")
    +(()=>{
      const m=FC_MODELS.find(x=>x.id===fcSource), name=m?m.label:fcSource;
      if(fcSource==="nws")
        return (solo1&&solo1.nwsDays)?`Forecast: ${name} (${solo1.nwsDays} days), Open-Meteo beyond. `
                                     :"Forecast: Open-Meteo multi-model — NWS did not answer. ";
      return (solo1&&solo1.srcDays)?`Forecast: ${name}, your chosen source (${solo1.srcDays} days). `
                                   :`Forecast: ${name} did not answer — Open-Meteo blend in place. `;
    })()
    +"Search: Open-Meteo geocoding.";
}

/* ---------- interaction ---------- */
(function wire(){
  const svg=$("chart"), read=$("readout");
  const clamp=(a,b)=>{
    const span=b-a+1;
    if(a<0){a=0;b=span-1;}
    if(b>DATES.length-1){b=DATES.length-1;a=b-span+1;}
    return {a:Math.max(0,a),b:Math.min(DATES.length-1,b)};
  };
  function bucketAt(clientX){
    const g=svg._geom; if(!g) return 0;
    const r=svg.getBoundingClientRect();
    const px=(clientX-r.left)/r.width*g.W;
    const i=Math.round((px-g.L)/(g.iw||1)*(g.B.length-1));
    return Math.max(0,Math.min(g.B.length-1,i));
  }
  const show=i=>renderReadout(i,true);

  // A bucket index maps back to the date range it covers, so zoom stays in date space.
  const toDates=i=>{const b=svg._geom.B[i]; return [b.idxs[0],b.idxs[b.idxs.length-1]];};

  let drag=null;
  svg.addEventListener("mousedown",e=>{ if(e.target.id!=="hit") return; drag={i:bucketAt(e.clientX)}; e.preventDefault(); });
  window.addEventListener("mousemove",e=>{
    if(!drag){ if(e.target.id==="hit") show(bucketAt(e.clientX)); return; }
    const g=svg._geom, br=svg.querySelector("#brush"); if(!br) return;
    const a=g.X(drag.i), b=g.X(bucketAt(e.clientX));
    br.setAttribute("x",Math.min(a,b).toFixed(1)); br.setAttribute("width",Math.abs(b-a).toFixed(1));
    br.style.display="";
  });
  window.addEventListener("mouseup",e=>{
    if(!drag) return;
    const j=bucketAt(e.clientX), i0=Math.min(drag.i,j), i1=Math.max(drag.i,j);
    const br=svg.querySelector("#brush"); if(br) br.style.display="none";
    drag=null;
    if(i1-i0>=1){ preset=-99; view={a:toDates(i0)[0],b:toDates(i1)[1]}; draw(); }
    else { show(j); openFly(j,e.clientX); }      // never moved off the bucket: a tap
  });
  svg.addEventListener("wheel",e=>{
    if(e.target.id!=="hit") return;
    e.preventDefault();
    const anchor=toDates(bucketAt(e.clientX))[0], span=view.b-view.a+1;
    const next=Math.max(7,Math.min(DATES.length,Math.round(span*(e.deltaY>0?1.25:0.8))));
    const frac=span<2?0.5:(anchor-view.a)/(span-1);
    const a=Math.round(anchor-frac*(next-1));
    preset=-99; view=clamp(a,a+next-1); draw();
  },{passive:false});

  const dist=t=>Math.abs(t[0].clientX-t[1].clientX);
  const mid=t=>(t[0].clientX+t[1].clientX)/2;
  let touch=null;
  svg.addEventListener("touchstart",e=>{
    if(e.touches.length===2){
      e.preventDefault();
      closeFly();
      touch={mode:"pinch",d0:Math.max(20,dist(e.touches)),c0:mid(e.touches),v0:{...view}};
    }else if(e.touches.length===1&&e.target.id==="hit"){
      const j=bucketAt(e.touches[0].clientX);
      touch={mode:"scrub",i0:j}; show(j);
    }
  },{passive:false});
  svg.addEventListener("touchmove",e=>{
    if(!touch) return;
    if(touch.mode==="pinch"&&e.touches.length===2){
      e.preventDefault();
      const box=svg.getBoundingClientRect();
      const span0=touch.v0.b-touch.v0.a+1;
      const span=Math.max(7,Math.min(DATES.length,Math.round(span0*touch.d0/Math.max(20,dist(e.touches)))));
      const frac=(touch.c0-box.left)/box.width;
      const anchor=touch.v0.a+frac*(span0-1);
      const pan=-((mid(e.touches)-touch.c0)/box.width)*span;
      const a=Math.round(anchor-frac*(span-1)+pan);
      preset=-99; view=clamp(a,a+span-1); draw();
    }else if(touch.mode==="scrub"&&e.touches.length===1){
      show(bucketAt(e.touches[0].clientX));
    }
  },{passive:false});
  svg.addEventListener("touchend",e=>{
    // A tap is a scrub that never left the bucket it started on.
    if(touch&&touch.mode==="scrub"&&e.changedTouches.length===1){
      const t=e.changedTouches[0], j=bucketAt(t.clientX);
      if(j===touch.i0) openFly(j,t.clientX);
    }
    touch=null;
  });
  svg.addEventListener("touchcancel",()=>{touch=null;});

  // Dismiss: anywhere off the card and off the chart, or Escape.
  document.addEventListener("click",e=>{
    if(e.target.closest("#flyout")||e.target.closest("#chart")) return;
    closeFly();
  });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeFly(); });

  $("fcpick").innerHTML=FC_MODELS.map(m=>
    `<option value="${m.id}"${m.id===fcSource?" selected":""}>${esc(m.label)}</option>`).join("");
  $("fcpick").onchange=e=>{
    fcSource=e.target.value;
    try{ localStorage.setItem(FC_SRC_KEY,fcSource); }catch(err){}
    // Loads fire before draw(), never after — see CLAUDE.md.
    if(fcSource!=="nws") cities.forEach(c=>maybeLoadAlt(c));
    // Each source keeps its own map, so re-applying is just a re-lay, no refetch.
    cities.forEach(c=>applySource(c));
    clearNote(); draw();
  };

  $("thresh").innerHTML=HOT_CHOICES.map(v=>
    `<option value="${v}"${v===thresh?" selected":""}>${v}°F</option>`).join("");
  $("thresh").onchange=e=>{ thresh=+e.target.value; draw(); };
  $("tabs").querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{
    mode=b.dataset.mode;
    // Loads fire before draw(), never after — see CLAUDE.md. The hot-days view wants
    // the normals response for its monthly average and the long archive for records.
    if(mode==="hot"){ maybeLoadClim(); maybeLoadHist(cities.length===1?cities[0]:null); }
    syncButtons(); draw();
  });
  $("yearpick").innerHTML=(()=>{
    let o="";
    for(let y=CUR_YEAR;y>=YEAR_MIN;y--) o+=`<option value="${y}"${y===year?" selected":""}>${y}</option>`;
    return o;
  })();
  $("yearpick").onchange=e=>{
    setYear(+e.target.value);
    selDate=null;
    syncButtons(); clearNote();
    reloadYear();
  };
  $("granpick").querySelectorAll("[data-gran]").forEach(btn=>btn.onclick=()=>{
    gran=btn.dataset.gran;
    // Week and month are where the rain records are drawn, so pull them here rather
    // than at load. Fires before draw(), never after — see CLAUDE.md.
    if(gran!=="day") maybeLoadHist(cities.length===1?cities[0]:null);
    syncButtons(); draw();
  });
  document.querySelectorAll("[data-days]").forEach(btn=>btn.onclick=()=>{
    const d=+btn.dataset.days; preset=d;
    if(d===0) view={a:0,b:DATES.length-1};
    else if(d===-1) view={a:Math.max(0,TODAY_IDX-1),b:DATES.length-1};
    else view={a:Math.max(0,TODAY_IDX-d+1),b:DATES.length-1};
    draw();
  });
  $("out").onclick=()=>{
    const span=view.b-view.a+1, next=Math.min(DATES.length,Math.round(span*1.8));
    const c=(view.a+view.b)/2, a=Math.round(c-next/2);
    view=clamp(a,a+next-1);
    preset=(view.a===0&&view.b===DATES.length-1)?0:-99;
    draw();
  };
  $("soilbtn").onclick=()=>{ soilOn=!soilOn; clearNote(); syncButtons(); maybeLoadSoil(); draw(); };
  $("solarbtn").onclick=()=>{ solarOn=!solarOn; syncButtons(); draw(); };

  $("dl").hidden=false;
  $("dl").onclick=()=>{
    // Exports at whatever aggregation is on screen.
    const B=buildBuckets(gran);
    const head="city,period,period_start,period_end,days,kind,mean_high_f,mean_low_f,mean_f,"
      +"precip_in,precip_chance_pct,precip_cumulative_in,solar_kwh_m2_day,uv_index_mean,soil_percentile,antecedent_percentile";
    const body=cities.flatMap(c=>B.map(b=>{
      const r=aggCity(c,b); if(!r) return null;
      return [`"${c.label}"`,b.key,b.first,b.last,r.n,
              b.allFc?"forecast":b.anyFc?"mixed":"observed",
              r.hi.toFixed(2),r.lo.toFixed(2),r.mean.toFixed(2),
              r.rain==null?"":r.rain.toFixed(3), r.pop==null?"":Math.round(r.pop),
              r.cum==null?"":r.cum.toFixed(3),
              r.solar==null?"":r.solar.toFixed(3), r.uv==null?"":r.uv.toFixed(2),
              r.soilPct==null?"":r.soilPct.toFixed(1), r.apiPct==null?"":r.apiPct.toFixed(1)].join(",");
    }).filter(Boolean));
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([head+"\n"+body.join("\n")],{type:"text/csv"}));
    a.download=`weather-${year}-${gran}.csv`; a.click();
  };

  let rt=null;
  const relayout=()=>{clearTimeout(rt); rt=setTimeout(()=>{renderPanelPick(); draw();},150);};
  window.addEventListener("resize",relayout);
  window.addEventListener("orientationchange",relayout);
  if(mq.addEventListener) mq.addEventListener("change",relayout);
})();

setYear(CUR_YEAR);
addCity(32.2803,-89.9983,"Brandon, MS");
</script>
