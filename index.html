        +`<text class="dnode" x="${x.toFixed(1)}" y="${(Y(v)+f*0.35).toFixed(1)}" `
        +`text-anchor="middle" style="fill:${col}" font-size="${f.toFixed(1)}">${n}</text>`;
    };
    band.forEach(b=>{ if(b.i%cstep===0) s+=node(X(b.i),b.avg,"var(--hot)"); });
  }
  s+=`<text class="panellabel" x="${L}" y="${T-12}">Temperature °F, hour by hour — average of all sources</text>`;
  svg.innerHTML=s; svg._geom=null;

  const worst=band.reduce((a,b)=>Math.max(a,b.max-b.min),0);
  const pickName=(FC_MODELS.find(m=>m.id===fcSource)||{}).label||fcSource;
  $("key").innerHTML=`<span><i style="background:var(--hot)"></i>Average temperature</span>`
    +(pick?`<span><i style="background:var(--today)"></i>${esc(pickName)}, your pick</span>`:``)
    +`<span><i style="background:var(--ink-soft)"></i>Every other source</span>`
    +`<span><i class="swatch"></i>Full spread</span>`
    +(solo.sun?`<span><i style="background:var(--solar)"></i>Sunrise / sunset, night shaded</span>`:``);
  $("stand").innerHTML=`<b>${esc(solo.label)}</b> &mdash; the bold line averages `
    +`<b>${rows.length}</b> hourly sources over the next <b>${hours.length}</b> hours, which `
    +`disagree by as much as <b>${worst.toFixed(0)}°F</b> in one hour`
    +(pick?`. <b>${esc(pickName)}</b> is picked out in green.`:`.`);
  $("hint2").textContent="Read down a column for how far apart the sources are in one hour, "
    +"across a row to follow one source through the day.";
  $("stats").hidden=true;
  $("readout").innerHTML=`<span class="stat">Hourly temperature, `
    +`every source that publishes one for this point.</span>`;
  renderFcHourTable(solo,rows,hours);
}

function fcHourRows(city){
  if(!city.hr) return [];
  // FC_MODELS order, so the hourly table reads in the same order as the daily one.
  return FC_MODELS.map(m=>{
    const map=city.hr[m.id];
    return (map&&map.size)?Object.assign({},m,{map}):null;
  }).filter(Boolean);
}

// From the current hour forward. The hours already elapsed today are not a forecast,
// and showing them would put a model's analysis of 6am beside its forecast of 6pm.
function fcHours(rows,M){
  const d=new Date(), p=n=>String(n).padStart(2,"0");
  const from=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:00`;
  const all=new Set();
  rows.forEach(r=>r.map.forEach((v,t)=>{ if(t>=from) all.add(t); }));
  // Lexical sort is chronological for a fixed-width local timestamp.
  return [...all].sort().slice(0,M?HR_HOURS_M:HR_HOURS);
}
const hourLab=t=>{
  const h=+t.slice(11,13);
  return `${h%12===0?12:h%12}${h<12?"a":"p"}`;
};

function drawFc(){
  const svg=$("chart"); $("fig").hidden=false;
  const M=isMobile();
  const solo=cities.length===1?cities[0]:null;
  const say=t=>{ svg.setAttribute("viewBox",`0 0 ${M?380:1000} 120`);
    svg.innerHTML=`<text x="${M?12:20}" y="60" fill="var(--ink-soft)">${t}</text>`;
    svg._geom=null; $("key").innerHTML=""; $("fcsrc").hidden=true;
    $("stats").hidden=true; $("hint2").textContent=""; };
  if(!solo){ say("Drop to one city to compare forecast sources."); 
    $("stand").innerHTML=`The forecast comparison shows one city at a time.`; return; }
  if(!IS_CURRENT){ say(`${year} is over — there is no forecast to compare.`);
    $("stand").innerHTML=`Pick the current year to compare forecasts.`; return; }
  const rows=fcRows(solo);
  if(!rows.length){ say(solo.altTried?"The forecast models didn't load.":"Loading forecast models…");
    $("stand").innerHTML=solo.altTried
      ? `The models didn't load — Open-Meteo may be rate-limiting this browser.`
      : `Fetching every forecast source for <b>${esc(solo.label)}</b>…`;
    return; }
  const dates=fcDates(rows);
  if(!dates.length){ say("No forecast days available."); return; }

  const W=M?380:1000, L=M?34:52, R=M?10:16, BH=M?200:278;
  const iw=W-L-R;
  const X=i=>L+(dates.length<2?iw/2:i*iw/(dates.length-1));
  // A row of condition glyphs above the plot, on the same rule the Timeline uses:
  // they are drawn only while they have room to sit side by side without touching.
  const symSize=M?14:16;
  const sp=dates.length<2?iw:iw/(dates.length-1);
  const showSym=sp>=symSize+3;
  // The rain chance sits on its own line above the glyph, so the pair reads as one
  // unit: how wet, and what it looks like. "100%" is wider than the glyph is, which
  // is what caps the row rather than the icon.
  const popFont=M?8:8.5, popBase=M?7:8;
  const symTop=popBase+3;
  const T=(showSym?symTop+symSize+6:0)+(M?28:32);
  // XLAB is the date row; the weekday letter sits a line under it, so the panel is
  // that much taller than it was.
  const XLAB=T+BH+20, WDLAB=XLAB+(M?12:13), H=WDLAB+(M?8:10);
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);

  let lo=Infinity,hi=-Infinity;
  rows.forEach(r=>dates.forEach(t=>{const v=r.map.get(t); if(!v) return;
    [v.hi,v.lo].forEach(x=>{ if(x!=null){lo=Math.min(lo,x);hi=Math.max(hi,x);} });}));
  if(!isFinite(lo)){ say("No forecast days available."); return; }
  const y0=Math.floor((lo-3)/5)*5, y1=Math.ceil((hi+3)/5)*5;
  const Y=v=>T+BH-(v-y0)/(y1-y0||1)*BH;

  let s="";
  // Saturday and Sunday tinted behind everything. Parsed at midday so a daylight-saving
  // shift can never move a date onto the wrong weekday, and drawn half a step past the
  // outer columns so the tint covers them rather than stopping at their centres.
  {
    const half=sp/2;
    let run=null;
    const flush=end=>{
      if(run==null) return;
      const x0=Math.max(L,X(run)-half), x1=Math.min(W-R,X(end)+half);
      if(x1>x0) s+=`<rect class="weekendband" x="${x0.toFixed(1)}" y="${T}" `
        +`width="${(x1-x0).toFixed(1)}" height="${BH}"/>`;
      run=null;
    };
    dates.forEach((t,i)=>{
      if(isWeekend(t)){ if(run==null) run=i; if(i===dates.length-1) flush(i); }
      else flush(i-1);
    });
  }
  const step=(y1-y0>40)?10:5;
  for(let v=y0;v<=y1;v+=step)
    s+=`<line class="gridline" x1="${L}" y1="${Y(v).toFixed(1)}" x2="${W-R}" y2="${Y(v).toFixed(1)}"/>`
      +`<text x="${L-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end">${v}°</text>`;

  // Spread band, per day and per series: how far apart the sources are. High and low
  // are pooled separately — a source can cover one and not the other, so the counts
  // and the means are kept apart rather than assuming every row has both.
  const agg=(t,k)=>{
    const vs=rows.map(r=>r.map.get(t)).filter(v=>v&&v[k]!=null).map(v=>v[k]);
    return vs.length?{min:Math.min(...vs),max:Math.max(...vs),n:vs.length,
                      avg:vs.reduce((a,b)=>a+b,0)/vs.length}:null;
  };
  const band=dates.map((t,i)=>{
    const h=agg(t,"hi"); if(!h) return null;
    const l=agg(t,"lo");
    return {i,min:h.min,max:h.max,n:h.n,avg:h.avg,
            lmin:l&&l.min,lmax:l&&l.max,lavg:l?l.avg:null,ln:l?l.n:0};
  }).filter(Boolean);
  const fill=(hiKey,loKey)=>{
    const pts=band.filter(b=>b[hiKey]!=null&&b[loKey]!=null);
    if(pts.length<2) return "";
    const top=pts.map(b=>`${X(b.i).toFixed(1)},${Y(b[hiKey]).toFixed(1)}`);
    const bot=pts.map(b=>`${X(b.i).toFixed(1)},${Y(b[loKey]).toFixed(1)}`);
    return `<polygon class="normalband" points="${top.join(" ")} ${bot.slice().reverse().join(" ")}"/>`;
  };
  s+=fill("max","min")+fill("lmax","lmin");
  const line=(r,cls,key)=>{
    const pts=dates.map((t,i)=>{const v=r.map.get(t);
      return (v&&v[key]!=null)?`${X(i).toFixed(1)},${Y(v[key]).toFixed(1)}`:null;}).filter(Boolean);
    return pts.length>1?`<polyline class="${cls}" points="${pts.join(" ")}"/>`:"";
  };
  // The average is the headline line: one number a day, rather than asking the eye
  // to pick one model out of a dozen. The chosen source stays on as a reference so
  // the picker still means something here.
  rows.forEach(r=>{ if(r.id!==fcSource) s+=line(r,"fcthin","hi")+line(r,"fcthin","lo"); });
  const pick=rows.find(r=>r.id===fcSource);
  if(pick) s+=line(pick,"fcnws","hi")+line(pick,"fcnws","lo");
  const mean=(key,cls)=>{
    const pts=band.filter(b=>b[key]!=null)
      .map(b=>`${X(b.i).toFixed(1)},${Y(b[key]).toFixed(1)}`);
    return pts.length>1?`<polyline class="${cls}" points="${pts.join(" ")}"/>`:"";
  };
  s+=mean("avg","fcpick2")+mean("lavg","fcpick3");

  // Today, then a label under every day the axis has room for.
  const maxLab=M?5:14, lstep=Math.max(1,Math.ceil(dates.length/maxLab));
  dates.forEach((t,i)=>{
    if(i%lstep) return;
    s+=`<line class="monthrule" x1="${X(i).toFixed(1)}" y1="${T}" x2="${X(i).toFixed(1)}" y2="${T+BH}"/>`
      +`<text x="${X(i).toFixed(1)}" y="${XLAB}" text-anchor="middle">${+t.slice(8)}</text>`;
  });
  // The weekday letter goes on *every* column, not on the date row's cadence: one
  // character is narrow enough to fit where a date is not, and a letter on every other
  // day would be worse than none. Weekend letters take the band's colour so the two
  // read as one marking.
  dates.forEach((t,i)=>{
    const we=isWeekend(t);
    s+=`<text class="wdlab" x="${X(i).toFixed(1)}" y="${WDLAB}" text-anchor="middle"`
      +(we?` style="fill:var(--today)"`:``)+`>${WDAY_LETTER[dayOf(t)]}</text>`;
  });
  // The condition for each day, from the weather_code the forecast feed already
  // returned — no extra request. NWS days keep Open-Meteo's code, because NWS
  // publishes none, which is the same mismatch the Timeline's glyphs carry.
  if(showSym) dates.forEach((t,i)=>{
    const r=solo.byDate.get(t); if(!r) return;
    // The chance is drawn for every day that has one, zero included: a blank has to
    // mean "no figure published", not "nought per cent", or the row stops being
    // readable. Instead of hiding the dry days the ink is scaled to the number —
    // faint at 0, full at 100 — so the wet days find the eye on their own.
    if(r.pop!=null)
      // font-size rides the inline style, not an attribute: `text{font-size:12px}` in
      // the stylesheet beats a presentation attribute exactly the way it beats `fill`.
      s+=`<text class="poplab" x="${X(i).toFixed(1)}" y="${popBase}" text-anchor="middle" `
        +`style="font-size:${popFont}px;fill:var(--rain);`
        +`opacity:${(0.3+0.7*Math.min(1,Math.max(0,r.pop/100))).toFixed(2)}">`
        +`${Math.round(r.pop)}%</text>`;
    if(r.wc==null) return;
    const kind=WMO_GLYPH.get(r.wc); if(!kind) return;
    s+=weatherGlyph(kind,X(i),symTop,symSize,!!r.fc);
  });
  {
    const rr=M?10:11.5, sp=dates.length<2?iw:iw/(dates.length-1);
    const node=(x,v,col)=>{
      const n=String(Math.round(v)), f=Math.min(M?10:10.5,(2*rr-3)/(n.length*0.6));
      return `<circle cx="${x.toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${rr}" fill="var(--paper)" `
        +`stroke="${col}" stroke-width="1.4"/>`
        +`<text class="dnode" x="${x.toFixed(1)}" y="${(Y(v)+f*0.35).toFixed(1)}" `
        +`text-anchor="middle" style="fill:${col}" font-size="${f.toFixed(1)}">${n}</text>`;
    };
    if(sp>=2*rr) band.forEach(b=>{
      s+=node(X(b.i),b.avg,"var(--hot)");
      // The low's ring is dropped rather than drawn overlapping on a day with
      // barely any diurnal range — same rule the high/low labels follow elsewhere.
      if(b.lavg!=null&&Y(b.lavg)-Y(b.avg)>=2*rr) s+=node(X(b.i),b.lavg,"var(--cold)");
    });
  }
  s+=`<text class="panellabel" x="${L}" y="${T-12}">Daily high and overnight low °F — average of all sources</text>`;
  svg.innerHTML=s; svg._geom=null;

  const worst=band.reduce((a,b)=>Math.max(a,b.max-b.min),0);
  const pickName=(FC_MODELS.find(m=>m.id===fcSource)||{}).label||fcSource;
  $("key").innerHTML=`<span><i style="background:var(--hot)"></i>Average high</span>`
    +`<span><i style="background:var(--cold)"></i>Average low</span>`
    +(pick?`<span><i style="background:var(--today)"></i>${esc(pickName)}, your pick</span>`:``)
    +`<span><i style="background:var(--ink-soft)"></i>Every other source</span>`
    +`<span><i class="swatch"></i>Full spread</span>`;
  if(dates.some(t=>{const r=solo.byDate.get(t); return r&&r.pop!=null;}))
    $("key").innerHTML+=`<span><i style="background:var(--rain)"></i>Rain chance</span>`;
  $("stand").innerHTML=`<b>${esc(solo.label)}</b> &mdash; the bold lines average `
    +`<b>${rows.length}</b> forecast sources over <b>${dates.length}</b> days, which `
    +`disagree by as much as <b>${worst.toFixed(0)}°F</b> on one day`
    +(pick?`. <b>${esc(pickName)}</b> is picked out in green and drives the Timeline.`
      :`.`);
  $("hint2").textContent="Read down a column for how far apart the sources are on one day, "
    +"across a row to find the one matching a forecast you trust.";
  $("stats").hidden=true;
  $("readout").innerHTML=`<span class="stat">Daily high and overnight low, `
    +`every source that covers this point.</span>`;
  renderFcTable(solo,rows,dates);
}

// The map. Equirectangular with a cos(lat) correction on longitude, which is all a
// state this small needs — without it Mississippi comes out a third too wide. Returns
// the markup plus the projection, so the click targets and the drawing agree.
function msProject(box){
  const lons=MS_OUTLINE.map(p=>p[0]), lats=MS_OUTLINE.map(p=>p[1]);
  const w=[Math.min(...lons),Math.max(...lons)], h=[Math.min(...lats),Math.max(...lats)];
  const k=Math.cos((h[0]+h[1])/2*Math.PI/180);
  const dx=(w[1]-w[0])*k, dy=h[1]-h[0];
  const sc=Math.min(box.w/dx,box.h/dy);
  const ox=box.x+(box.w-dx*sc)/2, oy=box.y+(box.h-dy*sc)/2;
  return {
    x:lon=>ox+(lon-w[0])*k*sc,
    y:lat=>oy+(h[1]-lat)*sc,
    w:dx*sc, h:dy*sc, left:ox, top:oy
  };
}

const UI_FONT='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
let _tc=null;
function textW(str,px){
  try{
    if(!_tc) _tc=document.createElement("canvas").getContext("2d");
    if(_tc){ _tc.font=`${px}px ${UI_FONT}`; return _tc.measureText(str).width; }
  }catch(e){}
  return str.length*px*0.52;                 // only if canvas is unavailable
}

function drawMsMap(rows,date){
  const M=isMobile();
  const W=M?380:1000;
  const mapW=M?352:400, mapH=M?500:480, top=M?28:38;
  const P=msProject({x:M?(W-mapW)/2:20, y:top, w:mapW, h:mapH});
  const H=top+mapH+(M?16:22);

  // Coloured against the other cities on this day, the same ranking the table uses.
  const vs=rows.map(r=>r.rec.hi).filter(v=>v!=null);
  const lo=vs.length?Math.min(...vs):0, hi=vs.length?Math.max(...vs):1;
  const col=v=>{ const f=hi>lo?(v-lo)/(hi-lo):0.5;
    const [r,g,b]=ramp(f*100,TEMP_STOPS); return `rgb(${r},${g},${b})`; };

  const land=`<polygon class="msland" points="`
    +MS_OUTLINE.map(([ln,lt])=>`${P.x(ln).toFixed(1)},${P.y(lt).toFixed(1)}`).join(" ")+`"/>`;
  // 202 shared borders as one path rather than 202 elements: same picture, a
  // fraction of the DOM, and nothing about them needs to be addressable.
  const fills=`<path class="msfill" d="`+MS_FILL.map(r=>"M"
    +r.map(([ln,lt])=>`${P.x(ln).toFixed(1)},${P.y(lt).toFixed(1)}`).join("L")+"Z").join("")+`"/>`;
  const counties=`<path class="mscounty" d="`+MS_COUNTIES.map(l=>"M"
    +l.map(([ln,lt])=>`${P.x(ln).toFixed(1)},${P.y(lt).toFixed(1)}`).join("L")).join("")+`"/>`;
  const roads=MS_ROADS.map(r=>`<polyline class="msroad${r.i?" i":""}" points="`
    +r.pts.map(([ln,lt])=>`${P.x(ln).toFixed(1)},${P.y(lt).toFixed(1)}`).join(" ")+`"/>`).join("");

  // Four Delta cities sit within about fifty pixels of each other, so a fixed label
  // side puts names straight through neighbouring markers. Each name takes the first
  // of above / below / right / left that clears every marker and every name already
  // placed; the markers all go in as obstacles first so ordering cannot matter.
  const rr=M?13:11.5, pad=1, pr=2.6;
  const nfs=M?11.5:10.5, pfs=M?8:7, lh=M?13:12;
  const pts=rows.map(r=>({r, x:P.x(r.city.lon), y:P.y(r.city.lat)}));
  const plc=MS_PLACES.filter(c=>!(c.wide&&M)).map(c=>({c, x:P.x(c.lon), y:P.y(c.lat)}));
  const boxes=pts.map(p=>({x1:p.x-rr,y1:p.y-rr,x2:p.x+rr,y2:p.y+rr}))
    .concat(plc.map(p=>({x1:p.x-pr,y1:p.y-pr,x2:p.x+pr,y2:p.y+pr})));
  // The strip above `top` belongs to the date caption, so a label may not reach it —
  // Southaven sits within a hundredth of a degree of the state's northern edge and
  // its name landed straight on the caption before this.
  const clear=b=>b.x1>=4&&b.x2<=W-4&&b.y1>=top-1
    &&!boxes.some(o=>!(b.x2<=o.x1||b.x1>=o.x2||b.y2<=o.y1||b.y1>=o.y2));
  const place=(p,name,r,px,tl,gap0,raised)=>{
    const hw=textW(name,px)/2+3;
    const at=gap=>{
      const up={x:p.x, y:p.y-r-gap, a:"middle",
        b:{x1:p.x-hw,y1:p.y-r-gap-tl,x2:p.x+hw,y2:p.y-r-gap+tl*0.25}};
      const down={x:p.x, y:p.y+r+gap+tl, a:"middle",
        b:{x1:p.x-hw,y1:p.y+r+gap,x2:p.x+hw,y2:p.y+r+gap+tl+2}};
      const right={x:p.x+r+gap+1, y:p.y+4, a:"start",
        b:{x1:p.x+r+gap,y1:p.y-6,x2:p.x+r+gap+2+2*hw,y2:p.y+6}};
      const left={x:p.x-r-gap-1, y:p.y+4, a:"end",
        b:{x1:p.x-r-gap-2-2*hw,y1:p.y-6,x2:p.x-r-gap,y2:p.y+6}};
      // Sliding the name sideways while keeping it raised clears a neighbouring
      // marker without giving up on "above" — which is what Amory needs past Tupelo.
      const upR={x:p.x+3, y:up.y, a:"start",
        b:{x1:p.x+2,y1:up.b.y1,x2:p.x+4+2*hw,y2:up.b.y2}};
      const upL={x:p.x-3, y:up.y, a:"end",
        b:{x1:p.x-4-2*hw,y1:up.b.y1,x2:p.x-2,y2:up.b.y2}};
      return {raised:[up,upR,upL], rest:[down,downR(down),downL(down),right,left]};
    };
    const downR=d=>({x:p.x+3, y:d.y, a:"start",
      b:{x1:p.x+2,y1:d.b.y1,x2:p.x+4+2*hw,y2:d.b.y2}});
    const downL=d=>({x:p.x-3, y:d.y, a:"end",
      b:{x1:p.x-4-2*hw,y1:d.b.y1,x2:p.x-2,y2:d.b.y2}});
    // A name above its dot is the house preference, so for a place *every* raised
    // ring is tried before anything is allowed to drop below it: pushing a label a
    // few pixels further out reads better than flipping it to the other side.
    const rings=raised?[gap0,gap0+7,gap0+14]:[gap0];
    const sets=rings.map(at);
    const order=raised
      ? sets.flatMap(x=>x.raised).concat(sets.flatMap(x=>x.rest))
      : [sets[0].raised[0], ...sets[0].rest];
    const fit=order.find(c=>clear(c.b));
    if(!fit&&raised) return false;         // nowhere clear at any distance
    p.lab=fit||sets[0].rest[0];            // a station always draws, number first
    boxes.push({x1:p.lab.b.x1-pad,y1:p.lab.b.y1-pad,x2:p.lab.b.x2+pad,y2:p.lab.b.y2+pad});
    return true;
  };
  // Stations first: they carry the numbers, so they get the clear ground.
  pts.forEach(p=>place(p,p.r.city.name,rr,nfs,lh,5));
  const shown=plc.filter(p=>place(p,p.c.name,pr,pfs,M?10:9,3.5,true));

  // Shields go on last and give way to everything: they are placed against the
  // markers and the city names already down, and a route whose badge cannot find a
  // clear spot simply keeps its line and loses its label. Candidates walk the
  // interior vertices and the midpoints between them, so a long route has plenty.
  let shields="";
  MS_ROADS.forEach(r=>{
    const xy=r.pts.map(([ln,lt])=>[P.x(ln),P.y(lt)]);
    const cand=[];
    for(let i=1;i<xy.length-1;i++) cand.push(xy[i]);
    for(let i=0;i<xy.length-1;i++) for(const t of [0.5,0.25,0.75]){
      cand.push([xy[i][0]+(xy[i+1][0]-xy[i][0])*t, xy[i][1]+(xy[i+1][1]-xy[i][1])*t]);
    }
    // `sm` is for a name rather than a number — "Natchez Trace" at badge size would
    // be a banner. `dx`/`dy` nudge a route's badge off a spot that merely happens to
    // be the first clear one; they shift the candidate, so collisions still hold.
    const fs=r.sm?6:8.5, bw=r.id.length*(r.sm?3.5:4.9)+(r.sm?6:9), bh=r.sm?9:12;
    for(const [cx0,cy0] of cand){
      const cx=cx0+(r.dx||0), cy=cy0+(r.dy||0);
      const box={x1:cx-bw/2-2,y1:cy-bh/2-2,x2:cx+bw/2+2,y2:cy+bh/2+2};
      if(!clear(box)) continue;
      shields+=`<g class="msshield${r.i?" i":""}">`
        +`<rect x="${(cx-bw/2).toFixed(1)}" y="${(cy-bh/2).toFixed(1)}" `
        +`width="${bw.toFixed(1)}" height="${bh}" rx="2"/>`
        +`<text x="${cx.toFixed(1)}" y="${(cy+fs*0.35).toFixed(1)}" text-anchor="middle" `
        +`style="font-size:${fs}px">${r.id}</text></g>`;
      boxes.push(box);
      break;
    }
  });

  const places=shown.map(p=>`<g class="msplace">`
    +`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${pr}"/>`
    +`<text x="${p.lab.x.toFixed(1)}" y="${p.lab.y.toFixed(1)}" `
    +`text-anchor="${p.lab.a}" style="font-size:${pfs}px">${esc(p.c.name)}</text></g>`).join("");
  let s=land+fills+counties+roads+shields+places;
  pts.forEach(p=>{
    const h=p.r.rec.hi;
    const n=h==null?"—":String(Math.round(h));
    const f=Math.min(11.5,(2*rr-4)/(n.length*0.6));
    const sel=msSel&&msSel.name===p.r.city.name&&msSel.date===date;
    s+=`<g class="msdot${sel?" sel":""}" data-city="${esc(p.r.city.name)}" data-date="${date}" `
      +`tabindex="0" role="button" `
      +`aria-label="${esc(p.r.city.name)}: high ${n}, low `
      +`${p.r.rec.lo==null?"unknown":Math.round(p.r.rec.lo)}. Show the source breakdown">`
      +`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${rr}" `
      +`fill="${h==null?"var(--rule)":col(h)}"/>`
      +`<text x="${p.x.toFixed(1)}" y="${(p.y+f*0.35).toFixed(1)}" text-anchor="middle" `
      +`font-size="${f.toFixed(1)}" font-weight="600" `
      // Black, not a dark grey: measured across the ramp it is the only single colour
      // that clears 4.5:1 on every stop. Inline style, not fill=, because a fill
      // attribute loses to `text{fill:var(--ink-soft)}` — see CLAUDE.md.
      +`style="fill:#000;font-variant-numeric:tabular-nums">${n}</text>`
      +`<text class="msname" x="${p.lab.x.toFixed(1)}" y="${p.lab.y.toFixed(1)}" `
      +`text-anchor="${p.lab.a}" style="font-size:${nfs}px">${esc(p.r.city.name)}</text>`
      +`</g>`;
  });

  // Desktop has room beside a state this narrow, so the same day is repeated as a
  // ranking — the map answers "where", the bars answer "by how much". The low goes
  // here rather than under every marker, where it crowded the names off the map.
  if(!M){
    const bx=470, bw=430, sorted=pts.filter(p=>p.r.rec.hi!=null)
      .slice().sort((a,b)=>b.r.rec.hi-a.r.rec.hi);
    const step=Math.min(25,mapH/Math.max(1,sorted.length));
    const barLo=Math.floor(lo-2), barHi=Math.ceil(hi+1);
    const bs=v=>(v-barLo)/((barHi-barLo)||1)*(bw-190);
    s+=`<text class="panellabel" x="${bx}" y="${top-10}">`
      +`Warmest to coolest &mdash; daily high, with the overnight low</text>`
      +`<g class="msrank">`;
    sorted.forEach((p,i)=>{
      const y=top+10+i*step, sel=msSel&&msSel.name===p.r.city.name&&msSel.date===date;
      const w=Math.max(2,bs(p.r.rec.hi));
      s+=`<text x="${bx}" y="${(y+4).toFixed(1)}" `
        +`style="fill:var(--${sel?"ink":"ink-soft"})">${esc(p.r.city.name)}</text>`
        +`<rect x="${bx+110}" y="${(y-7).toFixed(1)}" width="${w.toFixed(1)}" `
        +`height="13" rx="1" fill="${col(p.r.rec.hi)}" opacity="${sel?1:.85}"/>`
        +`<text x="${(bx+118+w).toFixed(1)}" y="${(y+4).toFixed(1)}" `
        +`style="fill:var(--ink);font-variant-numeric:tabular-nums">${Math.round(p.r.rec.hi)}°`
        +`<tspan style="fill:var(--ink-soft)"> / ${p.r.rec.lo==null?"—":Math.round(p.r.rec.lo)+"°"}`
        +`</tspan></text>`;
    });
    s+=`</g>`;
  }
  s+=`<text class="panellabel" x="${P.left.toFixed(0)}" y="${top-10}">`
    +`${WDAYS[new Date(date+"T12:00:00").getDay()]} ${+date.slice(8)} `
    +`${MONTHS[+date.slice(5,7)-1]} &mdash; daily high °F</text>`;
  // Where the map ends as a fraction of the svg, so the breakdown can clear it
  // rather than landing on whichever half of the state the marker happens to be in.
  return {svg:s,W,H,right:M?1:(20+mapW)/W};
}

function drawMs(){
  $("fig").hidden=false;
  const M=isMobile(), box=$("fcsrc");
  $("key").innerHTML=""; $("stats").hidden=true;
  const rows=MS_CITIES.filter(c=>msByCity.has(c.name));
  if(!rows.length||!msDays.length){
    box.hidden=true; $("hint2").textContent=""; $("mspick").innerHTML="";
    $("chart").innerHTML=""; $("chart")._geom=null;
    $("readout").innerHTML=`<span class="stat">${msLoading?"Loading…":"Nothing to show."}</span>`;
    $("stand").innerHTML=msLoading||!msTried
      ? `Fetching every model's next ${MS_DAYS} days for the `
        +`<b>${MS_CITIES.length}</b> cities…`
      : `The model forecasts for these cities didn't load`
        +(msErr.length?` — <code>${esc(msErr.slice(0,3).join("; "))}</code>`:``)
        +`. Open-Meteo may be rate-limiting this browser; it clears on its own.`;
    return;
  }
  // The day the map is showing. Clamped rather than reset, so a short response
  // cannot leave the picker pointing past the end of the week.
  msDay=Math.max(0,Math.min(msDays.length-1,msDay));
  const day=msDays[msDay];
  $("mspick").innerHTML=msDays.map((d,i)=>{
    const t=new Date(d+"T12:00:00");
    return `<button data-msday="${i}" aria-pressed="${i===msDay}">`
      +`${WDAYS[t.getDay()]} ${+d.slice(8)}</button>`;
  }).join("");
  $("mspick").querySelectorAll("[data-msday]").forEach(b=>b.onclick=()=>{
    msDay=+b.dataset.msday; draw();
  });

  const mapRows=rows.map(c=>({city:c,rec:msByCity.get(c.name).get(day)}))
    .filter(r=>r.rec);
  const map=drawMsMap(mapRows,day);
  const svg=$("chart");
  svg.setAttribute("viewBox",`0 0 ${map.W} ${map.H}`);
  svg.innerHTML=map.svg; svg._geom=null; svg._msRight=map.right;
  svg.querySelectorAll("g.msdot").forEach(g=>{
    const open=()=>{
      const same=msSel&&msSel.name===g.dataset.city&&msSel.date===g.dataset.date;
      if(same) closeMsFly(); else openMsFly(g.dataset.city,g.dataset.date,g,true);
    };
    g.onclick=open;
    g.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); open(); } };
  });
  $("key").innerHTML=`<span>Coolest <i class="tgrad"></i> warmest, among these `
    +`cities on the day shown</span>`
    +`<span style="color:var(--ink-soft)">Counties and state line: US Census; `
    +`routes approximate</span>`;

  const deg=M?"":"°";
  const nice=t=>`${WDAYS[new Date(t+"T12:00:00").getDay()]}<span class="mon">`
    +`${+t.slice(8)} ${MONTHS[+t.slice(5,7)-1]}</span>`;
  // Shaded per column: a city's place among the other cities *that day*, which is the
  // only reading that answers "where is it hottest today". Same rule as the forecast
  // table, and the same ramp.
  const stat=msDays.map(d=>{
    const vs=rows.map(c=>msByCity.get(c.name).get(d)).filter(r=>r&&r.hi!=null).map(r=>r.hi);
    return vs.length?{min:Math.min(...vs),max:Math.max(...vs)}:null;
  });
  const shade=(v,k)=>{
    const st=stat[k]; if(!st) return "";
    const f=st.max>st.min?(v-st.min)/(st.max-st.min):0.5;
    const [r,g,b]=ramp(f*100,TEMP_STOPS);
    return `background:rgba(${r},${g},${b},.5)`;
  };
  const cell=(rec,k,name,d)=>{
    if(!rec||rec.hi==null) return `<td>&mdash;</td>`;
    const hi=Math.round(rec.hi), lo=rec.lo==null?null:Math.round(rec.lo);
    return `<td><button type="button" class="cell msbtn" style="${shade(rec.hi,k)}" `
      +`data-city="${esc(name)}" data-date="${d}" `
      +`aria-label="${esc(name)}, ${d}: high ${hi}, low ${lo==null?"unknown":lo}. `
      +`Show the model breakdown"><b>${hi}${deg}</b>`
      +`<i>${lo==null?"&mdash;":lo+deg}</i></button></td>`;
  };
  const worst=msDays.reduce((a,d)=>{
    const sp=rows.map(c=>msByCity.get(c.name).get(d)).filter(r=>r&&r.hSpread!=null)
      .reduce((x,r)=>Math.max(x,r.hSpread),0);
    return Math.max(a,sp); },0);
  // NWS reaches about seven days and not every city's first day, so the number of
  // sources behind a cell is not constant — it is reported as a range rather than
  // letting an average over thirteen pass as one over fourteen.
  let nMin=Infinity,nMax=0;
  rows.forEach(c=>msDays.forEach(d=>{
    const r=msByCity.get(c.name).get(d); if(!r||!r.n) return;
    nMin=Math.min(nMin,r.n); nMax=Math.max(nMax,r.n); }));
  if(!isFinite(nMin)) nMin=nMax;
  const srcs=nMin===nMax?`<b>${nMax}</b>`:`<b>${nMin}&ndash;${nMax}</b>`;
  const missing=MS_CITIES.filter(c=>!msByCity.has(c.name));

  box.innerHTML=`<h2>Mississippi, next ${msDays.length} days &mdash; °F</h2>`
    +`<p class="lede">Daily high with the overnight low beneath it, each one the `
    +`average of the ${srcs} forecast sources covering that city and day &mdash; `
    +`the 13 models Open-Meteo carries, plus <b>NWS</b>`
    +(msNwsDone?``:` (still loading)`)+`. Cities run north to south. Shaded by where `
    +`the city falls among the others <em>that day</em> — `
    +`<b style="color:#3B8AC4">blue</b> the coolest, `
    +`<b style="color:#C2542B">red</b> the warmest. `
    +`<b>Tap any temperature</b> for the model-by-model breakdown behind it.</p>`
    +`<div class="scroller"><table><thead><tr><th>City</th>`
    +msDays.map(d=>`<th${d===day?' class="on"':''}>${nice(d)}</th>`).join("")
    +`</tr></thead><tbody>`
    +rows.map(c=>{
        const m=msByCity.get(c.name);
        return `<tr><td>${esc(c.name)}</td>`
          +msDays.map((d,k)=>cell(m.get(d),k,c.name,d)).join("")+`</tr>`;
      }).join("")
    +`</tbody></table></div>`
    +`<p class="foot">Every city draws on the same sources, so the comparison between `
    +`two of them is like for like. On the worst day they disagree by `
    +`<b>${worst.toFixed(0)}°F</b> among themselves — the breakdown shows by how much `
    +`for any single figure. <b>NWS pairs a daytime high with the night that follows `
    +`it</b>, while the models report the minimum inside a calendar day — the morning `
    +`low, a different figure one day earlier. So NWS's night low is counted against `
    +`the next day here, where it means the same thing as theirs; that is also why the `
    +`first column's low has one fewer source behind it. `
    +`The models are ${Math.ceil(MS_CITIES.length/MS_CHUNK)} requests and NWS up to `
    +`${MS_CITIES.length*2} more, though its grid lookups are kept for a month and its `
    +`forecasts half an hour, so a second visit costs nothing.`
    +(msNwsMissing.length&&msNwsDone
      ? ` NWS didn't answer for ${msNwsMissing.map(esc).join(", ")}, which `
        +`${msNwsMissing.length===1?"is":"are"} averaged without it.`
      : ``)
    +(missing.length
      ? ` <b>${missing.length}</b> cit${missing.length===1?"y is":"ies are"} missing — `
        +`${missing.map(c=>esc(c.name)).join(", ")} — because a slice didn't answer: `
        +`<code>${esc(msErr.slice(0,2).join("; "))}</code>`
      : ``)+`</p>`;
  box.hidden=false;
  box.querySelectorAll("button.msbtn").forEach(b=>b.onclick=()=>{
    const same=msSel&&msSel.name===b.dataset.city&&msSel.date===b.dataset.date;
    if(same) closeMsFly(); else openMsFly(b.dataset.city,b.dataset.date,b);
  });
  markMsSel();

  // Short enough to stay on one line on a desktop, which is the whole point of it.
  $("stand").innerHTML=`<b>${rows.length}</b> Mississippi cities, north to south `
    +`&mdash; the next <b>${msDays.length}</b> days, averaged over ${srcs} sources `
    +`including <b>NWS</b>.`;
  $("hint2").textContent="Read down a column to find the warmest city that day, "
    +"across a row to see one city's week.";
  $("readout").innerHTML=`<span class="stat">Map: the average high. Table: high and `
    +`low. Tap either for its breakdown.</span>`;
}

// The breakdown behind one figure. Anchored to the cell and clamped inside the
// figure, the same way the day-history card is.
function openMsFly(name,date,el,beside){
  const fly=$("msfly"), m=msByCity.get(name), rec=m&&m.get(date);
  if(!fly||!rec){ closeMsFly(); return; }
  msSel={name,date};
  const per=rec.per.slice().sort((a,b)=>
    (b.hi==null?-Infinity:b.hi)-(a.hi==null?-Infinity:a.hi));
  const f=v=>v==null?"&mdash;":Math.round(v)+"°";
  const d=new Date(date+"T12:00:00");
  fly.innerHTML=`<button class="x" type="button" aria-label="Close">&times;</button>`
    +`<div class="hd"><div><h3>${esc(name)}</h3>`
    +`<p class="who">${WDAYS[d.getDay()]} ${+date.slice(8)} `
    +`${MONTHS_FULL[+date.slice(5,7)-1]}</p></div>`
    +`<div class="rank">Average of<b>${rec.n}</b>sources</div></div>`
    +`<table class="msbd"><thead><tr><th>Model</th><th>High</th><th>Low</th></tr></thead>`
    +`<tbody><tr class="avg"><td>Average</td>`
    +`<td>${rec.hi==null?"&mdash;":rec.hi.toFixed(1)+"°"}</td>`
    +`<td>${rec.lo==null?"&mdash;":rec.lo.toFixed(1)+"°"}</td></tr>`
    +per.map(x=>`<tr${x.id===fcSource?' class="active"':''}>`
      +`<td>${esc(x.label)}</td><td>${f(x.hi)}</td><td>${f(x.lo)}</td></tr>`).join("")
    +`</tbody></table>`
    +`<p class="foot">The models spread `
    +`<b>${rec.hSpread==null?"—":rec.hSpread.toFixed(0)+"°"}</b> on the high and `
    +`<b>${rec.lSpread==null?"—":rec.lSpread.toFixed(0)+"°"}</b> on the low here. `
    +(rec.n<FC_MODELS.length
      ? `The high is over the <b>${rec.n}</b> sources that reach this day, not all `
        +`${FC_MODELS.length}.`
      : `Every one of the ${rec.n} sources reaches this day.`)
    +(rec.nLo!==rec.n?` The low is over <b>${rec.nLo}</b>.`:``)+`</p>`;
  fly.hidden=false;
  fly.querySelector(".x").onclick=closeMsFly;
  const fig=$("fig"), fr=fig.getBoundingClientRect(), er=el.getBoundingClientRect();
  const w=fly.offsetWidth, h=fly.offsetHeight;
  // A table cell wants the card under it. A map marker does not: dropping it there
  // covers the map the marker is on, so it goes to whichever side has room and only
  // falls back to underneath when neither does.
  const svg=$("chart"), sr=svg.getBoundingClientRect();
  const mapEnd=sr.left-fr.left+sr.width*(svg._msRight||1);
  if(beside&&fr.width-mapEnd>w+20){
    fly.style.left=(mapEnd+16).toFixed(0)+"px";
    fly.style.top=Math.max(4,Math.min(fig.offsetHeight-h-4,
      er.top-fr.top+er.height/2-h/2)).toFixed(0)+"px";
  }else{
    fly.style.left=Math.max(8,Math.min(fr.width-w-8,
      er.left-fr.left+er.width/2-w/2)).toFixed(0)+"px";
    fly.style.top=(er.bottom-fr.top+6).toFixed(0)+"px";
  }
  markMsSel();
}
function closeMsFly(){
  msSel=null;
  const f=$("msfly"); if(f&&!f.hidden){ f.hidden=true; f.innerHTML=""; }
  markMsSel();
}
// The same figure exists as a table cell and as a map marker, so both follow the
// selection; the rank bars are redrawn with it, which is why they are not touched here.
function markMsSel(){
  const hit=el=>!!msSel&&el.dataset.city===msSel.name&&el.dataset.date===msSel.date;
  $("fcsrc").querySelectorAll("button.msbtn").forEach(b=>b.classList.toggle("sel",hit(b)));
  $("chart").querySelectorAll("g.msdot").forEach(g=>g.classList.toggle("sel",hit(g)));
}

function drawVer(){
  const svg=$("chart"); $("fig").hidden=false;
  const M=isMobile();
  const solo=cities.length===1?cities[0]:null;
  const nice=t=>`${MONTHS[+t.slice(5,7)-1]} ${+t.slice(8)}`;
  const say=t=>{ svg.setAttribute("viewBox",`0 0 ${M?380:1000} 120`);
    svg.innerHTML=`<text x="${M?12:20}" y="60" fill="var(--ink-soft)">${t}</text>`;
    svg._geom=null; $("key").innerHTML=""; $("fcsrc").hidden=true;
    $("stats").hidden=true; $("hint2").textContent="";
    $("readout").innerHTML=`<span class="stat">How far off each model ran, by lead time.</span>`; };
  if(!solo){ say("Drop to one city to score the models.");
    $("stand").innerHTML=`Verification scores one city at a time.`; return; }
  if(!IS_CURRENT){ say(`Verification reads the last ${VER_DAYS} days.`);
    $("stand").innerHTML=`The scores cover the ${VER_DAYS} days up to today — `
      +`pick <b>${CUR_YEAR}</b> to see them.`; return; }

  const sc=verScore(solo);
  if(!sc){
    say(solo.verErr?"The forecast archive didn't load."
        :(solo.ver?"Nothing to score yet.":"Reading what the models said…"));
    $("stand").innerHTML=solo.verErr
      ? `Open-Meteo's previous-runs archive didn't answer — <code>${esc(solo.verErr)}</code>. `
        +`Nothing is scored rather than scored against a guess.`
      : (solo.ver
         ? `No day in the window has both an archived forecast and an observation to `
           +`check it against. ERA5 runs about five days behind, so the most recent days `
           +`can't be marked yet.`
         : `Fetching what every model published one to ${VER_LEADS} days before each `
           +`day arrived, for <b>${esc(solo.label)}</b>…`);
    return; }

  const W=M?380:1000, L=M?38:56, R=M?12:18, T=M?28:32, BH=M?200:262;
  const iw=W-L-R, XLAB=T+BH+20, H=XLAB+(M?16:20);
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const X=i=>L+(VER_LEADS<2?iw/2:i*iw/(VER_LEADS-1));

  // A mean over a shrinking set falls when a short-coverage model drops out, which
  // on this chart reads as the forecasts getting better with less warning. So the
  // band and the average cover only the models that publish every lead time; the
  // table still lists all of them. Same reasoning as the Forecast tab's Sources row.
  const full=sc.rows.filter(r=>r.leads.every(Boolean));
  const plot=full.length>=2?full:sc.rows;
  let top=0;
  plot.forEach(r=>r.leads.forEach(v=>{ if(v) top=Math.max(top,v.mae); }));
  // Error is a distance, so the axis starts at zero — a floating baseline would make
  // a one-degree gap between models look like a chasm.
  const y1=Math.max(2,Math.ceil(top+0.5)), Y=v=>T+BH-v/(y1||1)*BH;

  let s="";
  const step=y1>8?2:1;
  for(let v=0;v<=y1;v+=step)
    s+=`<line class="gridline" x1="${L}" y1="${Y(v).toFixed(1)}" x2="${W-R}" y2="${Y(v).toFixed(1)}"/>`
      +`<text x="${L-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end">${v}°</text>`;

  const band=[];
  for(let k=0;k<VER_LEADS;k++){
    const vs=plot.map(r=>r.leads[k]).filter(Boolean).map(v=>v.mae);
    band.push(vs.length?{k,min:Math.min(...vs),max:Math.max(...vs),
                         avg:vs.reduce((a,b)=>a+b,0)/vs.length}:null);
  }
  const bb=band.filter(Boolean);
  if(bb.length>1){
    const hi=bb.map(b=>`${X(b.k).toFixed(1)},${Y(b.max).toFixed(1)}`);
    const lo=bb.map(b=>`${X(b.k).toFixed(1)},${Y(b.min).toFixed(1)}`);
    s+=`<polygon class="normalband" points="${hi.join(" ")} ${lo.slice().reverse().join(" ")}"/>`;
  }
  const line=(vals,cls)=>{
    const pts=vals.map((v,k)=>v==null?null:`${X(k).toFixed(1)},${Y(v).toFixed(1)}`).filter(Boolean);
    return pts.length>1?`<polyline class="${cls}" points="${pts.join(" ")}"/>`:"";
  };
  const best=plot[0];
  const pick=plot.find(r=>r.id===fcSource);
  plot.forEach(r=>{ if(r!==best&&r!==pick)
    s+=line(r.leads.map(v=>v&&v.mae),"fcthin"); });
  // Your pick is only worth its own line when it is not already the best one.
  if(pick&&pick!==best) s+=line(pick.leads.map(v=>v&&v.mae),"fcnws");
  s+=line(best.leads.map(v=>v&&v.mae),"fcpick3");
  s+=line(band.map(b=>b&&b.avg),"fcpick2");

  for(let k=0;k<VER_LEADS;k++)
    s+=`<line class="monthrule" x1="${X(k).toFixed(1)}" y1="${T}" x2="${X(k).toFixed(1)}" y2="${T+BH}"/>`
      +`<text x="${X(k).toFixed(1)}" y="${XLAB}" text-anchor="middle">${k+1}</text>`;
  {
    const rr=M?10:11.5, sp=VER_LEADS<2?iw:iw/(VER_LEADS-1);
    if(sp>=2*rr) bb.forEach(b=>{
      const n=b.avg.toFixed(1), f=Math.min(M?9.5:10.5,(2*rr-3)/(n.length*0.6));
      s+=`<circle cx="${X(b.k).toFixed(1)}" cy="${Y(b.avg).toFixed(1)}" r="${rr}" fill="var(--paper)" `
        +`stroke="var(--hot)" stroke-width="1.4"/>`
        +`<text class="dnode" x="${X(b.k).toFixed(1)}" y="${(Y(b.avg)+f*0.35).toFixed(1)}" `
        +`text-anchor="middle" style="fill:var(--hot)" font-size="${f.toFixed(1)}">${n}</text>`;
    });
  }
  s+=`<text class="panellabel" x="${L}" y="${T-12}">`
    +`Average miss on the daily high, °F — by days of warning</text>`;
  svg.innerHTML=s; svg._geom=null;

  const pickName=(FC_MODELS.find(m=>m.id===fcSource)||{}).label||fcSource;
  const d1=best.leads[0], worst=plot[plot.length-1];
  const partial=sc.rows.length-plot.length;
  $("key").innerHTML=`<span><i style="background:var(--cold)"></i>${esc(best.label)}, closest</span>`
    +`<span><i style="background:var(--hot)"></i>Average of the ${plot.length} plotted</span>`
    +(pick&&pick!==best?`<span><i style="background:var(--today)"></i>${esc(pickName)}, your pick</span>`:``)
    +`<span><i style="background:var(--ink-soft)"></i>Every other model</span>`
    +`<span><i class="swatch"></i>Closest to furthest</span>`;
  $("stand").innerHTML=`<b>${esc(solo.label)}</b> — every model's published high against `
    +`what the archive later recorded, over <b>${sc.days}</b> measured days `
    +`(${nice(sc.from)}&ndash;${nice(sc.to)}). <b>${esc(best.label)}</b> is closest, off by `
    +`<b>${best.all.mae.toFixed(1)}°F</b> on average`
    +(d1?` and <b>${d1.mae.toFixed(1)}°F</b> a day ahead`:``)
    +`; <b>${esc(worst.label)}</b> is furthest, at <b>${worst.all.mae.toFixed(1)}°F</b>.`
    +(partial>0?` The chart compares the <b>${plot.length}</b> models that publish all `
      +`${VER_LEADS} lead times; the table below adds <b>${partial}</b> that `
      +`publish${partial>1?"":"es"} fewer.`:``);
  $("hint2").textContent="Read across a row to see a model's forecast decay with lead time, "
    +"down a column to see who was closest at that range.";
  $("stats").hidden=true;
  $("readout").innerHTML=`<span class="stat">Average miss in °F, and whether the model `
    +`ran hot or cold.</span>`;
  renderVerTable(sc,solo);
}

function renderVerTable(sc,solo){
  const box=$("fcsrc"), M=isMobile();
  const deg=M?"":"°";
  // Shaded per column, like the forecast table: a cell's place is its rank among the
  // models at that lead, not against the whole table. Error is a distance, so here
  // the cool end of the ramp is the accurate end.
  const col=[];
  for(let k=0;k<VER_LEADS;k++){
    const vs=sc.rows.map(r=>r.leads[k]).filter(Boolean).map(v=>v.mae);
    col.push(vs.length?{min:Math.min(...vs),max:Math.max(...vs)}:null);
  }
  const av=sc.rows.map(r=>r.all.mae);
  const allc={min:Math.min(...av),max:Math.max(...av)};
  const shade=(v,st)=>{
    if(!st) return "";
    const f=st.max>st.min?(v-st.min)/(st.max-st.min):0.5;
    const [r,g,b]=ramp(f*100,TEMP_STOPS);
    return `background:rgba(${r},${g},${b},.5)`;
  };
  const sign=v=>(v>=0.05?"+":v<=-0.05?"−":"±")+Math.abs(v).toFixed(1);
  const cell=(v,st)=>v
    ? `<td><span class="cell" style="${shade(v.mae,st)}"><b>${v.mae.toFixed(1)}${deg}</b>`
      +`<i>${sign(v.bias)}</i></span></td>`
    : `<td>&mdash;</td>`;
  const short=sc.rows.filter(r=>r.leads.some(v=>!v)).length;
  box.innerHTML=`<h2>How close each model got &mdash; °F</h2>`
    +`<p class="lede">The big number is the model's <b>average miss</b> on the daily high `
    +`at that many days of warning; beneath it, whether it ran <b>hot</b> (+) or `
    +`<b>cold</b> (−) on average. Lower is better, and each column is shaded against `
    +`the other models at that range — <b style="color:#3B8AC4">blue</b> the closest, `
    +`<b style="color:#C2542B">red</b> the furthest.</p>`
    +`<div class="scroller"><table><thead><tr><th>Model</th>`
    +Array.from({length:VER_LEADS},(_,k)=>
       `<th>${k+1}<span class="mon">day${k?"s":""}</span></th>`).join("")
    +`<th>All<span class="mon">pooled</span></th></tr></thead><tbody>`
    +sc.rows.map(r=>`<tr${r.id===fcSource?' class="active"':''}>`
      +`<td>${esc(r.label)}<span class="who">${esc(r.who||"")}</span></td>`
      +r.leads.map((v,k)=>cell(v,col[k])).join("")
      +cell(r.all,allc)+`</tr>`).join("")
    +`<tr class="spread"><td>Days scored<span class="who">with an observation</span></td>`
    +Array.from({length:VER_LEADS},(_,k)=>{
       const ns=sc.rows.map(r=>r.leads[k]).filter(Boolean).map(v=>v.n);
       return `<td>${ns.length?Math.max(...ns):"—"}</td>`;}).join("")
    +`<td>${sc.days}</td></tr>`
    +`<tr class="spread"><td>Models<span class="who">publishing that lead</span></td>`
    +Array.from({length:VER_LEADS},(_,k)=>
       `<td>${sc.rows.filter(r=>r.leads[k]).length}</td>`).join("")
    +`<td>${sc.rows.length}</td></tr>`
    +`</tbody></table></div>`
    +`<p class="foot">Scored against ERA5's own reading for each day — the same `
    +`&ldquo;observed&rdquo; numbers the Timeline draws, which is a reanalysis on a `
    +`~31 km cell rather than a thermometer in ${esc(solo.label)}. It is the best `
    +`consistent record available here, but it means a model tuned to the same `
    +`reanalysis has a small edge. <b>NWS is not in this table</b>: nobody publishes an `
    +`archive of what its forecast said last week, so it cannot be scored the same way. `
    +`The window is the last ${VER_DAYS} days, less the few most recent that the archive `
    +`has not reached yet`
    +(short?`; ${short} model${short>1?"s":""} publish${short>1?"":"es"} fewer than `
      +`${VER_LEADS} lead times, so the pooled column covers fewer forecasts for `
      +`${short>1?"them":"it"}`:``)
    +`. One request, cached for half a day.</p>`;
  box.hidden=false;
}

function drawHot(){
  const svg=$("chart"); $("fig").hidden=false;
  const M=isMobile();
  const solo=cities.length===1?cities[0]:null;
  const counts=cities.map(c=>({c,months:hotByMonth(c)}));
  const norm=solo?hotNormal(solo):null;
  const ext=solo?hotExtremes(solo):null;
  const rec=(ext&&ext.hot.total>0)?ext:null;   // nothing to draw if no year ever reached it
  // A coldest year of zero every month draws nothing, so it is never announced.
  const coldDrawn=!!(rec&&rec.cold.months.some(v=>v>0));

  const W=M?380:1000, L=M?30:44, R=M?8:12, T=M?26:30, BH=M?230:300;
  const iw=W-L-R, XLAB=T+BH+22, H=XLAB+(M?16:20);
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);

  let ymax=1;
  counts.forEach(s=>s.months.forEach(v=>{ if(v) ymax=Math.max(ymax,v.days); }));
  if(norm) norm.forEach(v=>ymax=Math.max(ymax,v));
  if(rec) rec.hot.months.forEach(v=>ymax=Math.max(ymax,v));
  ymax=Math.max(4,Math.ceil(ymax/2)*2);
  const Y=v=>T+BH-(v/ymax)*BH;
  const slot=iw/12;

  let s="";
  const ticks=ymax<=8?ymax/2:4;
  for(let k=0;k<=ticks;k++){
    const v=Math.round(ymax*k/ticks);
    s+=`<line class="gridline" x1="${L}" y1="${Y(v).toFixed(1)}" x2="${W-R}" y2="${Y(v).toFixed(1)}"/>`
      +`<text x="${L-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end">${v}</text>`;
  }
  s+=`<text class="panellabel" x="${L}" y="${T-10}">Days reaching ${thresh}°F, by month — ${year}</text>`;

  const n=cities.length, gap=slot*0.18, bw=(slot-gap*2)/n;
  MONTHS.forEach((mn,m)=>{
    const x0=L+slot*m+gap, wSlot=slot-gap*2;
    counts.forEach((sr,ci)=>{
      const v=sr.months[m];
      if(!v) return;                                   // month not reached yet
      const x=x0+bw*ci;
      if(v.days>0){
        const h=Math.max(1.5,T+BH-Y(v.days));
        s+=`<rect x="${x.toFixed(1)}" y="${(T+BH-h).toFixed(1)}" width="${bw.toFixed(1)}" `
          +`height="${h.toFixed(1)}" fill="${n===1?"var(--hot)":sr.c.color}"/>`
          +`<text x="${(x+bw/2).toFixed(1)}" y="${(T+BH-h-5).toFixed(1)}" text-anchor="middle" `
          +`style="fill:var(--ink)" font-size="${M?10:11}">${v.days}</text>`;
      }
      // A month still in progress is marked, so a low count isn't misread as mild.
      if(v.obs<daysInMonth(m))
        s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(T+BH+11).toFixed(1)}" text-anchor="middle" `
          +`style="fill:var(--ink-soft)" font-size="9">${v.obs}d</text>`;
    });
    // Outlines go over the bars, not behind: a record year BELOW the viewed year is
    // the interesting case, and behind a solid bar it would be invisible. They carry
    // no fill, so the bar still reads as the subject.
    if(rec) [[rec.hot.months[m],"var(--hot)"],[rec.cold.months[m],"var(--cold)"]].forEach(([v,col])=>{
      if(!v) return;
      const h=T+BH-Y(v);
      s+=`<rect x="${x0.toFixed(1)}" y="${(T+BH-h).toFixed(1)}" width="${wSlot.toFixed(1)}" `
        +`height="${h.toFixed(1)}" fill="none" stroke="${col}" stroke-width="1.1" `
        +`stroke-dasharray="3 2" opacity=".85"/>`;
    });
    if(norm&&norm[m]>0.05){
      const y=Y(norm[m]);
      s+=`<line x1="${x0.toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x0+slot-gap*2).toFixed(1)}" `
        +`y2="${y.toFixed(1)}" stroke="var(--normal-edge)" stroke-width="1.4" stroke-dasharray="5 3"/>`;
    }
    s+=`<text x="${(L+slot*(m+0.5)).toFixed(1)}" y="${XLAB}" text-anchor="middle">${mn}</text>`;
  });
  svg.innerHTML=s;
  svg._geom=null;

  $("key").innerHTML=(n===1
      ? `<span><i style="background:var(--hot)"></i>Days at or above ${thresh}°F</span>`
      : cities.map(c=>`<span><i style="background:${c.color}"></i>${esc(c.label)}</span>`).join(""))
    +(norm?`<span><i class="dashed"></i>Typical for the month, ${CLIM_FROM}&ndash;${CLIM_TO}</span>`:``)
    // Name a year only when one year actually holds the mark, and don't advertise a
    // coldest-year outline that is zero every month and therefore never drawn.
    +(rec?`<span><i class="dashed" style="border-color:var(--hot)"></i>`
        +(rec.hot.ties>1?`Hottest, ${rec.hot.total} days (${rec.hot.ties} years tied)`
                        :`Hottest year, ${rec.hot.year} (${rec.hot.total})`)+`</span>`
      +(coldDrawn
        ?`<span><i class="dashed" style="border-color:var(--cold)"></i>`
          +(rec.cold.ties>1?`Fewest, ${rec.cold.total} days (${rec.cold.ties} years tied)`
                           :`Coldest year, ${rec.cold.year} (${rec.cold.total})`)+`</span>`
        :``):``);

  const total=counts.map(sr=>({label:sr.c.label,
    n:sr.months.reduce((a,v)=>a+(v?v.days:0),0)}));
  if(solo){
    const nt=norm?norm.reduce((a,b)=>a+b,0):null;
    const worst=solo&&(()=>{ let bm=-1,bv=0;
      counts[0].months.forEach((v,m)=>{ if(v&&v.days>bv){bv=v.days;bm=m;} }); return {m:bm,v:bv}; })();
    $("stand").innerHTML=`<b>${esc(solo.label)}</b> — <b>${total[0].n}</b> day${total[0].n===1?"":"s"} `
      +`reached <b>${thresh}°F</b> in ${year}`
      +(worst.m>=0?`, most of them in <b>${MONTHS_FULL[worst.m]}</b> (${worst.v}).`:` so far.`)
      +(nt!=null?` A typical year at this location sees <b>${nt.toFixed(1)}</b> such days, `
        +`averaged over ${CLIM_FROM}&ndash;${CLIM_TO}.`:``)
      +(ext?` Across <b>${ext.years}</b> years of archive, `
        +(ext.hot.ties>1?`as many as <b>${ext.hot.total}</b>, most recently in <b>${ext.hot.year}</b>`
                        :`the most was <b>${ext.hot.total}</b> in <b>${ext.hot.year}</b>`)
        +` and `
        +(ext.cold.ties>1?`as few as <b>${ext.cold.total}</b>, in <b>${ext.cold.ties}</b> separate years.`
                         :`the fewest <b>${ext.cold.total}</b> in <b>${ext.cold.year}</b>.`)
        :``)
      +(IS_CURRENT?` Forecast days are excluded — observations only.`:``);
  }else{
    $("stand").innerHTML=`Days reaching <b>${thresh}°F</b> in ${year}: `
      +total.sort((a,b)=>b.n-a.n).map(t=>`<b>${esc(t.label)}</b> ${t.n}`).join(", ")+`.`;
  }
  $("hint2").textContent="Small grey figures mark months with partial data. "
    +`Dashed rules show the ${CLIM_FROM}\u2013${CLIM_TO} average for that month`
    +(rec?`; the outlines are the ${coldDrawn?"hottest and coldest years":"hottest year"} `
      +`in the ${HIST_FROM}\u2013${HIST_TO} archive.`:`.`);
  $("stats").hidden=true;
  $("readout").innerHTML=`<span class="stat">Counting daily highs at or above `
    +`<b>${thresh}°F</b>, observed days only.</span>`;
}
const daysInMonth=m=>[31,(year%4===0&&year%100!==0)||year%400===0?29:28,31,30,31,30,31,31,30,31,30,31][m];


// Label only turning points, taken strongest-first and rejected if they'd sit too
// close to one already placed. Density then stays constant at any zoom level.
function pickLabels(arr,f,isMax,X,minGap,maxN){
  const val=i=>{const r=arr[i]; if(!r) return null; const v=f(r); return v==null?null:v;};
  const cand=[];
  for(let i=0;i<arr.length;i++){
    const v=val(i); if(v==null) continue;
    const p=i>0?val(i-1):null, n=i<arr.length-1?val(i+1):null;
    const turn=(p==null||(isMax?v>=p:v<=p))&&(n==null||(isMax?v>=n:v<=n));
    if(turn) cand.push({i,v});
  }
  cand.sort((a,b)=>isMax?b.v-a.v:a.v-b.v);
  const out=[];
  for(const c of cand){
    if(out.length>=maxN) break;
    if(out.every(o=>Math.abs(X(o.i)-X(c.i))>=minGap)) out.push(c);
  }
  return out;
}

// Renders a period into the readout. select=false fills it in without claiming a
// selection, which is how today's numbers appear on first load.
function renderReadout(i,select){
  const svg=$("chart"), read=$("readout"), g=svg._geom;
  if(!g||!g.B||!g.B[i]) return;
  const b=g.B[i], solo=cities.length===1?cities[0]:null;
  if(select){
    selDate=b.first;
    const hr=svg.querySelector("#hr");
    if(hr){hr.setAttribute("x1",g.X(i).toFixed(1)); hr.setAttribute("x2",g.X(i).toFixed(1)); hr.style.display="";}
  }
  const rec=(solo&&gran==="day")?solo.byDate.get(b.first):null;
  const cond=(rec&&rec.wc!=null)?WMO_TEXT[rec.wc]:null;
  let html=`<div class="line"><span class="date">${b.long}</span>`
    +(cond?`<span class="span">${cond}</span>`:``)
    +(b.allFc?`<span class="tag">forecast</span>`:b.anyFc?`<span class="tag">part forecast</span>`:``)
    +((solo&&g.A.get(solo)[i]&&g.A.get(solo)[i].est&&!b.allFc)
        ?`<span class="tag">estimate</span>`:``)
    +(!select&&!b.anyFc?`<span class="tag">today</span>`:``)
    +(gran==="day"?``:`<span class="span">${b.idxs.length} days</span>`)+`</div>`;
  if(solo){
    const r=g.A.get(solo)[i]; if(!r){read.innerHTML=html; return;}
    const n=solo.clim?aggClim(solo.clim,b):null;
    html+=`<div class="line"><span class="stat max">high <b>${r.hi.toFixed(gran==="day"?0:1)}°</b></span>`
      +`<span class="stat min">low <b>${r.lo.toFixed(gran==="day"?0:1)}°</b></span>`
      +`<span class="stat">mean <b>${r.mean.toFixed(1)}°</b></span>`
      +(n?`<span class="stat">vs normal <b>${r.mean>=(n.hi+n.lo)/2?"+":"−"}`
          +`${Math.abs(r.mean-(n.hi+n.lo)/2).toFixed(1)}°</b></span>`:``)
      +`<span class="stat wet">rain <b>${r.rain==null?"—":r.rain.toFixed(2)+'"'}</b></span>`
      +(r.pop!=null?`<span class="stat wet">chance <b>${Math.round(r.pop)}%</b></span>`:``)
      +(r.uv!=null?`<span class="stat" style="color:var(--uv)">UV `
          +`<b style="color:var(--uv)">${r.uv.toFixed(1)}</b></span>`:``)
      +(soilOn&&r.soilPct!=null?`<span class="stat dirt">soil <b>${Math.round(r.soilPct)}th</b> `
          +`<span style="opacity:.75">${wetWord(r.soilPct)}</span></span>`:``)
      +(solarOn&&r.solar!=null?`<span class="stat" style="color:var(--solar)">solar `
          +`<b style="color:var(--solar)">${r.solar.toFixed(1)}</b> kWh/m²/day</span>`:``)
      +(hvacOn&&r.hvac?`<span class="stat" style="color:var(--indoor)">indoor `
          +`<b style="color:var(--indoor)">${r.hvac.indoor==null?"—":r.hvac.indoor.toFixed(1)+"°"}</b></span>`
        +`<span class="stat" style="color:var(--cold)">cool `
          +`<b style="color:var(--cold)">${(r.hvac.cool/60).toFixed(1)}h</b></span>`
        +((r.hvac.heat+r.hvac.aux)?`<span class="stat" style="color:var(--hot)">heat `
          +`<b style="color:var(--hot)">${((r.hvac.heat+r.hvac.aux)/60).toFixed(1)}h</b></span>`:``)
        // Provenance, not suppression: the figure still shows, flagged as a floor.
        +(r.hvac.partial?`<span class="stat" style="opacity:.7">part day</span>`:``):``)
      +`</div>`;
  }else{
    cities.forEach(c=>{
      const r=g.A.get(c)[i]; if(!r) return;
      html+=`<div class="line"><span class="who"><i style="display:inline-block;width:9px;height:9px;`
        +`border-radius:50%;background:${c.color};margin-right:7px"></i>${esc(c.label)}</span>`
        +`<span class="stat max">high <b>${r.hi.toFixed(gran==="day"?0:1)}°</b></span>`
        +`<span class="stat min">low <b>${r.lo.toFixed(gran==="day"?0:1)}°</b></span>`
        +`<span class="stat wet">rain to date <b>${(r.cum||0).toFixed(2)}"</b></span></div>`;
    });
  }
  read.innerHTML=html;
}

/* ---------- day history fly-out ----------
   Every number here comes from histRaw, the HIST_FROM-HIST_TO archive response,
   fetched on the first tap and kept for the session. Nothing is shown that wasn't
   actually pulled — if that response never arrived the card says so.
   Summary stats leave the viewed year out, the same rule the normals and the
   soil percentile follow, so a year is never ranked against itself. */
function dayHistory(city,dateISO){
  const d=city&&city.histRaw&&city.histRaw.daily;
  if(!d||!d.time) return null;
  const key=dateISO.slice(5), out=[];
  d.time.forEach((t,i)=>{
    if(t.slice(5)!==key) return;                   // 29 Feb simply finds fewer years
    const hi=d.temperature_2m_max[i], lo=d.temperature_2m_min[i];
    if(hi==null||lo==null) return;
    out.push({year:+t.slice(0,4),hi,lo});
  });
  return out.length?out:null;
}

// One bar per historical year, low to high, then a gap and the viewed year's own
// bar at the right end — solid when the day is observed, dashed and washed out while
// it is still a forecast, the same signal the main chart uses. This year's high and
// low also run across as dashed rules so every bar reads against them.
function flyChart(rows,now,W,H){
  // the viewed year's bar is the widest thing drawn, so it needs the right margin
  const L=26,R=now?12:4,T=8,BM=16, iw=W-L-R, ih=H-T-BM;
  let lo=Infinity,hi=-Infinity;
  rows.forEach(r=>{lo=Math.min(lo,r.lo);hi=Math.max(hi,r.hi);});
  if(now){lo=Math.min(lo,now.lo);hi=Math.max(hi,now.hi);}
  if(!isFinite(lo)) return "";
  const pad=Math.max(2,(hi-lo)*0.10), y0=lo-pad, y1=hi+pad;
  const Y=v=>T+ih-(v-y0)/(y1-y0)*ih;
  const slots=rows.length+(now?2:0);            // one slot stays empty, as the gap
  const X=i=>L+(slots<2?iw/2:i*iw/(slots-1));
  const sp=slots<2?iw:iw/(slots-1);
  const bw=Math.max(1.4,Math.min(7,sp*0.55));
  // Dots must clear their neighbours, so they shrink with the spacing. Across the
  // full record they end up small and the bar itself carries the range.
  const bar=(x,r,w,fill,extra,dotR)=>{
    const dot=dotR||Math.max(0.9,Math.min(2.6,Math.min(w*0.34,sp*0.40)));
    return `<rect x="${(x-w/2).toFixed(1)}" y="${Y(r.hi).toFixed(1)}" width="${w.toFixed(1)}" `
      +`height="${Math.max(1,Y(r.lo)-Y(r.hi)).toFixed(1)}" rx="${(w/2).toFixed(1)}" `
      +`fill="${fill}"${extra||""}/>`
      +`<circle cx="${x.toFixed(1)}" cy="${Y(r.hi).toFixed(1)}" r="${dot.toFixed(1)}" fill="var(--hot)"/>`
      +`<circle cx="${x.toFixed(1)}" cy="${Y(r.lo).toFixed(1)}" r="${dot.toFixed(1)}" fill="var(--cold)"/>`;
  };
  let s="";
  [hi,lo].forEach(v=>s+=`<text x="${L-5}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end" `
    +`font-size="10">${Math.round(v)}°</text>`);
  if(now) [[now.hi,"var(--hot)"],[now.lo,"var(--cold)"]].forEach(([v,c])=>
    s+=`<line x1="${L}" y1="${Y(v).toFixed(1)}" x2="${W-R}" y2="${Y(v).toFixed(1)}" `
      +`stroke="${c}" stroke-width="1" stroke-dasharray="3 3" opacity=".75"/>`);
  rows.forEach((r,i)=>s+=bar(X(i),r,bw,"rgba(190,214,220,.26)"));
  const ystep=rows.length>40?10:5, GAP=22, kept=[];
  const rlim=now?X(slots-1)-GAP:Infinity;      // keep clear of the current-year label
  rows.forEach((r,i)=>{
    const end=(i===0||i===rows.length-1);
    if(!end&&r.year%ystep) return;
    if(X(i)>rlim) return;
    if(!kept.length||X(i)-X(kept[kept.length-1])>=GAP) kept.push(i);
    else if(end) kept[kept.length-1]=i;         // an end label outranks a decade tick
  });
  kept.forEach(i=>s+=`<text x="${X(i).toFixed(1)}" y="${H-3}" text-anchor="middle" `
    +`font-size="10">&rsquo;${String(rows[i].year).slice(2)}</text>`);
  if(now){
    const x=X(slots-1);
    if(rows.length){
      const gx=(X(rows.length-1)+x)/2;
      s+=`<line x1="${gx.toFixed(1)}" y1="${T}" x2="${gx.toFixed(1)}" y2="${(T+ih).toFixed(1)}" `
        +`stroke="var(--rule)" stroke-width="1"/>`;
    }
    const nw=Math.max(4,bw*1.6);
    s+=bar(x,now,nw,"var(--ink)",now.fc
      ? ` fill-opacity=".3" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="3 2"`
      : ``,Math.min(2.6,Math.max(1.3,nw*0.4)))
      +`<text x="${x.toFixed(1)}" y="${H-3}" text-anchor="middle" font-size="10" `
      +`style="fill:var(--ink)">&rsquo;${String(now.year).slice(2)}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily high and low by year">${s}</svg>`;
}

let flyAt=null;                 // {i,anchorX} while a card is open, else null
function closeFly(){ flyAt=null; const f=$("flyout"); if(f&&!f.hidden){ f.hidden=true; f.innerHTML=""; } }

// Opens only where it can say something true: one city (climRaw is fetched for a
// lone city) and day aggregation (a week has no single date to look up).
function openFly(i,anchorX){
  const fly=$("flyout"), svg=$("chart"), g=svg._geom;
  const solo=cities.length===1?cities[0]:null;
  if(!fly||!g||!g.B||!g.B[i]||!solo||gran!=="day"){ closeFly(); return; }
  const date=g.B[i].first, rec=solo.byDate.get(date);
  flyAt={i,anchorX};
  maybeLoadHist(solo);            // fires before the render, never after — see CLAUDE.md
  const rows=dayHistory(solo,date);
  const hist=rows?rows.filter(r=>r.year!==year):[];
  const n=hist.length;
  // Ranked on the daily high, against exactly the years the averages below use.
  const warmer=(rec&&n)?hist.filter(r=>r.hi<rec.hi).length:null;
  const pct=warmer==null?null:Math.round(100*warmer/n);

  let html=`<button class="x" type="button" aria-label="Close">&times;</button>`
    +`<div class="hd"><div>`
    +`<h3>${+date.slice(8)} ${MONTHS_FULL[+date.slice(5,7)-1]}</h3>`
    +`<p class="who">${esc(solo.label)}</p></div>`
    +(pct==null?``:`<div class="rank">Higher than<b>${pct}%</b>of years</div>`)
    +`</div>`;

  if(rec) html+=`<p class="now">${year} &middot; <span class="stat max">high <b>${Math.round(rec.hi)}°</b></span>`
    +` <span class="stat min">low <b>${Math.round(rec.lo)}°</b></span>`
    +(rec.fc?` <span class="tag">forecast</span>`:``)+`</p>`;

  if(!rows){
    html+=`<p class="foot">`+(solo.histLoading
      ? `Reading the ${HIST_FROM}&ndash;${HIST_TO} archive&hellip;`
      : `The ${HIST_FROM}&ndash;${HIST_TO} archive for this city didn't load, so there's `
        +`no history for this date to show.`
        +(solo.histErr?` <code>${esc(solo.histErr)}</code>`:``))+`</p>`;
  }else{
    html+=flyChart(hist,rec?{year,hi:rec.hi,lo:rec.lo,fc:!!rec.fc}:null,312,120);
    if(n){
      const avgHi=hist.reduce((a,r)=>a+r.hi,0)/n, avgLo=hist.reduce((a,r)=>a+r.lo,0)/n;
      const warm=hist.reduce((a,r)=>r.hi>a.hi?r:a), cool=hist.reduce((a,r)=>r.lo<a.lo?r:a);
      html+=`<p class="foot">Across <b>${n}</b> year${n===1?"":"s"} on this date `
        +`(${hist[0].year}&ndash;${hist[n-1].year}, this year excluded), the high `
        +`averaged <b>${avgHi.toFixed(1)}°</b> and the low <b>${avgLo.toFixed(1)}°</b>. `
        +`Warmest <b>${Math.round(warm.hi)}°</b> in ${warm.year}, coldest night `
        +`<b>${Math.round(cool.lo)}°</b> in ${cool.year}.</p>`;
    }else{
      html+=`<p class="foot">The archive holds no other year on this date to compare against.</p>`;
    }
    // Never let a partial record pass as the whole thing.
    if(solo.histErr) html+=`<p class="foot">Part of the record is missing, so the years `
      +`above are what loaded: <code>${esc(solo.histErr)}</code></p>`;
  }
  fly.innerHTML=html;
  fly.hidden=false;
  fly.querySelector(".x").onclick=closeFly;

  // Anchor near the tap, clamped inside the figure.
  const fig=$("fig"), fr=fig.getBoundingClientRect();
  const left=Math.max(8,Math.min(fr.width-fly.offsetWidth-8,anchorX-fr.left-fly.offsetWidth/2));
  fly.style.left=left.toFixed(0)+"px";
  fly.style.top=Math.max(4,svg.getBoundingClientRect().top-fr.top+8).toFixed(0)+"px";
}

/* ---------- weather symbols ----------
   The WMO code the daily feeds return alongside the temperatures, grouped into
   eight drawable conditions. A day the feed gives no code for draws nothing —
   an absent code is not a clear sky.
   One seam worth knowing: where NWS wins the forecast it overwrites the high,
   low and rain chance but publishes no WMO code, so those days keep Open-Meteo's
   condition. On a marginal day the glyph and the numbers under it can disagree. */
const WMO_TEXT={0:"Clear",1:"Mainly clear",2:"Partly cloudy",3:"Overcast",
  45:"Fog",48:"Freezing fog",51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",
  56:"Freezing drizzle",57:"Freezing drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",
  66:"Freezing rain",67:"Freezing rain",71:"Light snow",73:"Snow",75:"Heavy snow",
  77:"Snow grains",80:"Light showers",81:"Showers",82:"Violent showers",
  85:"Snow showers",86:"Snow showers",95:"Thunderstorm",96:"Thunderstorm, hail",
  99:"Thunderstorm, hail"};
const WMO_GLYPH=(()=>{
  const m=new Map(), add=(codes,g)=>codes.forEach(c=>m.set(c,g));
  add([0],"clear"); add([1,2],"partly"); add([3],"cloud"); add([45,48],"fog");
  add([51,53,55,56,57],"drizzle"); add([61,63,65,66,67,80,81,82],"rain");
  add([71,73,75,77,85,86],"snow"); add([95,96,99],"storm");
  return m;                          // anything unmapped falls through to no symbol
})();

// Drawn by hand on a 24x24 box — no icon font, no dependency — then scaled into
// place. cx is the centre of the glyph, top its upper edge.
function weatherGlyph(kind,cx,top,size,fc){
  const soft="var(--ink-soft)", wet="var(--rain)", warm="var(--solar)", cold="var(--cold)";
  const cloud=(dx,dy,sc,f)=>`<g transform="translate(${dx} ${dy}) scale(${sc})" fill="${f}">`
    +`<circle cx="9" cy="13" r="4"/><circle cx="14.8" cy="11.8" r="5"/>`
    +`<rect x="6.6" y="12.6" width="11.6" height="5" rx="2.5"/></g>`;
  const sun=(x,y,r,f)=>{
    let o=`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}"/>`;
    for(let a=0;a<8;a++){
      const t=a*Math.PI/4, dx=Math.cos(t), dy=Math.sin(t);
      o+=`<line x1="${(x+dx*(r+1.7)).toFixed(1)}" y1="${(y+dy*(r+1.7)).toFixed(1)}" `
        +`x2="${(x+dx*(r+3.8)).toFixed(1)}" y2="${(y+dy*(r+3.8)).toFixed(1)}" `
        +`stroke="${f}" stroke-width="1.7" stroke-linecap="round"/>`;
    }
    return o;
  };
  // Three falling strokes, staggered so they don't read as a comb.
  const fall=(f,w,dx,len)=>[8.5,12,15.5].map((x,i)=>{
    const y=19+(i%2)*0.9;
    return `<line x1="${x}" y1="${y}" x2="${(x+dx).toFixed(1)}" y2="${(y+len).toFixed(1)}" `
      +`stroke="${f}" stroke-width="${w}" stroke-linecap="round"/>`;
  }).join("");
  const flakes=()=>[8.5,12,15.5].map((x,i)=>{
    const y=20.2+(i%2)*1.3;
    return [0,60,120].map(a=>{
      const t=a*Math.PI/180, dx=Math.cos(t)*1.9, dy=Math.sin(t)*1.9;
      return `<line x1="${(x-dx).toFixed(1)}" y1="${(y-dy).toFixed(1)}" `
        +`x2="${(x+dx).toFixed(1)}" y2="${(y+dy).toFixed(1)}" `
        +`stroke="${cold}" stroke-width="1.2" stroke-linecap="round"/>`;
    }).join("");
  }).join("");
  let body;
  switch(kind){
    case "clear":   body=sun(12,12,4.8,warm); break;
    case "partly":  body=sun(8.6,8.6,3.7,warm)+cloud(3.4,4.6,0.82,soft); break;
    case "cloud":   body=cloud(0,-1,1,soft); break;
    case "fog":     body=cloud(0,-3.5,1,soft)+[0,1,2].map(i=>
      `<line x1="${6+(i%2)*1.6}" y1="${19.2+i*2.2}" x2="${18-(i%2)*1.6}" y2="${19.2+i*2.2}" `
      +`stroke="${soft}" stroke-width="1.6" stroke-linecap="round"/>`).join(""); break;
    case "drizzle": body=cloud(0,-3.5,1,soft)+fall(wet,1.5,-0.8,2.4); break;
    case "rain":    body=cloud(0,-3.5,1,soft)+fall(wet,1.9,-1.4,4.2); break;
    case "snow":    body=cloud(0,-3.5,1,soft)+flakes(); break;
    case "storm":   body=cloud(0,-4.6,0.95,soft)
      +`<polygon points="13.4,15.6 9.7,21.1 12.1,21.1 10.8,23.8 15.3,18 12.7,18" fill="${warm}"/>`; break;
    default: return "";
  }
  return `<g transform="translate(${(cx-size/2).toFixed(1)} ${top.toFixed(1)}) `
    +`scale(${(size/24).toFixed(4)})"${fc?` opacity="0.7"`:``}>${body}</g>`;
}

function draw(){
  closeFly();                 // the card is anchored to a bucket; a redraw moves it
  closeMsFly();               // likewise: the breakdown is anchored to a table cell
  // The statewide tab draws a map into the same svg, and does not depend on
  // cities[] at all — hence the dispatch before the cities[] guard below.
  if(mode==="ms") return drawMs();
  if(!cities.length) return;
  if(mode==="hot") return drawHot();
  if(mode==="fc") return fcView==="hourly"?drawFcHourly():drawFc();
  if(mode==="ver") return drawVer();
  const svg=$("chart"); $("fig").hidden=false;
  const M=isMobile();
  const solo=cities.length===1?cities[0]:null;
  const hasSoil=!!(solo&&soilOn&&solo.soil);
  const hasSolar=!!(solo&&solarOn);
  const hasHvac=!!(solo&&hvacOn&&solo.hvac);

  let list;
  if(M){
    let p=activePanel;
    if(p==="soil"&&!hasSoil) p="temp";
    if(p==="solar"&&!hasSolar) p="temp";
    if(p==="hvac"&&!hasHvac) p="temp";
    if(!solo&&(p==="soil"||p==="solar"||p==="hvac")) p="temp";
    list=[p];
  }else{
    list=["temp","rain"];
    // HVAC sits directly under the weather it answers to, above the two optional
    // ERA5 panels: the question it exists for is runtime against the day's heat.
    if(hasHvac) list.push("hvac");
    if(hasSoil) list.push("soil");
    if(hasSolar) list.push("solar");
  }
  const showSoil=list.includes("soil"), showSolar=list.includes("solar");
  const showHvac=list.includes("hvac");

  // Visible buckets: whole buckets that overlap the view, so a month bar always sums
  // its whole month even when only part of it is on screen.
  const B=buildBuckets(gran).filter(b=>b.idxs[b.idxs.length-1]>=view.a && b.idxs[0]<=view.b);
  if(!B.length) return;
  const NB=B.length;

  const W=M?380:1000;
  const L=M?34:52;
  const R=(showSolar||showHvac)?(M?24:38):(M?8:12);
  const iw=W-L-R;

  // A condition symbol per day in its own row above the panels. Day granularity
  // only — a week has no single condition — one city only, and only while the
  // glyphs have room to sit side by side without touching.
  const symSize=M?15:17;
  const showSym=!!solo&&gran==="day"&&(NB<2?iw:iw/(NB-1))>=symSize+3;

  const geom={}; let y=M?12:14, symTop=null;
  if(showSym){ symTop=y; y+=symSize+(M?6:8); }
  list.forEach(p=>{
    const lab=(p==="temp")?((M&&gran!=="day")?20:0):(M?20:22);
    const h=M?(p==="temp"?252:210)
             :(p==="temp"?294:p==="rain"?104:p==="hvac"?104:p==="soil"?88:96);
    y+=lab; geom[p]={top:y,h}; y+=h+(M?0:42);
  });
  const BOT=y-(M?0:42);
  const XLAB=BOT+(M?20:24), H=XLAB+(M?14:18);
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const has=p=>!!geom[p];
  const X=i=>L+(NB<2?iw/2:i*iw/(NB-1));

  // Pre-aggregate every city and the normals once per draw.
  const A=new Map(cities.map(c=>[c,B.map(b=>aggCity(c,b))]));
  const CN=(solo&&solo.clim)?B.map(b=>aggClim(solo.clim,b)):null;

  // Wettest and driest years on the rain panel, the same encoding the Hot days tab
  // uses. Day aggregation is excluded on purpose: one specific year's rainfall on
  // one date is noise, unlike the ±7-day-smoothed normal it would sit next to.
  const rainRec=(solo&&gran!=="day")?rainExtremes(solo):null;
  const wetB=rainRec?B.map(b=>bucketSum(rainRec.wet.byKey,b)):null;
  const dryB=rainRec?B.map(b=>bucketSum(rainRec.dry.byKey,b)):null;

  // Split at the first fully-forecast bucket, overlapping by one so lines join.
  // The dashes start where measurement stops, which is the first estimated day,
  // not merely the first day after today.
  let firstFc=B.findIndex((b,i)=>b.allFc||!!(solo&&A.get(solo)[i]&&A.get(solo)[i].est));
  const boundary=firstFc===-1?NB-1:Math.max(0,firstFc-1);
  const poly=(arr,f,past)=>{
    const out=[];
    arr.forEach((r,i)=>{
      if(r==null) return;
      if(past?i>boundary:i<boundary) return;
      const v=f(r); if(v==null||!isFinite(v)) return;
      out.push(`${X(i).toFixed(1)},${v.toFixed(1)}`);
    });
    return out;
  };
  const emit=(arr,f,cls,extra)=>{
    let s="";
    [[true,cls],[false,cls+" fc"]].forEach(([past,c])=>{
      const p=poly(arr,f,past);
      if(p.length>1) s+=`<polyline class="${c}" ${extra||""} points="${p.join(" ")}"/>`;
    });
    return s;
  };

  let s="";

  /* temperature */
  let Y=null;
  if(has("temp")){
    const g=geom.temp;
    let lo=Infinity,hi=-Infinity;
    cities.forEach(c=>A.get(c).forEach(r=>{ if(!r) return;
      if(solo){lo=Math.min(lo,r.lo); hi=Math.max(hi,r.hi);} else {lo=Math.min(lo,r.mean); hi=Math.max(hi,r.mean);}}));
    if(CN) CN.forEach(n=>{ if(n){lo=Math.min(lo,n.lo); hi=Math.max(hi,n.hi);} });
    if(!isFinite(lo)){lo=40;hi=90;}
    const y0=Math.floor((lo-4)/10)*10, y1=Math.ceil((hi+4)/10)*10;
    Y=v=>g.top+g.h-(v-y0)/(y1-y0)*g.h;
    const step=(M&&y1-y0>60)?20:10;
    for(let v=y0;v<=y1;v+=step)
      s+=`<line class="gridline" x1="${L}" y1="${Y(v).toFixed(1)}" x2="${W-R}" y2="${Y(v).toFixed(1)}"/>`
        +`<text x="${L-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end">${v}°</text>`;
    // No axis title — the ° on every tick already says what this is. The week and
    // month wording stays, because it changes what the two lines mean.
    if(gran!=="day") s+=`<text class="panellabel" x="${L}" y="${g.top-6}">`
      +`Mean daily high and low per ${gran}</text>`;
  }

  /* rainfall */
  let PY=null;
  if(has("rain")){
    const g=geom.rain;
    let pmax=0;
    if(solo){
      A.get(solo).forEach(r=>{ if(r&&r.rain!=null) pmax=Math.max(pmax,r.rain); });
      if(CN) CN.forEach(n=>{ if(n&&n.pr!=null) pmax=Math.max(pmax,n.pr); });
      if(wetB) wetB.forEach(v=>{ if(v!=null) pmax=Math.max(pmax,v); });
      pmax=gran==="day"?Math.max(0.25,Math.ceil(pmax*4)/4):Math.max(1,Math.ceil(pmax));
    }else{
      cities.forEach(c=>A.get(c).forEach(r=>{ if(r&&r.cum!=null) pmax=Math.max(pmax,r.cum); }));
      pmax=Math.max(1,Math.ceil(pmax));
    }
    PY=v=>g.top+g.h-(v/pmax)*g.h;
    [0,pmax/2,pmax].forEach(v=>{
      s+=`<line class="gridline" x1="${L}" y1="${PY(v).toFixed(1)}" x2="${W-R}" y2="${PY(v).toFixed(1)}"/>`
        +`<text x="${L-8}" y="${(PY(v)+4).toFixed(1)}" text-anchor="end">${pmax<2?v.toFixed(2):v.toFixed(1)}"</text>`;
    });
    s+=`<text class="panellabel" x="${L}" y="${g.top-6}">`
      +(solo?`Rainfall, ${rainUnit()}`:`Cumulative rain since 1 Jan, in`)+`</text>`;
  }

  /* soil */
  let SY=null;
  if(showSoil){
    const g=geom.soil;
    SY=v=>g.top+g.h-(v/100)*g.h;
    // Gradient runs down the panel in user space, so a point's colour is its percentile.
    s+=`<defs><linearGradient id="soilgrad" gradientUnits="userSpaceOnUse" `
      +`x1="0" y1="${SY(0).toFixed(1)}" x2="0" y2="${SY(100).toFixed(1)}">`
      +SOIL_STOPS.map(([p,c])=>`<stop offset="${p}%" stop-color="${c}"/>`).join("")+`</linearGradient></defs>`
      +`<rect class="normalband" x="${L}" y="${SY(70).toFixed(1)}" width="${iw}" height="${(SY(30)-SY(70)).toFixed(1)}"/>`;
    [0,50,100].forEach(v=>{
      s+=`<line class="gridline" x1="${L}" y1="${SY(v).toFixed(1)}" x2="${W-R}" y2="${SY(v).toFixed(1)}"/>`
        +`<text x="${L-8}" y="${(SY(v)+4).toFixed(1)}" text-anchor="end">${v}</text>`;
    });
    s+=`<text class="panellabel" x="${L}" y="${g.top-6}">Soil 7&ndash;28&thinsp;cm, percentile vs ${SOIL_FROM}&ndash;${SOIL_TO}</text>`;
  }

  /* HVAC runtime */
  let HY=null,IY=null;
  if(showHvac){
    const g=geom.hvac;
    let hmax=0;
    A.get(solo).forEach(r=>{ if(r&&r.hvac)
      hmax=Math.max(hmax,(r.hvac.cool+r.hvac.heat+r.hvac.aux)/60); });
    // Scaled to what the buckets actually reach, not pinned to 24: a day cannot run
    // more than 24 hours but a week or a month can, and a mild week that peaks at two
    // hours deserves the whole panel rather than a flat line along the bottom.
    hmax=Math.max(1,Math.ceil(hmax));
    HY=v=>g.top+g.h-(v/hmax)*g.h;
    [0,hmax/2,hmax].forEach(v=>{
      s+=`<line class="gridline" x1="${L}" y1="${HY(v).toFixed(1)}" x2="${W-R}" y2="${HY(v).toFixed(1)}"/>`
        +`<text x="${L-8}" y="${(HY(v)+4).toFixed(1)}" text-anchor="end">${v%1?v.toFixed(1):v}</text>`;
    });
    // Indoor temperature rides a right-hand axis on this panel rather than joining the
    // outdoor lines above. On the temperature panel it was unreadable exactly when it
    // matters: a Mississippi summer holds the house near 73°F and the outdoor low near
    // 71–76°F, so the two lines sit on top of each other through the whole cooling
    // season. Here it is next to the runtime it explains — indoor drifting up while the
    // bars grow is a system losing ground, which is the reading worth having.
    let ilo=Infinity,ihi=-Infinity;
    A.get(solo).forEach(r=>{ if(r&&r.hvac&&r.hvac.indoor!=null){
      ilo=Math.min(ilo,r.hvac.indoor); ihi=Math.max(ihi,r.hvac.indoor); } });
    if(isFinite(ilo)){
      // A floor on the span, for the same reason the verification axis starts at zero:
      // a thermostat holds a degree or two, and a range fitted tight to that turns
      // ordinary cycling into a mountain range.
      const mid=(ilo+ihi)/2, span=Math.max(10,ihi-ilo+4);
      const i0=Math.floor(mid-span/2), i1=Math.ceil(mid+span/2);
      IY=v=>g.top+g.h-(v-i0)/(i1-i0)*g.h;
      [i0,Math.round((i0+i1)/2),i1].forEach(v=>{
        s+=`<text x="${W-R+6}" y="${(IY(v)+4).toFixed(1)}" style="fill:var(--indoor)">${v}°</text>`;});
    }
    // Inline style, never a fill= attribute: text{fill:var(--ink-soft)} in the
    // stylesheet beats a presentation attribute and would paint all of these grey.
    s+=`<text class="panellabel" x="${L}" y="${g.top-6}">`
      +`<tspan style="fill:var(--cold)">Cooling</tspan><tspan> · </tspan>`
      +`<tspan style="fill:var(--hot)">heating</tspan><tspan> · </tspan>`
      +`<tspan style="fill:var(--solar)">aux</tspan>`
      +`<tspan> runtime, hours per ${gran} · </tspan>`
      +`<tspan style="fill:var(--indoor)">indoor °F (right)</tspan></text>`;
  }

  /* solar + UV */
  let UY=null,VY=null;
  if(showSolar){
    const g=geom.solar;
    let smax=0,umax=0;
    A.get(solo).forEach(r=>{ if(!r) return;
      if(r.solar!=null) smax=Math.max(smax,r.solar);
      if(r.uv!=null) umax=Math.max(umax,r.uv); });
    if(CN) CN.forEach(n=>{ if(n&&n.sr!=null) smax=Math.max(smax,n.sr); });
    smax=Math.max(1,Math.ceil(smax)); umax=Math.max(4,Math.ceil(umax));
    UY=v=>g.top+g.h-(v/smax)*g.h;
    VY=v=>g.top+g.h-(v/umax)*g.h;
    [0,smax/2,smax].forEach(v=>{
      s+=`<line class="gridline" x1="${L}" y1="${UY(v).toFixed(1)}" x2="${W-R}" y2="${UY(v).toFixed(1)}"/>`
        +`<text x="${L-8}" y="${(UY(v)+4).toFixed(1)}" text-anchor="end">${v.toFixed(1)}</text>`;});
    [0,umax/2,umax].forEach(v=>{
      s+=`<text x="${W-R+6}" y="${(VY(v)+4).toFixed(1)}" style="fill:var(--uv)">${v.toFixed(0)}</text>`;});
    s+=`<text class="panellabel" x="${L}" y="${g.top-6}">`
      +`<tspan style="fill:var(--solar)">Solar kWh/m² per day</tspan><tspan> · </tspan>`
      +`<tspan style="fill:var(--uv)">UV index (right)</tspan></text>`;
  }

  /* x axis */
  const rule=i=>list.map(p=>`<line class="monthrule" x1="${X(i).toFixed(1)}" y1="${geom[p].top}" `
    +`x2="${X(i).toFixed(1)}" y2="${geom[p].top+geom[p].h}"/>`).join("");
  const maxLab=M?5:12;
  const step=Math.max(1,Math.ceil(NB/maxLab));
  B.forEach((b,i)=>{
    if(i%step) return;
    s+=rule(i)+`<text x="${X(i).toFixed(1)}" y="${XLAB}" text-anchor="middle">${b.label}</text>`;
  });

  /* weather symbols */
  if(showSym){
    const a=A.get(solo);
    B.forEach((b,i)=>{
      const r=a[i]; if(!r||r.wc==null) return;
      const kind=WMO_GLYPH.get(r.wc); if(!kind) return;
      s+=weatherGlyph(kind,X(i),symTop,symSize,b.allFc);
    });
  }

  /* series */
  if(has("temp")){
    if(solo){
      if(CN){
        const top=CN.map((n,i)=>n?`${X(i).toFixed(1)},${Y(n.hi).toFixed(1)}`:null).filter(Boolean);
        const bot=CN.map((n,i)=>n?`${X(i).toFixed(1)},${Y(n.lo).toFixed(1)}`:null).filter(Boolean);
        if(top.length>1) s+=`<polygon class="normalband" points="${top.join(" ")} ${bot.slice().reverse().join(" ")}"/>`
          +`<polyline class="normaledge" points="${top.join(" ")}"/>`
          +`<polyline class="normaledge" points="${bot.join(" ")}"/>`;
      }
      const a=A.get(solo);
      s+=emit(a,r=>Y(r.hi),"hi")+emit(a,r=>Y(r.lo),"lo")+emit(a,r=>Y(r.mean),"meanline");
      if(NB<=60&&(NB<2?iw:iw/(NB-1))<2*(M?10:11.5))
        a.forEach((r,i)=>{ if(r) s+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(r.mean).toFixed(1)}" `
          +`r="2.4" fill="var(--ink)"${B[i].allFc?' fill-opacity="0.5"':''}/>`; });
      {
        const g=geom.temp, gap=M?44:62, maxN=M?5:9;
        const spacing=NB<2?iw:iw/(NB-1);
        const rr=M?10:11.5, fs=M?10:10.5;
